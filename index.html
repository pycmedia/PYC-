        {buckets.map(b => { const c = filtered.filter(t => t.status === b).length + (statusFilter === b ? 0 : 0); const totalForBucket = (teamFilter === 'all' ? tasks : tasks.filter(t => teamFilter === 'unassigned' ? taskTeamId(t) === 'unassigned' : taskTeamId(t) === teamFilter)).filter(t => t.status === b).length; return <Pill key={b} label={`${STATUS_COLORS[b].label} (${totalForBucket})`} active={statusFilter === b} onClick={() => setStatusFilter(b)} />; })}

function Pill({ label, active, onClick }) { return <button onClick={onClick} style={{ padding: '7px 14px', borderRadius: 999, fontSize: 12.5, fontWeight: 500, background: active ? 'var(--coral)' : 'var(--card)', color: active ? 'white' : 'var(--ink-soft)', border: '1px solid ' + (active ? 'var(--coral)' : 'var(--line)'), transition: 'all 0.15s', boxShadow: active ? '0 1.5px 0 var(--coral-deep)' : 'none' }}>{label}</button>; }
function TaskRow({ task, team, teams, clients, compact, onClick, onStatusChange }) {

                <strong style={{ color: 'var(--ink)', fontWeight: 500 }}>{member.name}</strong>
                {memberTeam && <span style={{ color: 'var(--muted)' }}>· {memberTeam.name}</span>}
              </span>
            ) : (
              <span style={{ color: 'var(--muted)', fontStyle: 'italic' }}>unassigned</span>
            )}
            {assignedLabel && <><span style={{ color: 'var(--muted)' }}>·</span><span className="hand" style={{ color: 'var(--ink-soft)', fontSize: 12.5 }}>assigned {assignedLabel}</span></>}
          </div>
        )}
        {!compact && !isDone && task.description && <p className="text-xs leading-snug truncate mt-1" style={{ color: 'var(--ink-soft)' }}>{task.description.slice(0, 90)}{task.description.length > 90 ? '...' : ''}</p>}
      </div>
      <div className="flex items-center gap-2 flex-shrink-0">
        {client && <span className="badge" style={{ background: 'var(--lavender-soft)', color: 'var(--lavender)' }}>{client.name}</span>}
        {task.quantityTarget != null && task.quantityTarget > 0 && (
          <span className="badge" style={{
            background: (task.quantityDone || 0) >= task.quantityTarget ? 'var(--sage-soft)' : 'var(--coral-soft)',

// ====== MEMBER REPORT MODAL ======
function MemberReportModal({ member, memberTeam, allTasks, clients, onClose }) {
  // Load saved preferences from localStorage
  const loadPref = (key, fallback) => {
    try { const v = localStorage.getItem('reportPref_' + key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; }
  };
  const savePref = (key, val) => { try { localStorage.setItem('reportPref_' + key, JSON.stringify(val)); } catch {} };

  const [rangeKey, setRangeKey] = useState(loadPref('range', 'last30'));
  const [customStart, setCustomStart] = useState(loadPref('customStart', ''));
  const [customEnd, setCustomEnd] = useState(loadPref('customEnd', today()));
  const [statusFilter, setStatusFilter] = useState(loadPref('status', 'all'));
  const [clientFilter, setClientFilter] = useState(loadPref('client', 'all'));
  const [includeQty, setIncludeQty] = useState(loadPref('qty', true));
  const [groupByClient, setGroupByClient] = useState(loadPref('group', true));
  const [includeDescriptions, setIncludeDescriptions] = useState(loadPref('descs', false));
  const [format, setFormat] = useState(loadPref('format', 'pdf'));

  // Compute date range based on preset or custom
  const todayDate = new Date();
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const { start, end, label } = (() => {
    const t = new Date(todayDate);
    if (rangeKey === 'today') return { start: ymd(t), end: ymd(t), label: 'Today' };
    if (rangeKey === 'thisWeek') { const d = new Date(t); d.setDate(t.getDate() - t.getDay()); return { start: ymd(d), end: ymd(t), label: 'This week' }; }
    if (rangeKey === 'last30') { const d = new Date(t); d.setDate(t.getDate() - 30); return { start: ymd(d), end: ymd(t), label: 'Last 30 days' }; }
    if (rangeKey === 'thisMonth') return { start: `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-01`, end: ymd(t), label: 'This month' };
    if (rangeKey === 'lastMonth') { const d = new Date(t.getFullYear(), t.getMonth() - 1, 1); const endD = new Date(t.getFullYear(), t.getMonth(), 0); return { start: ymd(d), end: ymd(endD), label: 'Last month' }; }
    if (rangeKey === 'thisQuarter') { const q = Math.floor(t.getMonth() / 3); const d = new Date(t.getFullYear(), q * 3, 1); return { start: ymd(d), end: ymd(t), label: 'This quarter' }; }
    if (rangeKey === 'thisYear') return { start: `${t.getFullYear()}-01-01`, end: ymd(t), label: 'This year' };
    if (rangeKey === 'allTime') return { start: '2000-01-01', end: ymd(t), label: 'All time' };
    // custom
    return { start: customStart || '2000-01-01', end: customEnd || ymd(t), label: customStart && customEnd ? `${formatDate(customStart)} – ${formatDate(customEnd)}` : 'Custom' };
  })();

  // Filter tasks by all the criteria
  const filtered = allTasks.filter(t => {
    // Date: use completedAt for done tasks, otherwise assignedDate, otherwise createdAt
    const taskDate = (t.completedAt || t.assignedDate || t.createdAt || '').slice(0, 10);
    if (taskDate < start || taskDate > end) return false;
    if (statusFilter === 'done' && t.status !== 'done') return false;
    if (statusFilter === 'active' && t.status === 'done') return false;
    if (clientFilter !== 'all' && t.clientId !== clientFilter) return false;
    return true;
  });

  const totalQtyTarget = filtered.reduce((s, t) => s + (t.quantityTarget || 0), 0);
  const totalQtyDone = filtered.reduce((s, t) => s + (t.quantityDone || 0), 0);

  // Persist whatever changes
  const handleSave = (key, val, setter) => { setter(val); savePref(key, val); };

  const handleGenerate = () => {
    if (filtered.length === 0) { alert('No tasks match these filters. Try widening the date range.'); return; }
    savePref('range', rangeKey);
    savePref('status', statusFilter);
    savePref('client', clientFilter);
    savePref('qty', includeQty);
    savePref('group', groupByClient);
    savePref('descs', includeDescriptions);
    savePref('format', format);
    if (rangeKey === 'custom') { savePref('customStart', customStart); savePref('customEnd', customEnd); }
    const opts = { includeQty, groupByClient, includeDescriptions };
    if (format === 'pdf' || format === 'both') generateMemberReportPDF(member, memberTeam, filtered, clients || [], label, opts);
    if (format === 'excel' || format === 'both') exportMemberReportExcel(member, memberTeam, filtered, clients || [], label, opts);
    onClose();
  };

  const clientCounts = {};
  allTasks.forEach(t => { if (t.clientId) clientCounts[t.clientId] = (clientCounts[t.clientId] || 0) + 1; });
  const usedClients = (clients || []).filter(c => clientCounts[c.id]);

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(58,45,45,0.3)', backdropFilter: 'blur(4px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100, padding: 20 }} onClick={onClose}>
      <div className="card scale-in" style={{ maxWidth: 560, width: '100%', maxHeight: '92vh', overflow: 'auto', padding: 22 }} onClick={e => e.stopPropagation()}>
        {/* Header */}
        <div className="flex items-start gap-3 pb-4 mb-4" style={{ borderBottom: '1px solid var(--line)' }}>
          <div style={{ width: 40, height: 40, borderRadius: 12, background: 'var(--coral-soft)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><FileText size={16} color="var(--coral-deep)" /></div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <h2 className="display" style={{ fontSize: '1.2rem', fontWeight: 500, margin: 0, lineHeight: 1.1 }}>Generate report — {member.name}</h2>
            <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '0.95rem', margin: '2px 0 0' }}>customize what's included ✨</p>
          </div>
          <button onClick={onClose} style={{ background: 'transparent', border: 'none', color: 'var(--muted)', fontSize: 18, cursor: 'pointer', padding: 4, lineHeight: 1 }}>✕</button>
        </div>

        {/* Time range */}
        <div className="mb-4">
          <p className="text-xs font-semibold mb-2" style={{ color: 'var(--ink-soft)', letterSpacing: 0.4 }}>TIME RANGE</p>
          <div className="flex gap-1.5 flex-wrap mb-2">
            {[
              { id: 'today', label: 'Today' }, { id: 'thisWeek', label: 'This week' }, { id: 'last30', label: 'Last 30 days' },
              { id: 'thisMonth', label: 'This month' }, { id: 'lastMonth', label: 'Last month' }, { id: 'thisQuarter', label: 'This quarter' },
              { id: 'thisYear', label: 'This year' }, { id: 'allTime', label: 'All time' }, { id: 'custom', label: 'Custom...' },
            ].map(p => (
              <Pill key={p.id} label={p.label} active={rangeKey === p.id} onClick={() => handleSave('range', p.id, setRangeKey)} />
            ))}
          </div>
          {rangeKey === 'custom' ? (
            <div className="grid grid-cols-2 gap-2 mt-2">
              <Field label="Start"><input type="date" className="input-field" value={customStart} onChange={e => handleSave('customStart', e.target.value, setCustomStart)} /></Field>
              <Field label="End"><input type="date" className="input-field" value={customEnd} onChange={e => handleSave('customEnd', e.target.value, setCustomEnd)} /></Field>
            </div>
          ) : (
            <p className="text-xs italic" style={{ color: 'var(--ink-soft)', margin: 0 }}>selected range: <strong>{formatDate(start)} → {formatDate(end)}</strong></p>
          )}
        </div>

        {/* Filters */}
        <div className="mb-4">
          <p className="text-xs font-semibold mb-2" style={{ color: 'var(--ink-soft)', letterSpacing: 0.4 }}>WHAT TO INCLUDE</p>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Tasks">
              <select className="input-field" value={statusFilter} onChange={e => handleSave('status', e.target.value, setStatusFilter)}>
                <option value="all">All tasks</option>
                <option value="done">Done only</option>
                <option value="active">Active only (todo + in progress)</option>
              </select>
            </Field>
            <Field label="Client">
              <select className="input-field" value={clientFilter} onChange={e => handleSave('client', e.target.value, setClientFilter)}>
                <option value="all">All clients</option>
                {usedClients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </Field>
          </div>
        </div>

        {/* Toggles */}
        <div className="mb-4 p-3" style={{ background: 'var(--bg-warmer)', borderRadius: 10 }}>
          <ToggleRow label="Include quantities" hint="(target / done numbers)" checked={includeQty} onChange={v => handleSave('qty', v, setIncludeQty)} />
          <ToggleRow label="Group by client" hint="(cleaner layout)" checked={groupByClient} onChange={v => handleSave('group', v, setGroupByClient)} />
          <ToggleRow label="Include task descriptions" hint="(longer report)" checked={includeDescriptions} onChange={v => handleSave('descs', v, setIncludeDescriptions)} />
        </div>

        {/* Format */}
        <div className="mb-4">
          <p className="text-xs font-semibold mb-2" style={{ color: 'var(--ink-soft)', letterSpacing: 0.4 }}>FORMAT</p>
          <div className="grid grid-cols-3 gap-2">
            {[{ id: 'pdf', emoji: '📄', label: 'PDF' }, { id: 'excel', emoji: '📊', label: 'Excel' }, { id: 'both', emoji: '📄📊', label: 'Both' }].map(f => (
              <button key={f.id} onClick={() => handleSave('format', f.id, setFormat)} style={{
                background: format === f.id ? 'var(--coral-soft)' : 'white',
                border: `2px solid ${format === f.id ? 'var(--coral)' : 'var(--line)'}`,
                color: format === f.id ? 'var(--coral-deep)' : 'var(--ink-soft)',
                padding: 9, borderRadius: 10, fontSize: 12,
                fontWeight: format === f.id ? 600 : 500,
                cursor: 'pointer', textAlign: 'center', lineHeight: 1.4,
              }}>{f.emoji}<br />{f.label}</button>
            ))}
          </div>
        </div>

        {/* Live summary */}
        <div className="mb-4 p-3" style={{ background: '#f9f5ee', borderLeft: '3px solid var(--coral)', borderRadius: 6 }}>
          <p className="text-xs" style={{ color: 'var(--ink-soft)', margin: 0, lineHeight: 1.55 }}>
            <strong>Preview:</strong> {member.name} · {label} · {filtered.length} {filtered.length === 1 ? 'task' : 'tasks'}
            {includeQty && totalQtyTarget > 0 && ` · ${totalQtyDone} of ${totalQtyTarget} deliverables`}
            {groupByClient && ' · grouped by client'}
          </p>
        </div>

        {/* Actions */}
        <div className="flex gap-2 pt-4" style={{ borderTop: '1px solid var(--line)' }}>
          <button onClick={onClose} className="btn-ghost" style={{ flex: 1 }}>Cancel</button>
          <button onClick={handleGenerate} className="btn-primary" style={{ flex: 2 }} disabled={filtered.length === 0}>
            <Download size={13} /> Generate &amp; download
          </button>
        </div>
      </div>
    </div>
  );
}

function ToggleRow({ label, hint, checked, onChange }) {
  return (
    <div className="flex items-center gap-3 py-1.5">
      <button onClick={() => onChange(!checked)} style={{
        width: 34, height: 18, background: checked ? 'var(--coral)' : 'var(--line)',
        borderRadius: 999, border: 'none', cursor: 'pointer', position: 'relative',
        transition: 'background 0.15s', flexShrink: 0,
      }}>
        <span style={{
          position: 'absolute', left: checked ? 18 : 2, top: 2,
          width: 14, height: 14, background: 'white', borderRadius: '50%',
          transition: 'left 0.15s', boxShadow: '0 1px 2px rgba(0,0,0,0.2)',
        }}></span>
      </button>
      <p className="text-sm" style={{ margin: 0, flex: 1 }}>
        <strong>{label}</strong>{hint && <span style={{ color: 'var(--ink-soft)', fontWeight: 400 }}> {hint}</span>}
      </p>
    </div>
  );
}

// ====== MEMBER PROFILE ======
function MemberProfile({ member, memberTeam, tasks, clients, onBack, onEditMember, onAddTask, onEditTask, onQuickStatus, onDeleteTask, onOpenReport }) {
  const [tab, setTab] = useState('tasks');
  const [statusFilter, setStatusFilter] = useState('all');
  const [openMenu, setOpenMenu] = useState(null);
  const avatarBg = memberTeam?.color || 'var(--coral)';

  // Close menu on outside click
  useEffect(() => {
    if (!openMenu) return;
    const close = () => setOpenMenu(null);
    setTimeout(() => document.addEventListener('click', close), 0);
    return () => document.removeEventListener('click', close);
  }, [openMenu]);

  // Filter tasks
  const counts = {
    all: tasks.length,
    progress: tasks.filter(t => t.status === 'progress').length,
    todo: tasks.filter(t => t.status === 'todo').length,
    done: tasks.filter(t => t.status === 'done').length,
  };
  let filtered = tasks;
  if (statusFilter !== 'all') filtered = tasks.filter(t => t.status === statusFilter);

  // Split active vs done for the All view
  const active = filtered.filter(t => t.status !== 'done').sort((a, b) => {
    // Active: by due date asc (no date → end)
    const ad = a.dueDate || '9999-12-31', bd = b.dueDate || '9999-12-31';
    return ad.localeCompare(bd);
  });
  const done = filtered.filter(t => t.status === 'done').sort((a, b) => {
    // Done: most recent first
    const ad = a.completedAt || a.assignedDate || '', bd = b.completedAt || b.assignedDate || '';
    return bd.localeCompare(ad);
  });

  return (
    <div className="fade-in">
      <button onClick={onBack} className="btn-ghost mb-4"><ChevronLeft size={13} /> Back to team</button>

      {/* Header */}
      <div className="flex items-start gap-4 pb-4 mb-5" style={{ borderBottom: '1px solid var(--line)' }}>
        <div style={{ width: 64, height: 64, borderRadius: 18, background: avatarBg + '22', color: avatarBg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: "'Fraunces', serif", fontSize: 28, fontWeight: 500, flexShrink: 0 }}>{member.name[0]?.toUpperCase()}</div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <h2 className="display" style={{ fontSize: '1.5rem', fontWeight: 500, margin: 0, lineHeight: 1.1 }}>{member.name}</h2>
          <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1rem', margin: '2px 0 0' }}>{member.role || 'Team member'}{memberTeam ? ` · ${memberTeam.name} ✨` : ' ✨'}</p>
          <div className="flex flex-wrap gap-3 mt-2" style={{ fontSize: 11.5, color: 'var(--ink-soft)' }}>
            {member.email && <span>📧 {member.email}</span>}
            {member.whatsapp && <span style={{ color: '#25D366' }}>💬 {member.whatsapp}</span>}
          </div>
        </div>
        <div className="flex gap-2">
          <button onClick={onEditMember} className="btn-ghost" style={{ fontSize: 12 }}><Edit2 size={12} /> Edit info</button>
          <button onClick={onOpenReport} style={{ background: 'var(--coral-soft)', color: 'var(--coral-deep)', border: 'none', padding: '6px 12px', borderRadius: 999, fontSize: 12, fontWeight: 600, cursor: 'pointer' }}><FileText size={12} style={{ display: 'inline', marginRight: 4 }} /> Report</button>
        </div>
      </div>

      {/* Tabs */}
      <div style={{ display: 'flex', gap: 4, borderBottom: '1px solid var(--line)', marginBottom: 18 }}>
        {[
          { id: 'tasks', label: `Tasks${counts.all ? ` (${counts.all})` : ''}`, icon: '✓' },
          { id: 'overview', label: 'Overview', icon: '📊' },
        ].map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{
            background: 'transparent', border: 'none',
            padding: '8px 14px', borderBottom: tab === t.id ? '2px solid var(--coral)' : '2px solid transparent',
            marginBottom: -1, color: tab === t.id ? 'var(--coral-deep)' : 'var(--ink-soft)',
            fontSize: 12.5, fontWeight: tab === t.id ? 600 : 500, cursor: 'pointer'
          }}>
            <span style={{ marginRight: 4 }}>{t.icon}</span>{t.label}
          </button>
        ))}
      </div>

      {tab === 'tasks' && (
        <div>
          {/* Filter pills + actions */}
          <div className="flex items-center gap-2 mb-4 flex-wrap">
            <Pill label={`All (${counts.all})`} active={statusFilter === 'all'} onClick={() => setStatusFilter('all')} />
            <Pill label={`In progress (${counts.progress})`} active={statusFilter === 'progress'} onClick={() => setStatusFilter('progress')} />
            <Pill label={`To do (${counts.todo})`} active={statusFilter === 'todo'} onClick={() => setStatusFilter('todo')} />
            <Pill label={`Done (${counts.done})`} active={statusFilter === 'done'} onClick={() => setStatusFilter('done')} />
            <div style={{ marginLeft: 'auto' }}>
              <button onClick={onAddTask} className="btn-primary" style={{ padding: '6px 14px', fontSize: 12 }}><Plus size={12} /> New task</button>
            </div>
          </div>

          {filtered.length === 0 ? (
            <EmptyState title="No tasks here" message={statusFilter === 'all' ? `${member.name} doesn't have any tasks yet — assign the first one!` : `Nothing matches the "${statusFilter}" filter.`} action={statusFilter === 'all' ? onAddTask : undefined} actionLabel={statusFilter === 'all' ? 'Add task' : undefined} mood="happy" />
          ) : (
            <>
              {/* Active tasks (in progress + to do) — shown when filter is 'all' */}
              {statusFilter === 'all' && active.length > 0 && active.map(t => <MemberTaskRow key={t.id} task={t} clients={clients} onEditTask={onEditTask} onQuickStatus={onQuickStatus} onDeleteTask={onDeleteTask} openMenu={openMenu} setOpenMenu={setOpenMenu} />)}

              {statusFilter === 'all' && done.length > 0 && (
                <p style={{ fontSize: 10.5, color: 'var(--muted)', letterSpacing: 0.4, fontWeight: 600, margin: '14px 0 6px' }}>RECENTLY DONE</p>
              )}

              {statusFilter === 'all' && done.length > 0 && done.slice(0, 10).map(t => <MemberTaskRow key={t.id} task={t} clients={clients} onEditTask={onEditTask} onQuickStatus={onQuickStatus} onDeleteTask={onDeleteTask} openMenu={openMenu} setOpenMenu={setOpenMenu} />)}

              {statusFilter === 'all' && done.length > 10 && (
                <p className="hand text-center" style={{ color: 'var(--coral-deep)', fontSize: '0.95rem', margin: '10px 0 0' }}>+{done.length - 10} older done tasks — switch to the Done filter to see all ✨</p>
              )}

              {/* Filtered single view */}
              {statusFilter !== 'all' && filtered.map(t => <MemberTaskRow key={t.id} task={t} clients={clients} onEditTask={onEditTask} onQuickStatus={onQuickStatus} onDeleteTask={onDeleteTask} openMenu={openMenu} setOpenMenu={setOpenMenu} />)}
            </>
          )}
        </div>
      )}

      {tab === 'overview' && (
        <MemberOverview member={member} tasks={tasks} clients={clients} />
      )}
    </div>
  );
}

function MemberTaskRow({ task, clients, onEditTask, onQuickStatus, onDeleteTask, openMenu, setOpenMenu }) {
  const client = clients.find(c => c.id === task.clientId);
  const status = STATUS_COLORS[task.status] || {};
  const isDone = task.status === 'done';
  const overdue = !isDone && task.dueDate && task.dueDate < today();
  const borderColor = isDone ? 'var(--sage)' : task.status === 'progress' ? '#d4a652' : 'var(--coral-soft)';
  return (
    <div
      onClick={() => onEditTask(task)}
      style={{
        background: isDone ? 'var(--bg-warmer)' : 'white',
        border: '1px solid var(--line)',
        borderLeft: `3px solid ${borderColor}`,
        borderRadius: 10,
        padding: '11px 14px',
        marginBottom: 6,
        display: 'flex',
        alignItems: 'center',
        gap: 12,
        cursor: 'pointer',
        opacity: isDone ? 0.78 : 1,
        position: 'relative',
        transition: 'all 0.12s',
      }}
      className="card-hover"
    >
      <input
        type="checkbox"
        checked={isDone}
        onClick={e => e.stopPropagation()}
        onChange={e => { e.stopPropagation(); onQuickStatus(task.id, isDone ? 'todo' : 'done'); }}
        style={{ width: 16, height: 16, accentColor: 'var(--sage)', cursor: 'pointer', flexShrink: 0 }}
      />
      <div style={{ flex: 1, minWidth: 0 }}>
        <p style={{ fontSize: 13, fontWeight: 600, margin: 0, lineHeight: 1.3, textDecoration: isDone ? 'line-through' : 'none', color: isDone ? 'var(--ink-soft)' : 'var(--ink)' }}>{task.title}</p>
        <p style={{ fontSize: 11, color: 'var(--ink-soft)', margin: '3px 0 0' }}>
          {client?.name || 'No client'}
          {task.dueDate && !isDone && ` · due ${formatDate(task.dueDate)}`}
          {isDone && task.completedAt && ` · completed ${formatDate(task.completedAt)}`}
          {isDone && !task.completedAt && task.assignedDate && ` · ${formatDate(task.assignedDate)}`}
        </p>
      </div>
      {overdue && <span className="badge" style={{ background: 'var(--pink-soft)', color: 'var(--pink)', fontWeight: 600 }}>Overdue</span>}
      {task.quantityTarget != null && task.quantityTarget > 0 && (
        <span className="badge" style={{
          background: (task.quantityDone || 0) >= task.quantityTarget ? 'var(--sage-soft)' : 'var(--coral-soft)',
          color: (task.quantityDone || 0) >= task.quantityTarget ? 'var(--sage)' : 'var(--coral-deep)',
          fontWeight: 600
        }}>
          {task.quantityDone || 0} / {task.quantityTarget}
        </span>
      )}
      <span className="badge" style={{ background: status.bg, color: status.text, fontWeight: 600 }}>{status.label || task.status}</span>
      <div style={{ position: 'relative' }} onClick={e => e.stopPropagation()}>
        <button onClick={e => { e.stopPropagation(); setOpenMenu(openMenu === task.id ? null : task.id); }} style={{ background: 'transparent', border: 'none', color: 'var(--muted)', fontSize: 18, padding: '4px 6px', cursor: 'pointer', lineHeight: 1 }}>⋮</button>
        {openMenu === task.id && (
          <div onClick={e => e.stopPropagation()} style={{ position: 'absolute', right: 0, top: '100%', marginTop: 4, background: 'white', border: '1px solid var(--line)', borderRadius: 10, boxShadow: '0 6px 24px rgba(58,45,45,0.12)', padding: 4, minWidth: 160, zIndex: 50 }}>
            <button onClick={() => { onEditTask(task); setOpenMenu(null); }} style={{ display: 'block', width: '100%', textAlign: 'left', padding: '7px 10px', background: 'transparent', border: 'none', fontSize: 12, color: 'var(--ink)', cursor: 'pointer', borderRadius: 6 }}>✏️ Edit details</button>
            {task.status !== 'progress' && <button onClick={() => { onQuickStatus(task.id, 'progress'); setOpenMenu(null); }} style={{ display: 'block', width: '100%', textAlign: 'left', padding: '7px 10px', background: 'transparent', border: 'none', fontSize: 12, color: 'var(--ink)', cursor: 'pointer', borderRadius: 6 }}>⏱ Mark in progress</button>}
            {task.status !== 'todo' && <button onClick={() => { onQuickStatus(task.id, 'todo'); setOpenMenu(null); }} style={{ display: 'block', width: '100%', textAlign: 'left', padding: '7px 10px', background: 'transparent', border: 'none', fontSize: 12, color: 'var(--ink)', cursor: 'pointer', borderRadius: 6 }}>○ Mark to do</button>}
            {task.status !== 'done' && <button onClick={() => { onQuickStatus(task.id, 'done'); setOpenMenu(null); }} style={{ display: 'block', width: '100%', textAlign: 'left', padding: '7px 10px', background: 'transparent', border: 'none', fontSize: 12, color: 'var(--ink)', cursor: 'pointer', borderRadius: 6 }}>✓ Mark done</button>}
            <div style={{ height: 1, background: 'var(--line)', margin: '4px 0' }}></div>
            <button onClick={() => { onDeleteTask(task.id); setOpenMenu(null); }} style={{ display: 'block', width: '100%', textAlign: 'left', padding: '7px 10px', background: 'transparent', border: 'none', fontSize: 12, color: 'var(--pink)', cursor: 'pointer', borderRadius: 6 }}>🗑 Delete</button>
          </div>
        )}
      </div>
    </div>
  );
}

function MemberOverview({ member, tasks, clients }) {
  const now = new Date();
  const thisMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const lastMonth = (() => { const d = new Date(now); d.setMonth(d.getMonth() - 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; })();

  const doneThisMonth = tasks.filter(t => t.status === 'done' && (t.completedAt || t.assignedDate || '').startsWith(thisMonth)).length;
  const doneLastMonth = tasks.filter(t => t.status === 'done' && (t.completedAt || t.assignedDate || '').startsWith(lastMonth)).length;
  const lifetimeDone = tasks.filter(t => t.status === 'done').length;
  const currentlyActive = tasks.filter(t => t.status !== 'done').length;

  // Deliverables this month — sum of quantity_done across tasks completed (or active) this month with quantity set
  const thisMonthTasks = tasks.filter(t => (t.completedAt || t.assignedDate || '').startsWith(thisMonth));
  const deliverablesDone = thisMonthTasks.reduce((sum, t) => sum + (t.quantityDone || 0), 0);
  const deliverablesTarget = thisMonthTasks.reduce((sum, t) => sum + (t.quantityTarget || 0), 0);

  // By client
  const byClient = {};
  tasks.forEach(t => {
    if (!t.clientId) return;
    if (!byClient[t.clientId]) byClient[t.clientId] = { total: 0, done: 0 };
    byClient[t.clientId].total++;
    if (t.status === 'done') byClient[t.clientId].done++;
  });
  const clientList = Object.entries(byClient).map(([cid, stats]) => ({ client: clients.find(c => c.id === cid), ...stats })).filter(x => x.client).sort((a, b) => b.total - a.total).slice(0, 8);

  return (
    <div className="space-y-5">
      <div className="grid grid-cols-4 gap-3">
        <div className="card"><p className="stat-num text-2xl" style={{ color: 'var(--coral)' }}>{currentlyActive}</p><p className="text-xs" style={{ color: 'var(--ink-soft)' }}>Active now</p></div>
        <div className="card"><p className="stat-num text-2xl" style={{ color: 'var(--sage)' }}>{doneThisMonth}</p><p className="text-xs" style={{ color: 'var(--ink-soft)' }}>Done this month</p></div>
        <div className="card"><p className="stat-num text-2xl" style={{ color: 'var(--lavender)' }}>{doneLastMonth}</p><p className="text-xs" style={{ color: 'var(--ink-soft)' }}>Done last month</p></div>
        <div className="card"><p className="stat-num text-2xl" style={{ color: 'var(--gold)' }}>{lifetimeDone}</p><p className="text-xs" style={{ color: 'var(--ink-soft)' }}>Done all-time</p></div>
      </div>

      {deliverablesTarget > 0 && (
        <div className="card" style={{ background: 'linear-gradient(135deg, var(--coral-soft), var(--gold-soft))', border: '1px solid var(--line)' }}>
          <div className="flex items-center gap-3">
            <span style={{ fontSize: 28 }}>📦</span>
            <div style={{ flex: 1 }}>
              <p className="display" style={{ fontSize: '1.4rem', fontWeight: 500, margin: 0, lineHeight: 1 }}>
                {deliverablesDone} <span style={{ color: 'var(--ink-soft)', fontSize: '1rem' }}>/ {deliverablesTarget}</span>
              </p>
              <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1rem', margin: '4px 0 0' }}>deliverables this month ✨</p>
              <p className="text-xs" style={{ color: 'var(--ink-soft)', margin: '4px 0 0' }}>across tasks where quantity is tracked · individual items like reels, designs, carousels</p>
            </div>
          </div>
        </div>
      )}

      {clientList.length > 0 && (
        <div className="card">
          <h3 className="display text-lg mb-3">By client</h3>
          <div className="space-y-2">
            {clientList.map(({ client, total, done }) => (
              <div key={client.id} className="flex items-center gap-3 py-2" style={{ borderBottom: '1px solid var(--line)' }}>
                <p className="text-sm font-medium" style={{ flex: 1, margin: 0 }}>{client.name}</p>
                <div style={{ width: 120, height: 4, background: 'var(--line)', borderRadius: 2, overflow: 'hidden' }}>
                  <div style={{ width: total > 0 ? `${(done / total) * 100}%` : '0%', height: '100%', background: 'var(--sage)' }}></div>
                </div>
                <span className="text-xs" style={{ color: 'var(--ink-soft)', minWidth: 60, textAlign: 'right' }}>{done} / {total} done</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {clientList.length === 0 && (
        <div className="card text-center py-6">
          <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1.05rem' }}>no client breakdown yet — assign some tasks to start tracking ✨</p>
        </div>
      )}
    </div>
  );
}

function ClientsView({ clients, comms, tasks, posts, briefs, attachments, workspaceId, userId, onRefreshAttachments, onAdd, onEdit, onLog, onEditBrief, onAddPost, onEditPost }) {
  const [selected, setSelected] = useState(null);
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [clientTab, setClientTab] = useState('overview');
  const sel = clients.find(c => c.id === selected);
  const selComms = comms.filter(c => c.clientId === selected).sort((a, b) => b.date.localeCompare(a.date));
  const selTasks = tasks.filter(t => t.clientId === selected);
  const selBrief = (briefs || []).find(b => b.clientId === selected);
  const selAtts = (attachments || []).filter(a => a.clientId === selected);
  // Reset tab when switching clients
  useEffect(() => { setClientTab('overview'); }, [selected]);

  const PALETTES = [
    { avatar: 'var(--coral)',    glow: 'rgba(232, 145, 119, 0.25)', from: 'var(--coral-soft)',    to: 'var(--gold-soft)' },
    { avatar: 'var(--lavender)', glow: 'rgba(169, 148, 196, 0.30)', from: 'var(--lavender-soft)', to: 'var(--pink-soft)' },
    { avatar: 'var(--gold)',     glow: 'rgba(217, 168, 80, 0.30)',  from: 'var(--gold-soft)',     to: 'var(--coral-soft)' },
    { avatar: 'var(--sage)',     glow: 'rgba(135, 166, 144, 0.30)', from: 'var(--sage-soft)',     to: 'var(--sky-soft)' },
    { avatar: 'var(--sky)',      glow: 'rgba(122, 165, 192, 0.30)', from: 'var(--sky-soft)',      to: 'var(--lavender-soft)' },
    { avatar: 'var(--pink)',     glow: 'rgba(217, 126, 156, 0.30)', from: 'var(--pink-soft)',     to: 'var(--coral-soft)' },
  ];
  const paletteFor = (name) => {
    const s = String(name || '');
    let hash = 0;
    for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
    return PALETTES[hash % PALETTES.length];
  };

  const STATUS_STYLES = {
    active:     { bg: 'var(--sage-soft)',     color: '#5a8068',          dot: 'var(--sage)' },
    onboarding: { bg: 'var(--gold-soft)',     color: '#a07a32',          dot: 'var(--gold)' },
    paused:     { bg: 'var(--line-soft)',     color: 'var(--ink-soft)',  dot: 'var(--muted)' },
    archived:   { bg: 'var(--line-soft)',     color: 'var(--muted)',     dot: 'var(--muted)' },
  };

  const totalActive = clients.filter(c => (c.status || 'active') === 'active').length;
  const totalOnboarding = clients.filter(c => c.status === 'onboarding').length;
  const totalPaused = clients.filter(c => c.status === 'paused').length;
  const totalArchived = clients.filter(c => c.status === 'archived').length;
  const totalPosts = (posts || []).length;
  const totalChats = comms.length;

  const filtered = clients.filter(c => {
    const status = c.status || 'active';
    const matchesSearch = !search.trim() || (c.name + ' ' + (c.contactName || '') + ' ' + (c.contactInfo || '') + ' ' + (c.platforms || '')).toLowerCase().includes(search.toLowerCase().trim());
    const matchesStatus = statusFilter === 'all' || status === statusFilter;
    return matchesSearch && matchesStatus;
  });

  const lastCommLabel = (clientId) => {
    const last = comms.filter(x => x.clientId === clientId).sort((a, b) => b.date.localeCompare(a.date))[0];
    if (!last) return { text: 'no chats yet', isNew: true };
    const days = Math.floor((Date.now() - new Date(last.date).getTime()) / 86400000);
    if (days <= 0) return { text: 'today ✨', isNew: false };
    if (days === 1) return { text: 'yesterday', isNew: false };
    if (days < 7) return { text: days + ' days ago', isNew: false };
    if (days < 30) return { text: Math.floor(days / 7) + 'w ago', isNew: false };
    return { text: formatDate(last.date), isNew: false };
  };

  // ---------- DETAIL VIEW ----------
  if (sel) {
    const palette = paletteFor(sel.name);
    const status = sel.status || 'active';
    const statusStyle = STATUS_STYLES[status] || STATUS_STYLES.active;
    const initial = (sel.name || '?').charAt(0).toUpperCase();
    return (
      <div className="fade-in">
        <button onClick={() => setSelected(null)} className="btn-ghost mb-4"><ChevronLeft size={13} /> All clients</button>
        <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
          <div style={{ height: 110, background: `linear-gradient(135deg, ${palette.from} 0%, ${palette.to} 100%)`, position: 'relative' }}>
            <div style={{ position: 'absolute', top: 16, right: 16 }}>
              <span style={{ background: 'rgba(255,255,255,0.85)', color: statusStyle.color, padding: '5px 12px', borderRadius: 999, fontSize: 11.5, fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 6, backdropFilter: 'blur(8px)' }}><span style={{ width: 6, height: 6, borderRadius: '50%', background: statusStyle.dot }}></span>{status}</span>
            </div>
            <div style={{ position: 'absolute', bottom: -32, left: 24, width: 80, height: 80, borderRadius: 22, background: palette.avatar, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontFamily: 'Fraunces, serif', fontWeight: 500, fontSize: 36, border: '5px solid white', boxShadow: `0 4px 14px ${palette.glow}` }}>{initial}</div>
          </div>
          <div style={{ padding: '44px 28px 28px' }}>
            <div className="flex items-start justify-between mb-5">
              <div>
                <h2 className="display text-3xl" style={{ lineHeight: 1.1 }}>{sel.name}</h2>
                {sel.contactName && <p className="text-sm mt-1.5" style={{ color: 'var(--ink-soft)' }}>{sel.contactName}</p>}
              </div>
              <div className="flex gap-2">
                <button className="btn-ghost" onClick={() => onLog(sel)}><MessageSquare size={12} /> Log chat</button>
                <button className="btn-ghost" onClick={() => onEdit(sel)}><Edit2 size={12} /> Edit</button>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3 mb-5 p-4" style={{ background: 'var(--bg-warmer)', borderRadius: 14 }}>
              {sel.contactInfo && <div><p className="text-xs mb-1" style={{ color: 'var(--ink-soft)' }}>Contact</p><p className="text-sm font-medium">{sel.contactInfo}</p></div>}
              {sel.platforms && <div><p className="text-xs mb-1" style={{ color: 'var(--ink-soft)' }}>Platforms</p><p className="text-sm font-medium">{sel.platforms}</p></div>}
            </div>
            {(sel.instagram || sel.facebook || sel.linkedin || sel.website) && (
              <div className="mb-5">
                <p className="text-xs font-semibold mb-2" style={{ color: 'var(--ink-soft)', letterSpacing: 0.3 }}>SOCIAL LINKS</p>
                <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
                  {sel.instagram && <a href={sel.instagram} target="_blank" rel="noopener noreferrer" style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '7px 12px', borderRadius: 999, background: 'var(--coral-soft)', color: 'var(--coral-deep)', fontSize: 12, fontWeight: 500, textDecoration: 'none' }}><Instagram size={12} color="var(--coral-deep)" /> Instagram <ExternalLink size={10} color="var(--coral-deep)" style={{ opacity: 0.6 }} /></a>}
                  {sel.facebook && <a href={sel.facebook} target="_blank" rel="noopener noreferrer" style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '7px 12px', borderRadius: 999, background: 'var(--sky-soft)', color: '#4a7591', fontSize: 12, fontWeight: 500, textDecoration: 'none' }}><Facebook size={12} color="#4a7591" /> Facebook <ExternalLink size={10} color="#4a7591" style={{ opacity: 0.6 }} /></a>}
                  {sel.linkedin && <a href={sel.linkedin} target="_blank" rel="noopener noreferrer" style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '7px 12px', borderRadius: 999, background: 'var(--lavender-soft)', color: '#7d63a3', fontSize: 12, fontWeight: 500, textDecoration: 'none' }}><Linkedin size={12} color="#7d63a3" /> LinkedIn <ExternalLink size={10} color="#7d63a3" style={{ opacity: 0.6 }} /></a>}
                  {sel.website && <a href={sel.website} target="_blank" rel="noopener noreferrer" style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '7px 12px', borderRadius: 999, background: 'var(--line-soft)', color: 'var(--ink-soft)', fontSize: 12, fontWeight: 500, textDecoration: 'none' }}><ExternalLink size={12} color="var(--ink-soft)" /> Website</a>}
                </div>
              </div>
            )}
            {sel.notes && <div className="mb-5 p-4" style={{ background: 'var(--bg-warmer)', borderRadius: 14 }}><p className="text-xs mb-1.5" style={{ color: 'var(--ink-soft)' }}>Notes</p><p className="text-sm leading-relaxed" style={{ whiteSpace: 'pre-wrap' }}>{sel.notes}</p></div>}

            <div style={{ display: 'flex', gap: 6, marginBottom: 18, flexWrap: 'wrap', borderBottom: '1px solid var(--line)', paddingBottom: 0 }}>
              {[
                { id: 'overview', label: 'Overview', icon: '✨' },
                { id: 'brief', label: 'Brand brief', icon: '📖' },
                { id: 'files', label: 'Files', count: selAtts.length, icon: '📎' },
                { id: 'calendar', label: 'Content calendar', icon: '📅' },
                { id: 'conversations', label: 'Conversations', count: selComms.length, icon: '💬' },
              ].map(t => (
                <button key={t.id} onClick={() => setClientTab(t.id)} style={{
                  background: 'transparent', border: 'none',
                  padding: '8px 14px', borderBottom: clientTab === t.id ? '2px solid var(--coral)' : '2px solid transparent',
                  marginBottom: -1, color: clientTab === t.id ? 'var(--coral-deep)' : 'var(--ink-soft)',
                  fontSize: 12.5, fontWeight: clientTab === t.id ? 600 : 500, cursor: 'pointer'
                }}>
                  <span style={{ marginRight: 4 }}>{t.icon}</span>{t.label}{t.count !== undefined && t.count > 0 ? ` (${t.count})` : ''}
                </button>
              ))}
            </div>

            {clientTab === 'overview' && (
              <div>
                <div className="mb-5">
                  <h3 className="display text-lg mb-3">Active tasks</h3>
                  {selTasks.filter(t => t.status !== 'done').length === 0 ? <p className="text-sm py-1" style={{ color: 'var(--ink-soft)' }}>No active tasks.</p> : <div className="space-y-2">{selTasks.filter(t => t.status !== 'done').slice(0, 5).map(t => <div key={t.id} className="p-3 flex items-center justify-between" style={{ background: 'var(--bg-warmer)', borderRadius: 10 }}><p className="text-sm font-medium">{t.title}</p><span className="badge" style={{ background: STATUS_COLORS[t.status]?.bg, color: STATUS_COLORS[t.status]?.text }}>{STATUS_COLORS[t.status]?.label}</span></div>)}</div>}
                </div>
                <div className="grid grid-cols-4 gap-3 mb-5">
                  <div style={{ background: 'var(--bg-warmer)', borderRadius: 12, padding: 14 }}><p className="stat-num" style={{ fontSize: '1.5rem', lineHeight: 1, margin: 0, color: 'var(--coral)' }}>{selTasks.filter(t => t.status !== 'done').length}</p><p className="text-xs" style={{ color: 'var(--ink-soft)', marginTop: 4 }}>Active tasks</p></div>
                  <div style={{ background: 'var(--bg-warmer)', borderRadius: 12, padding: 14 }}><p className="stat-num" style={{ fontSize: '1.5rem', lineHeight: 1, margin: 0, color: 'var(--lavender)' }}>{posts.filter(p => p.clientId === sel.id).length}</p><p className="text-xs" style={{ color: 'var(--ink-soft)', marginTop: 4 }}>Total posts</p></div>
                  <div style={{ background: 'var(--bg-warmer)', borderRadius: 12, padding: 14 }}><p className="stat-num" style={{ fontSize: '1.5rem', lineHeight: 1, margin: 0, color: 'var(--gold)' }}>{selAtts.length}</p><p className="text-xs" style={{ color: 'var(--ink-soft)', marginTop: 4 }}>Files</p></div>
                  <div style={{ background: 'var(--bg-warmer)', borderRadius: 12, padding: 14 }}><p className="stat-num" style={{ fontSize: '1.5rem', lineHeight: 1, margin: 0, color: 'var(--sage)' }}>{selComms.length}</p><p className="text-xs" style={{ color: 'var(--ink-soft)', marginTop: 4 }}>Conversations</p></div>
                </div>
                <p className="hand text-center" style={{ color: 'var(--coral-deep)', fontSize: '1.05rem' }}>tap any tab above for the full view ✨</p>
              </div>
            )}

            {clientTab === 'brief' && (
              <BriefSection client={sel} brief={selBrief} onEdit={() => onEditBrief && onEditBrief(sel)} />
            )}

            {clientTab === 'files' && (
              <div className="mb-5">
                <div className="flex items-center justify-between mb-3">
                  <div>
                    <h3 className="display text-lg" style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                      <span style={{ width: 30, height: 30, borderRadius: 9, background: 'var(--gold-soft)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><Paperclip size={13} color="#a07a32" /></span>
                      Files
                    </h3>
                    <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '0.95rem', marginTop: 2, marginLeft: 38 }}>brand guidelines, logos, assets ✨</p>
                  </div>
                  <FileUploader bucket="client-attachments" parentTable="client_attachments" parentId={sel.id} workspaceId={workspaceId} userId={userId} onUploaded={onRefreshAttachments} compact />
                </div>
                <AttachmentList attachments={selAtts} bucket="client-attachments" canDelete onChanged={onRefreshAttachments} emptyMessage="No files yet. Upload brand guidelines, logos, or anything else your team should reference." />
              </div>
            )}

            {clientTab === 'calendar' && (
              <div>
                <div className="flex items-center justify-between mb-3">
                  <div>
                    <h3 className="display text-lg" style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                      <span style={{ width: 30, height: 30, borderRadius: 9, background: 'var(--lavender-soft)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><Calendar size={13} color="#7d63a3" /></span>
                      Content calendar — {sel.name}
                    </h3>
                    <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '0.95rem', marginTop: 2, marginLeft: 38 }}>just for this brand ✨</p>
                  </div>
                  <div className="flex gap-2">
                    {selBrief && <button onClick={() => onEditBrief && onEditBrief(sel)} className="btn-ghost" style={{ fontSize: 12 }}>📖 Brief</button>}
                    <button onClick={() => onAddPost && onAddPost(null, sel.id)} className="btn-primary" style={{ padding: '6px 13px', fontSize: 12 }}><Plus size={12} /> Post</button>

                <ContentCalendar posts={posts} clients={clients} clientFilter={sel.id} onAddPost={(date) => onAddPost && onAddPost(date, sel.id)} onEditPost={onEditPost} hideSidebar />

              <div className="mb-5">
                <div className="flex items-center justify-between mb-3">

  // ---------- GALLERY VIEW ----------
  return (
    <div className="fade-in">
      {/* Hero header */}
      <div style={{ background: 'linear-gradient(120deg, var(--coral-soft) 0%, var(--gold-soft) 50%, var(--lavender-soft) 100%)', borderRadius: 22, padding: '26px 28px', marginBottom: 22, position: 'relative', overflow: 'hidden' }}>

          <Sunny size={120} mood="happy" />
        </div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', position: 'relative', flexWrap: 'wrap', gap: 16 }}>

          <button className="btn-primary" onClick={onAdd} style={{ padding: '11px 22px', fontSize: 14 }}><Plus size={14} /> Add client</button>
        </div>
      </div>

      {clients.length === 0 ? (
        <EmptyState title="No clients yet" message="add your first brand to start tracking the magic!" action={onAdd} actionLabel="Add client" mood="excited" />

        <>
          {/* Stat tiles */}
          <div className="grid grid-cols-4 gap-2.5 mb-5">
            <StatTile icon={CheckCircle2} iconBg="var(--sage-soft)" iconColor="var(--sage)" value={totalActive} label="Active" />
            <StatTile icon={Lightbulb}    iconBg="var(--gold-soft)" iconColor="#a07a32"      value={totalOnboarding} label="Onboarding" />
            <StatTile icon={TrendingUp}   iconBg="var(--coral-soft)" iconColor="var(--coral-deep)" value={totalPosts} label="Posts shipped" />
            <StatTile icon={MessageSquare} iconBg="var(--lavender-soft)" iconColor="#7d63a3" value={totalChats} label="Conversations" />
          </div>

          {/* Search + filter pills */}
          <div className="flex gap-2.5 mb-5 items-center" style={{ flexWrap: 'wrap' }}>
            <div style={{ position: 'relative', flex: 1, minWidth: 220 }}>
              <Search size={14} color="var(--muted)" style={{ position: 'absolute', left: 14, top: '50%', transform: 'translateY(-50%)' }} />
              <input className="input-field" placeholder="Search by brand, contact or platform..." value={search} onChange={e => setSearch(e.target.value)} style={{ paddingLeft: 38 }} />
            </div>
            <div style={{ display: 'flex', gap: 4, background: 'white', border: '1px solid var(--line)', padding: 4, borderRadius: 999 }}>
              {[
                { id: 'all', label: 'All', count: clients.length },
                { id: 'active', label: 'Active', count: totalActive },
                { id: 'onboarding', label: 'Onboarding', count: totalOnboarding },
                { id: 'paused', label: 'Paused', count: totalPaused },
                ...(totalArchived > 0 ? [{ id: 'archived', label: 'Archived', count: totalArchived }] : []),
              ].map(t => {
                const active = statusFilter === t.id;
                return (
                  <button key={t.id} onClick={() => setStatusFilter(t.id)} style={{ background: active ? 'var(--coral)' : 'transparent', color: active ? 'white' : 'var(--ink-soft)', padding: '6px 13px', border: 'none', borderRadius: 999, fontWeight: 500, fontSize: 12.5, boxShadow: active ? '0 1px 0 var(--coral-deep)' : 'none', cursor: 'pointer', transition: 'all 0.15s' }}>
                    {t.label} <span style={{ opacity: active ? 0.85 : 0.7, marginLeft: 2 }}>{t.count}</span>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Card grid */}
          {filtered.length === 0 ? (
            <div className="card text-center" style={{ padding: '40px 20px' }}>
              <Sunny size={42} mood="sleepy" />
              <p className="display text-lg mt-2 mb-1">No matches</p>
              <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1.05rem' }}>try a different search or filter ✨</p>
            </div>
          ) : (
            <div className="grid grid-cols-3 gap-4">
              {filtered.map(c => {
                const palette = paletteFor(c.name);
                const status = c.status || 'active';
                const statusStyle = STATUS_STYLES[status] || STATUS_STYLES.active;
                const initial = (c.name || '?').charAt(0).toUpperCase();
                const taskCount = tasks.filter(t => t.clientId === c.id && t.status !== 'done').length;
                const postCount = (posts || []).filter(p => p.clientId === c.id).length;
                const chatCount = comms.filter(x => x.clientId === c.id).length;
                const last = lastCommLabel(c.id);
                const handle = c.platforms ? c.platforms.split(',')[0].trim() : (c.contactName || '');
                return (
                  <button key={c.id} onClick={() => setSelected(c.id)} className="card-hover" style={{ background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 20, padding: 0, position: 'relative', overflow: 'hidden', boxShadow: '0 1px 0 var(--line)', textAlign: 'left', cursor: 'pointer' }}>
                    {/* Banner with avatar */}
                    <div style={{ height: 64, background: `linear-gradient(135deg, ${palette.from} 0%, ${palette.to} 100%)`, position: 'relative' }}>
                      <div style={{ position: 'absolute', top: 12, right: 12 }}>
                        <span style={{ background: 'rgba(255,255,255,0.85)', color: statusStyle.color, padding: '3px 10px', borderRadius: 999, fontSize: 10.5, fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 5, backdropFilter: 'blur(8px)' }}>
                          <span style={{ width: 5, height: 5, borderRadius: '50%', background: statusStyle.dot }}></span>{status}
                        </span>
                      </div>
                      <div style={{ position: 'absolute', bottom: -22, left: 18, width: 56, height: 56, borderRadius: 18, background: palette.avatar, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontFamily: 'Fraunces, serif', fontWeight: 500, fontSize: 24, border: '4px solid white', boxShadow: `0 2px 8px ${palette.glow}` }}>{initial}</div>
                    </div>

                    {/* Body */}
                    <div style={{ padding: '30px 18px 18px' }}>
                      <p className="display" style={{ fontWeight: 500, fontSize: 17, margin: '0 0 2px', letterSpacing: '-0.01em', lineHeight: 1.2, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{c.name}</p>
                      <p style={{ fontSize: 12, color: 'var(--ink-soft)', margin: '0 0 14px', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{handle || 'Add a contact'}</p>

                      {/* Stats */}
                      <div style={{ display: 'flex', gap: 8, padding: 12, background: 'var(--bg-warmer)', borderRadius: 12, marginBottom: 12 }}>
                        <div style={{ flex: 1, textAlign: 'center' }}>
                          <p className="stat-num" style={{ fontSize: 17, lineHeight: 1, margin: 0, color: 'var(--coral-deep)' }}>{taskCount}</p>
                          <p style={{ fontSize: 10, color: 'var(--ink-soft)', margin: '4px 0 0', letterSpacing: 0.3, textTransform: 'uppercase' }}>tasks</p>
                        </div>
                        <div style={{ width: 1, background: 'var(--line)' }}></div>
                        <div style={{ flex: 1, textAlign: 'center' }}>
                          <p className="stat-num" style={{ fontSize: 17, lineHeight: 1, margin: 0, color: '#5a8068' }}>{postCount}</p>
                          <p style={{ fontSize: 10, color: 'var(--ink-soft)', margin: '4px 0 0', letterSpacing: 0.3, textTransform: 'uppercase' }}>posts</p>
                        </div>
                        <div style={{ width: 1, background: 'var(--line)' }}></div>
                        <div style={{ flex: 1, textAlign: 'center' }}>
                          <p className="stat-num" style={{ fontSize: 17, lineHeight: 1, margin: 0, color: '#7d63a3' }}>{chatCount}</p>
                          <p style={{ fontSize: 10, color: 'var(--ink-soft)', margin: '4px 0 0', letterSpacing: 0.3, textTransform: 'uppercase' }}>chats</p>
                        </div>
                      </div>

                      {/* Socials + last chat */}
                      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
                        <div style={{ display: 'flex', gap: 5 }}>
                          {c.instagram && <a href={c.instagram} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()} title="Instagram" style={{ width: 26, height: 26, borderRadius: 8, background: 'var(--coral-soft)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', textDecoration: 'none' }}><Instagram size={12} color="var(--coral-deep)" /></a>}
                          {c.facebook && <a href={c.facebook} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()} title="Facebook" style={{ width: 26, height: 26, borderRadius: 8, background: 'var(--sky-soft)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', textDecoration: 'none' }}><Facebook size={12} color="#4a7591" /></a>}
                          {c.linkedin && <a href={c.linkedin} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()} title="LinkedIn" style={{ width: 26, height: 26, borderRadius: 8, background: 'var(--lavender-soft)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', textDecoration: 'none' }}><Linkedin size={12} color="#7d63a3" /></a>}
                          {c.website && <a href={c.website} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()} title="Website" style={{ width: 26, height: 26, borderRadius: 8, background: 'var(--line-soft)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', textDecoration: 'none' }}><ExternalLink size={12} color="var(--ink-soft)" /></a>}
                          {!c.instagram && !c.facebook && !c.linkedin && !c.website && <span style={{ fontSize: 11, color: 'var(--muted)', fontStyle: 'italic' }}>no links yet</span>}
                        </div>
                        <p className="hand" style={{ fontSize: 13, color: last.isNew ? 'var(--muted)' : 'var(--coral-deep)', margin: 0, whiteSpace: 'nowrap' }}>{last.text}</p>
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          )}
        </>
      )}
    </div>
  );
}

function BriefSection({ client, brief, onEdit }) {
  const hasContent = brief && (brief.voice || brief.visualStyle || brief.dos || brief.donts || brief.hashtags || brief.cadence);
  if (!hasContent) {
    return (
      <div className="mb-5" style={{ background: 'linear-gradient(120deg, var(--coral-soft) 0%, var(--gold-soft) 100%)', borderRadius: 14, padding: 16 }}>
        <div className="flex items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            <div style={{ width: 36, height: 36, borderRadius: 10, background: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><FileText size={16} color="var(--coral-deep)" /></div>
            <div>
              <p className="display" style={{ fontSize: 15, fontWeight: 500, margin: 0, lineHeight: 1.2 }}>No brand brief yet</p>
              <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '0.95rem', margin: '2px 0 0' }}>write it once, your team reads it forever ✨</p>
            </div>
          </div>
          <button className="btn-primary" onClick={onEdit} style={{ padding: '6px 14px', fontSize: 12 }}><Plus size={12} /> Add brief</button>
        </div>
      </div>
    );
  }
  return (
    <div className="mb-5">
      <div className="flex items-center justify-between mb-3">
        <h3 className="display text-lg" style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
          <span style={{ width: 30, height: 30, borderRadius: 9, background: 'var(--coral-soft)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><FileText size={13} color="var(--coral-deep)" /></span>
          Brand brief
        </h3>
        <button className="btn-ghost" onClick={onEdit} style={{ fontSize: 11 }}><Edit2 size={11} /> Edit</button>
      </div>
      <div className="grid grid-cols-2 gap-2.5">
        {brief.voice && <BriefCard title="VOICE" icon="✏️" body={brief.voice} bg="var(--coral-soft)" />}
        {brief.visualStyle && <BriefCard title="VISUAL STYLE" icon="🎨" body={brief.visualStyle} bg="var(--lavender-soft)" colors={brief.colorPalette} />}
        {brief.dos && <BriefCard title="DO'S" icon="✓" body={brief.dos} bg="var(--sage-soft)" />}
        {brief.donts && <BriefCard title="DON'TS" icon="✕" body={brief.donts} bg="var(--pink-soft)" />}
        {brief.hashtags && <div style={{ gridColumn: 'span 2' }}><BriefCard title="HASHTAGS & MENTIONS" icon="#" body={brief.hashtags} bg="var(--gold-soft)" hashtags /></div>}
        {brief.cadence && <div style={{ gridColumn: 'span 2' }}><BriefCard title="CADENCE & APPROVAL" icon="🕐" body={brief.cadence} bg="var(--sky-soft)" /></div>}
      </div>
      {brief.updatedAt && <p className="text-xs mt-2" style={{ color: 'var(--muted)', textAlign: 'right' }}>last updated {formatDate(brief.updatedAt)}</p>}
    </div>
  );
}

function BriefCard({ title, icon, body, bg, colors, hashtags }) {
  const colorList = colors ? colors.split(',').map(c => c.trim()).filter(c => /^#[0-9a-f]{3,8}$/i.test(c)) : [];
  return (
    <div style={{ background: bg, borderRadius: 12, padding: 14 }}>
      <div className="flex items-center gap-1.5 mb-2">
        <span style={{ fontSize: 11 }}>{icon}</span>
        <p className="text-xs font-semibold" style={{ color: 'var(--ink-soft)', letterSpacing: 0.3, margin: 0 }}>{title}</p>
      </div>
      {hashtags ? (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
          {body.split(/[\s,]+/).filter(Boolean).map((tag, i) => (
            <span key={i} style={{ background: 'white', border: '1px solid var(--line)', padding: '3px 9px', borderRadius: 999, fontSize: 11, color: 'var(--coral-deep)', fontWeight: 500 }}>{tag}</span>
          ))}
        </div>
      ) : (
        <Linkify text={body} className="text-sm" style={{ lineHeight: 1.55, margin: 0 }} />
      )}
      {colorList.length > 0 && (
        <div style={{ display: 'flex', gap: 4, marginTop: 8 }}>
          {colorList.map((c, i) => <span key={i} title={c} style={{ width: 22, height: 22, borderRadius: 5, background: c, border: '1px solid var(--line)' }}></span>)}
        </div>
      )}
    </div>
  );
}

function BriefModal({ client, brief, workspaceId, userId, onClose, onDone }) {
  const [data, setData] = useState(brief || { clientId: client.id, voice: '', visualStyle: '', colorPalette: '', dos: '', donts: '', hashtags: '', cadence: '', notes: '' });
  const [saving, setSaving] = useState(false);
  const update = (k, v) => setData(d => ({ ...d, [k]: v }));
  const save = async () => {
    setSaving(true);
    const payload = {
      workspace_id: workspaceId,
      client_id: client.id,
      voice: data.voice || null,
      visual_style: data.visualStyle || null,
      color_palette: data.colorPalette || null,
      dos: data.dos || null,
      donts: data.donts || null,
      hashtags: data.hashtags || null,
      cadence: data.cadence || null,
      notes: data.notes || null,
      updated_at: new Date().toISOString(),
      updated_by: userId,
    };
    const op = brief?.id ? sb.from('client_briefs').update(payload).eq('id', brief.id) : sb.from('client_briefs').insert(payload);
    const { error } = await op;
    if (error) { alert('Save failed: ' + error.message); setSaving(false); return; }
    onDone();
  };
  return (
    <ModalShell title={`Brand brief — ${client.name}`} onClose={onClose} onSave={save} saveLabel={saving ? 'Saving...' : 'Save brief'} size={620}>
      <p className="hand mb-3" style={{ color: 'var(--coral-deep)', fontSize: '1rem' }}>everything your team needs to know about this brand ✨</p>
      <Field label="Brand voice"><textarea className="input-field" rows={2} value={data.voice} onChange={e => update('voice', e.target.value)} placeholder="Warm, slightly playful, never preachy..." /></Field>
      <Field label="Visual style"><textarea className="input-field" rows={2} value={data.visualStyle} onChange={e => update('visualStyle', e.target.value)} placeholder="Earthy palette, lots of negative space..." /></Field>
      <Field label={<span>Color palette <span className="hand" style={{ color: 'var(--coral-deep)', fontWeight: 400 }}>(comma-separated hex codes)</span></span>}>

// ====== AUTO-LINKIFY ======
// Detects URLs in plain text and renders them as clickable links while preserving everything else.
const URL_REGEX = /\b((?:https?:\/\/|www\.)[^\s<>"'`]+)/gi;
function Linkify({ text, className, style }) {
  if (!text) return null;
  // Split text into parts, alternating between regular text and URL matches
  const parts = [];
  let lastIndex = 0;
  let match;
  // Need a fresh regex object since we use 'g' flag
  const re = new RegExp(URL_REGEX.source, URL_REGEX.flags);
  while ((match = re.exec(text)) !== null) {
    if (match.index > lastIndex) parts.push({ type: 'text', value: text.slice(lastIndex, match.index) });
    let url = match[0];
    // Strip trailing punctuation that's likely not part of the URL
    let trailing = '';
    while (url.length > 0 && /[.,;:!?)\]}>]/.test(url[url.length - 1])) {
      trailing = url[url.length - 1] + trailing;
      url = url.slice(0, -1);
    }
    const href = url.startsWith('http') ? url : 'https://' + url;
    parts.push({ type: 'link', value: url, href });
    if (trailing) parts.push({ type: 'text', value: trailing });
    lastIndex = match.index + match[0].length;
  }
  if (lastIndex < text.length) parts.push({ type: 'text', value: text.slice(lastIndex) });
  return (
    <span className={className} style={{ whiteSpace: 'pre-wrap', ...(style || {}) }}>
      {parts.map((p, i) => {
        if (p.type === 'link') {
          return <a key={i} href={p.href} target="_blank" rel="noopener noreferrer" style={{ color: 'var(--coral-deep)', textDecoration: 'underline', textDecorationColor: 'var(--coral-soft)', textUnderlineOffset: 2, wordBreak: 'break-all' }}>{p.value}</a>;
        }
        return <React.Fragment key={i}>{p.value}</React.Fragment>;
      })}
    </span>
  );
}

const formatFileSize = (bytes) => {
  if (!bytes) return '0 B';
  const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
};

const fileIconFor = (mime) => {
  if (!mime) return '📄';
  if (mime.startsWith('image/')) return '🖼️';
  if (mime === 'application/pdf') return '📕';
  if (mime.includes('word') || mime.includes('document')) return '📝';
  if (mime.includes('sheet') || mime.includes('excel')) return '📊';
  if (mime.includes('presentation') || mime.includes('powerpoint')) return '📊';
  if (mime.includes('zip') || mime.includes('compressed')) return '🗜️';
  if (mime.startsWith('video/')) return '🎬';
  if (mime.startsWith('audio/')) return '🎵';
  return '📄';
};

function FileUploader({ bucket, parentTable, parentId, workspaceId, userId, onUploaded, readOnly, compact }) {
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState(0);
  const inputRef = useRef(null);

  const handleFiles = async (files) => {
    if (!files || files.length === 0) return;
    setUploading(true);
    let succeeded = 0, failed = 0;
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      setProgress(Math.round(((i) / files.length) * 100));
      if (file.size > MAX_FILE_SIZE) {
        alert(`"${file.name}" is too big (${formatFileSize(file.size)}). Max is ${formatFileSize(MAX_FILE_SIZE)}.`);
        failed++;
        continue;
      }
      // Path: workspace_id/parentId/timestamp-filename
      const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = `${workspaceId}/${parentId}/${Date.now()}-${cleanName}`;
      const { error: uploadErr } = await sb.storage.from(bucket).upload(path, file, { cacheControl: '3600', upsert: false });
      if (uploadErr) {
        alert(`Failed to upload "${file.name}": ${uploadErr.message}`);
        failed++;
        continue;
      }
      // Insert metadata
      const meta = {
        workspace_id: workspaceId,
        file_path: path,
        file_name: file.name,
        file_size: file.size,
        mime_type: file.type || null,
        uploaded_by: userId,
      };
      if (parentTable === 'task_attachments') meta.task_id = parentId;
      else if (parentTable === 'client_attachments') meta.client_id = parentId;
      const { error: metaErr } = await sb.from(parentTable).insert(meta);
      if (metaErr) {
        // Try to clean up the orphaned file
        await sb.storage.from(bucket).remove([path]);
        alert(`Could not save "${file.name}": ${metaErr.message}`);
        failed++;
        continue;
      }
      succeeded++;
    }
    setUploading(false);
    setProgress(0);
    if (inputRef.current) inputRef.current.value = '';
    if (onUploaded) onUploaded();
  };

  if (readOnly) return null;

  return (
    <div>
      <input ref={inputRef} type="file" multiple onChange={e => handleFiles(e.target.files)} style={{ display: 'none' }} disabled={uploading} />
      <button type="button" onClick={() => inputRef.current?.click()} disabled={uploading} className={compact ? 'btn-ghost' : 'btn-primary'} style={compact ? { fontSize: 11.5 } : { padding: '7px 14px', fontSize: 12 }}>
        {uploading ? (
          <>⏳ Uploading{progress > 0 ? ` ${progress}%` : '...'}</>
        ) : (
          <><Paperclip size={12} /> {compact ? 'Attach' : 'Attach files'}</>
        )}
      </button>
    </div>
  );
}

function AttachmentList({ attachments, bucket, canDelete, onChanged, emptyMessage }) {
  const [downloading, setDownloading] = useState({});

  const downloadFile = async (att) => {
    setDownloading(d => ({ ...d, [att.id]: true }));
    const { data, error } = await sb.storage.from(bucket).createSignedUrl(att.filePath, 60);
    setDownloading(d => ({ ...d, [att.id]: false }));
    if (error || !data) { alert('Could not download: ' + (error?.message || 'unknown error')); return; }
    // Trigger download
    const a = document.createElement('a');
    a.href = data.signedUrl;
    a.download = att.fileName || 'download';
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  const deleteFile = async (att) => {
    if (!window.confirm(`Delete "${att.fileName}"? This can't be undone.`)) return;
    // Delete from storage first
    const { error: storageErr } = await sb.storage.from(bucket).remove([att.filePath]);
    if (storageErr) { alert('Storage delete failed: ' + storageErr.message); return; }
    // Then delete the metadata row
    const table = bucket === 'task-attachments' ? 'task_attachments' : 'client_attachments';
    const { error: dbErr } = await sb.from(table).delete().eq('id', att.id);
    if (dbErr) { alert('Metadata delete failed: ' + dbErr.message); return; }
    if (onChanged) onChanged();
  };

  if (!attachments || attachments.length === 0) {
    return emptyMessage ? <p className="text-xs" style={{ color: 'var(--ink-soft)', fontStyle: 'italic' }}>{emptyMessage}</p> : null;
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      {attachments.map(att => (
        <div key={att.id} style={{ background: 'var(--bg-warmer)', border: '1px solid var(--line)', borderRadius: 10, padding: '8px 12px', display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ fontSize: 18, flexShrink: 0 }}>{fileIconFor(att.mimeType)}</span>
          <div style={{ flex: 1, minWidth: 0 }}>
            <p className="text-sm font-medium truncate" style={{ margin: 0 }}>{att.fileName}</p>
            <p className="text-xs" style={{ color: 'var(--muted)', margin: '2px 0 0' }}>{formatFileSize(att.fileSize)}{att.uploadedAt ? ' · ' + formatDate(att.uploadedAt) : ''}</p>
          </div>
          <button onClick={() => downloadFile(att)} disabled={downloading[att.id]} className="btn-ghost" style={{ padding: '4px 9px', fontSize: 11 }} title="Download">
            {downloading[att.id] ? '...' : <><Download size={11} /> Open</>}
          </button>
          {canDelete && <button onClick={() => deleteFile(att)} className="btn-ghost" style={{ padding: 5, fontSize: 11, color: 'var(--pink)' }} title="Delete"><Trash2 size={11} /></button>}
        </div>
      ))}
    </div>
  );
}

function ActivitySection({ activity, taskId, team, clients, currentUserId, currentUserName }) {
  const events = (activity || []).filter(a => a.taskId === taskId).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  if (events.length === 0) return (
    <p className="hand text-center py-3" style={{ color: 'var(--muted)', fontSize: '0.95rem' }}>no activity yet — make a change to see the timeline ✨</p>
  );

  const actorName = (actorId) => {
    if (!actorId) return 'Someone';
    if (actorId === currentUserId) return 'You';
    // Try to find the user by linking through team's email (best effort)
    const memberByEmail = team.find(m => m.email && actorId);
    return memberByEmail?.name || 'A teammate';
  };
  const memberName = (id) => team.find(m => m.id === id)?.name || 'someone';
  const clientName = (id) => clients.find(c => c.id === id)?.name || 'a client';
  const STATUS_LABELS = { todo: 'To do', progress: 'In progress', review: 'Review', done: 'Done', blocked: 'Blocked' };
  const PRIORITY_LABELS = { low: 'Low', medium: 'Medium', high: 'High' };

  const describe = (e) => {
    const who = actorName(e.actorId);
    switch (e.eventType) {
      case 'created': return { icon: '✨', text: <><strong>{who}</strong> created this task</>, color: 'var(--coral)' };
      case 'status_changed': return { icon: '➡️', text: <><strong>{who}</strong> moved status to <strong>{STATUS_LABELS[e.toValue] || e.toValue}</strong></>, color: e.toValue === 'done' ? 'var(--sage)' : 'var(--lavender)' };
      case 'assignee_changed': {
        const newName = e.toValue ? memberName(e.toValue) : null;
        const oldName = e.fromValue ? memberName(e.fromValue) : null;
        if (!e.toValue) return { icon: '👤', text: <><strong>{who}</strong> unassigned this</>, color: 'var(--muted)' };
        if (!e.fromValue) return { icon: '👤', text: <><strong>{who}</strong> assigned to <strong>{newName}</strong></>, color: 'var(--coral)' };
        return { icon: '👤', text: <><strong>{who}</strong> reassigned from {oldName} to <strong>{newName}</strong></>, color: 'var(--coral)' };
      }
      case 'priority_changed': return { icon: '⚡', text: <><strong>{who}</strong> changed priority to <strong>{PRIORITY_LABELS[e.toValue] || e.toValue}</strong></>, color: e.toValue === 'high' ? 'var(--pink)' : 'var(--muted)' };
      case 'due_date_changed': {
        if (!e.toValue) return { icon: '📅', text: <><strong>{who}</strong> removed the due date</>, color: 'var(--muted)' };
        if (!e.fromValue) return { icon: '📅', text: <><strong>{who}</strong> set due date to <strong>{formatDate(e.toValue)}</strong></>, color: 'var(--coral)' };
        return { icon: '📅', text: <><strong>{who}</strong> changed due date to <strong>{formatDate(e.toValue)}</strong></>, color: 'var(--coral)' };
      }
      case 'title_changed': return { icon: '✏️', text: <><strong>{who}</strong> renamed this task</>, color: 'var(--muted)' };
      case 'client_changed': {
        if (!e.toValue) return { icon: '🏢', text: <><strong>{who}</strong> removed client</>, color: 'var(--muted)' };
        return { icon: '🏢', text: <><strong>{who}</strong> linked to <strong>{clientName(e.toValue)}</strong></>, color: 'var(--lavender)' };
      }
      case 'attached': return { icon: '📎', text: <><strong>{who}</strong> attached <strong>{e.toValue}</strong></>, color: 'var(--gold)' };
      case 'detached': return { icon: '📎', text: <><strong>{who}</strong> removed <em>{e.fromValue}</em></>, color: 'var(--muted)' };
      default: return { icon: '•', text: <><strong>{who}</strong> made a change</>, color: 'var(--muted)' };
    }
  };

  const timeAgo = (dateStr) => {
    if (!dateStr) return '';
    const diff = Date.now() - new Date(dateStr).getTime();
    const m = Math.floor(diff / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    const d = Math.floor(h / 24);
    if (d < 7) return d + 'd ago';
    return formatDate(dateStr);
  };

  return (
    <div style={{ maxHeight: 280, overflowY: 'auto', paddingRight: 4 }}>
      <div style={{ position: 'relative' }}>
        <div style={{ position: 'absolute', left: 11, top: 14, bottom: 14, width: 2, background: 'var(--line)', borderRadius: 1 }}></div>
        {events.map(e => {
          const d = describe(e);
          return (
            <div key={e.id} style={{ display: 'flex', alignItems: 'flex-start', gap: 10, padding: '6px 0', position: 'relative' }}>
              <div style={{ width: 24, height: 24, borderRadius: '50%', background: 'white', border: '1.5px solid var(--line)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, flexShrink: 0, position: 'relative', zIndex: 1 }}>{d.icon}</div>
              <div style={{ flex: 1, minWidth: 0, paddingTop: 2 }}>
                <p className="text-xs" style={{ margin: 0, lineHeight: 1.45, color: 'var(--ink)' }}>{d.text}</p>
                <p className="text-xs" style={{ color: 'var(--muted)', margin: '1px 0 0', fontSize: 11 }}>{timeAgo(e.createdAt)}</p>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}
