    --card: #ffffff;
    --ink: #3a2d2d;
    --ink-soft: #6b5856;
    --muted: #a89b97;
    --line: #efe2d3;
    --line-soft: #f7eee0;
    --coral: #e89177;
    --coral-deep: #c97050;
    --coral-soft: #fce5dd;
    --sage: #87a690;
    --sage-soft: #e0ebe2;
    --lavender: #a994c4;
    --lavender-soft: #ece1f0;
    --gold: #d9a850;
    --gold-soft: #f5e9c8;

    --sky: #7aa5c0;

  .scroll-area::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
  .scroll-area::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .display { font-family: 'Fraunces', Georgia, serif; letter-spacing: -0.02em; font-weight: 500; }
  .hand { font-family: 'Caveat', cursive; font-weight: 500; }
  .fade-in { animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .scale-in { animation: scaleIn 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.15); }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .float { animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .wiggle { animation: wiggle 0.4s ease-in-out; }
  @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  .btn-primary { background: var(--coral); color: white; padding: 9px 18px; border: none; border-radius: 999px; font-weight: 600; font-size: 13.5px; transition: all 0.18s; display: inline-flex; align-items: center; gap: 7px; box-shadow: 0 1.5px 0 var(--coral-deep); }
  .btn-primary:hover { background: var(--coral-deep); transform: translateY(-1px); box-shadow: 0 2.5px 0 var(--coral-deep); }
  .btn-primary:active { transform: translateY(1px); box-shadow: 0 0 0 var(--coral-deep); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-ghost { background: var(--card); color: var(--ink); padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px; font-weight: 500; font-size: 13px; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-ghost:hover { background: var(--bg-warmer); border-color: var(--coral); }
  .input-field { width: 100%; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); font-size: 13.5px; color: var(--ink); transition: all 0.15s; }
  .input-field:focus { outline: none; border-color: var(--coral); box-shadow: 0 0 0 3px var(--coral-soft); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; transition: all 0.2s ease; }
  .card-hover:hover { border-color: var(--coral); box-shadow: 0 6px 20px rgba(232, 145, 119, 0.12); transform: translateY(-1px); }
  #boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-weight: 500; font-size: 11px; }
  .confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
  .confetti-piece { position: absolute; width: 9px; height: 9px; opacity: 0; animation: confettiFall 1.8s ease-out forwards; }
  @keyframes confettiFall { 0% { opacity: 1; transform: translateY(-20px) rotate(0); } 100% { opacity: 0; transform: translateY(100vh) rotate(540deg); } }
  .drop-zone { border: 2.5px dashed var(--line); border-radius: 16px; padding: 36px; text-align: center; transition: all 0.2s; cursor: pointer; background: var(--bg-warmer); }
  .drop-zone:hover, .drop-zone.dragging { border-color: var(--coral); background: var(--coral-soft); }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 500; color: var(--ink-soft); transition: all 0.12s; width: 100%; text-align: left; }

  /* ========== MOBILE FOUNDATION ========== */
  .mobile-topbar { display: none; }
  .mobile-tabbar { display: none; }
  .mobile-overlay { display: none; }
  .desktop-only { display: initial; }
  .mobile-only { display: none; }

  @media (max-width: 900px) {
    body { font-size: 15px; }

    /* Hide desktop sidebar */
    .app-sidebar { display: none !important; }

    /* Show mobile sidebar when open */
    .app-sidebar.mobile-open {
      display: flex !important;
      position: fixed !important;
      top: 0; left: 0; bottom: 0;
      width: 80% !important;
      max-width: 300px;
      z-index: 200;
      box-shadow: 4px 0 24px rgba(58, 45, 45, 0.18);
      animation: slideInLeft 0.22s ease-out;
    }
    @keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }

    /* Backdrop when sidebar open */
    .mobile-overlay {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(58, 45, 45, 0.4);
      backdrop-filter: blur(2px);
      z-index: 150;
    }

    /* Mobile top bar */

      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--bg-warmer);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 90;

    .mobile-topbar .hamburger {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: white;
      border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mobile-topbar .brand {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .mobile-topbar .brand p {
      font-family: 'Fraunces', serif;
      font-size: 17px;
      font-weight: 600;
      margin: 0;
      line-height: 1;
    }
    .mobile-topbar .brand .hand-sub {
      font-family: 'Caveat', cursive;
      font-size: 0.95rem;
      color: var(--coral-deep);
      line-height: 1;
      margin-top: 2px;
    }

    /* Main content padding */
    main {
      padding: 18px 16px !important;
      max-width: 100% !important;
      padding-bottom: 88px !important;
    }

    /* Mobile bottom tab bar (member only) */
    .mobile-tabbar {
      display: flex;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid var(--line);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
      justify-content: space-around;
      z-index: 100;
    }
    .mobile-tabbar .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 8px;
      min-height: 44px;
      justify-content: center;
      border: none;
      background: transparent;
    }
    .mobile-tabbar .tab.active { color: var(--coral); }
    .mobile-tabbar .tab .count {
      position: absolute;
      top: 4px;
      right: 20%;
      background: var(--pink);
      color: white;
      font-size: 9px;
      font-weight: 700;
      min-width: 14px;
      height: 14px;
      border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px;
    }
    .mobile-tabbar .tab-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    /* Mobile-friendly: stat grids reflow */
    .grid-cols-4 { grid-template-columns: 1fr 1fr !important; }
    .grid-cols-3 { grid-template-columns: 1fr 1fr !important; }
    .grid-cols-2 { grid-template-columns: 1fr !important; }
    .col-span-2 { grid-column: span 1 !important; }

    /* Modals go near full-screen */
    .modal-shell {
      max-width: 100% !important;
      width: 100% !important;
      max-height: 100vh !important;
      height: 100vh !important;
      border-radius: 0 !important;
      margin: 0 !important;
    }

    /* Tap targets */
    button, .btn-primary, .btn-ghost, .nav-item, .pill, select {
      min-height: 38px;
    }
    button.tap-compact, .btn-ghost.tap-compact { min-height: auto; }

    /* Bigger touch targets on form inputs */
    .input-field { font-size: 16px !important; min-height: 42px; }
    textarea.input-field { min-height: 80px; }

    /* Hide elements marked desktop-only */
    .desktop-only { display: none !important; }
    .mobile-only { display: initial !important; }

    /* Tighter headers on mobile */
    h1.display, h2.display { font-size: 1.4rem !important; line-height: 1.15 !important; }
    h2.display.text-xl { font-size: 1.2rem !important; }

    /* Card padding less aggressive on phone */
    .card { padding: 16px !important; }
  }

  @media (max-width: 480px) {
    /* Phone-specific: single column for tighter grids */
    .grid-cols-3 { grid-template-columns: 1fr !important; }
  }

const today = () => new Date().toISOString().split('T')[0];
const formatDate = (d) => !d ? '—' : new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const formatDateTime = (d) => !d ? '—' : new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const formatMonth = (m) => { if (!m) return '—'; const [y, mo] = m.split('-'); return new Date(y, mo - 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); };
const currentMonth = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
const toCamel = (obj) => { if (!obj || typeof obj !== 'object') return obj; if (Array.isArray(obj)) return obj.map(toCamel); const out = {}; for (const [k, v] of Object.entries(obj)) out[k.replace(/_([a-z])/g, (_, c) => c.toUpperCase())] = v; return out; };
const toSnake = (obj) => { const out = {}; for (const [k, v] of Object.entries(obj)) out[k.replace(/[A-Z]/g, c => '_' + c.toLowerCase())] = v; return out; };
const isInPeriod = (dateStr, period) => { if (period === 'all') return true; if (!dateStr) return false; const d = new Date(dateStr); const now = new Date(); const days = period === 'week' ? 7 : period === 'month' ? 30 : period === 'quarter' ? 90 : 0; if (!days) return true; const cutoff = new Date(now); cutoff.setDate(now.getDate() - days); return d >= cutoff; };

function buildWhatsAppMessage(task, member, client) {
  const lines = [];
  lines.push(`Hi ${member.name},`);
  lines.push('');
  lines.push(`A new task has been assigned to you.`);
  lines.push('');
  lines.push(`Task: *${task.title}*`);
  if (task.description) lines.push(`\nDetails: ${task.description}`);
  lines.push('');
  if (client) lines.push(`Client: *${client.name}*`);
  if (task.priority) lines.push(`Priority: *${task.priority.charAt(0).toUpperCase() + task.priority.slice(1)}*`);
  if (task.dueDate) lines.push(`Due date: *${formatDate(task.dueDate)}*`);
  lines.push('');
  lines.push(`Please reach out if you have any questions or need clarification.`);
  lines.push('');
  lines.push(`Thanks,`);
  lines.push(`Studio`);
  return lines.join('\n');
}

function fireConfetti() {
  const container = document.createElement('div');
  container.className = 'confetti-container';
  document.body.appendChild(container);
  const colors = ['#e89177', '#87a690', '#a994c4', '#f1c462', '#d97e9c', '#7aa5c0'];
  for (let i = 0; i < 35; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 0.2 + 's';
    piece.style.animationDuration = (1.5 + Math.random() * 0.5) + 's';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    container.appendChild(piece);
  }
  setTimeout(() => container.remove(), 2500);
}

const META_METRIC_PATTERNS = {
  followers: ['followers', 'total followers', 'follower count', 'audience'],
  followersGained: ['followers gained', 'new followers', 'follows', 'follower growth', 'net follows'],
  reach: ['reach', 'accounts reached', 'unique accounts reached', 'total reach'],

function parseMetaExcel(data) {
  const found = {}; const wb = XLSX.read(data, { type: 'array' });
  for (const sheetName of wb.SheetNames) {
    const sheet = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
    rows.forEach((row, ri) => {
      if (!Array.isArray(row)) return;
      row.forEach((cell, ci) => {
        if (cell === null || cell === undefined || cell === '') return;
        const text = String(cell).toLowerCase().trim();
        for (const [key, patterns] of Object.entries(META_METRIC_PATTERNS)) {
          if (found[key] !== undefined) continue;
          for (const pattern of patterns) {
            if (text === pattern || text.includes(pattern)) {
              const candidates = [row[ci + 1], row[ci + 2], row[ci + 3], rows[ri + 1]?.[ci], rows[ri + 2]?.[ci], rows[ri + 1]?.[ci + 1]];
              for (const c of candidates) { const num = parseNumeric(c); if (num !== null) { found[key] = num; break; } }
              if (found[key] !== undefined) break;
            }
          }
        }
      });
    });
  }
  return found;
}
function parseNumeric(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return v;
  if (typeof v === 'string') {
    let s = v.replace(/[,\s]/g, '').trim();
    if (s === '') return null;
    let mult = 1;
    if (s.endsWith('%')) s = s.slice(0, -1);
    if (s.endsWith('K') || s.endsWith('k')) { mult = 1000; s = s.slice(0, -1); }
    else if (s.endsWith('M') || s.endsWith('m')) { mult = 1000000; s = s.slice(0, -1); }
    const n = parseFloat(s);
    if (isNaN(n)) return null;
    return n * mult;
  }
  return null;
}

function drawMetricGrid(doc, stats, x, y, width) {
  const colW = width / stats.length;
  stats.forEach((stat, i) => {

  const coverTitle = opts.teamFilter ? `${teams.find(t => t.id === opts.teamFilter)?.name || 'Team'} Report` : 'Studio Bundle Report';
  doc.setFillColor(58, 45, 45); doc.rect(0, 0, pageW, 100, 'F');
  doc.setFillColor(232, 145, 119); doc.rect(0, 96, pageW, 4, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold').setFontSize(24);
  doc.text(coverTitle, margin, 44);
  doc.setFont('helvetica', 'normal').setFontSize(11);
  doc.text(formatDate(from) + ' — ' + formatDate(to), margin, 70);

  let y = 130;
  doc.setTextColor(58, 45, 45);
  doc.setFont('helvetica', 'bold').setFontSize(14);
  doc.text('Summary', margin, y); y += 18;
  doc.setFont('helvetica', 'normal').setFontSize(10);
  doc.setTextColor(107, 88, 86);

  const rangeTasks = tasks.filter(t => inRange(t.createdAt) || inRange(t.dueDate));
  const rangePosts = posts.filter(p => inRange(p.scheduledDate));
  const rangeComms = comms.filter(c => inRange(c.date));
  const rangeIg    = (igReports || []).filter(r => r.month && r.month >= from.slice(0, 7) && r.month <= to.slice(0, 7));
  const rangeStrat = (strategies || []).filter(s => inRange(s.createdAt) || inRange(s.updatedAt));

  const summaryLines = [
    'Generated: ' + new Date().toLocaleDateString(),
    'Tasks in range: ' + rangeTasks.length + ' (' + rangeTasks.filter(t => t.status === 'done').length + ' completed)',
    'Posts published: ' + rangePosts.filter(p => p.status === 'published').length + ' of ' + rangePosts.length,
    'Conversations logged: ' + rangeComms.length,
    'Instagram reports: ' + rangeIg.length,
    'Strategy notes: ' + rangeStrat.length,
  ];
  summaryLines.forEach(line => { doc.text(line, margin, y); y += 14; });
  y += 14;

  const ensureSpace = (h) => { if (y + h > pageH - 60) { doc.addPage(); y = margin; } };
  const sectionHeader = (title, subtitle) => { ensureSpace(40); doc.setTextColor(58, 45, 45); doc.setFont('helvetica', 'bold').setFontSize(14); doc.text(title, margin, y); if (subtitle) { y += 14; doc.setFont('helvetica', 'normal').setFontSize(9); doc.setTextColor(168, 155, 151); doc.text(subtitle, margin, y); } y += 12; };

  // Quantity helpers
  const taskQty = (t) => ({ target: t.quantityTarget || 0, done: t.quantityDone || 0 });
  const sumQty = (taskList) => taskList.reduce((s, t) => { const q = taskQty(t); s.target += q.target; s.done += q.done; return s; }, { target: 0, done: 0 });
  const qtyDisplay = (q) => q.target > 0 ? `${q.done} / ${q.target}` : (q.done > 0 ? `${q.done}` : '—');
  const rateDisplay = (q) => q.target > 0 ? Math.round((q.done / q.target) * 100) + '%' : (q.done > 0 ? '—' : '—');

  // Month label from the 'from' date
  const monthLabel = (() => {
    try { const d = new Date(from + 'T00:00:00'); return d.toLocaleString('en-US', { month: 'long' }); } catch { return ''; }
  })();

  // Team filter (optional — set when called from per-team report flow)
  const teamFilter = opts.teamFilter;

  // ====== TASKS — Total Summary + per-team + per-member blocks ======
  if (includes.tasks && rangeTasks.length > 0) {
    // Filter to team scope if set
    let scopedTasks = rangeTasks;
    if (teamFilter) {
      const teamMemberIds = team.filter(m => m.teamId === teamFilter).map(m => m.id);
      scopedTasks = rangeTasks.filter(t => teamMemberIds.includes(t.assigneeId));
    }

    // Build team groups
    const teamGroups = {};
    teams.forEach(tm => { teamGroups[tm.id] = { team: tm, members: [], tasks: [] }; });
    teamGroups['__no_team__'] = { team: { id: null, name: 'No team' }, members: [], tasks: [] };
    team.forEach(m => {
      const k = m.teamId || '__no_team__';
      if (!teamGroups[k]) teamGroups[k] = { team: { id: m.teamId, name: 'No team' }, members: [], tasks: [] };
      teamGroups[k].members.push(m);
    });
    scopedTasks.forEach(t => {
      const member = team.find(m => m.id === t.assigneeId);
      const k = member?.teamId || '__no_team__';
      if (!teamGroups[k]) teamGroups[k] = { team: { id: member?.teamId, name: 'No team' }, members: [], tasks: [] };
      teamGroups[k].tasks.push(t);
    });
    // Only teams that have tasks in the range
    const teamsWithData = Object.values(teamGroups).filter(g => g.tasks.length > 0).sort((a, b) => b.tasks.length - a.tasks.length);

    // ===== TOTAL SUMMARY table =====
    if (!teamFilter) {
      // (For per-team reports, the summary would be a single-row table — not useful, skip it.)
      sectionHeader('Total Summary');
      const summaryRows = teamsWithData.map(g => {
        const q = sumQty(g.tasks);
        return [g.team.name, String(g.members.length), String(g.tasks.length), qtyDisplay(q), rateDisplay(q)];
      });
      // Grand total
      const grand = teamsWithData.reduce((acc, g) => {
        const q = sumQty(g.tasks);
        acc.members += g.members.length; acc.tasks += g.tasks.length; acc.qDone += q.done; acc.qTarget += q.target;
        return acc;
      }, { members: 0, tasks: 0, qDone: 0, qTarget: 0 });
      summaryRows.push(['Total', String(grand.members), String(grand.tasks),
        grand.qTarget > 0 ? `${grand.qDone} / ${grand.qTarget}` : (grand.qDone > 0 ? String(grand.qDone) : '—'),
        grand.qTarget > 0 ? Math.round((grand.qDone / grand.qTarget) * 100) + '%' : '—']);

      doc.autoTable({
        startY: y,
        head: [['Team', 'Members', 'Tasks', 'Quantity', 'Rate']],
        body: summaryRows,
        margin: { left: margin, right: margin },
        styles: { font: 'helvetica', fontSize: 10, cellPadding: 7, lineColor: [196, 196, 196], lineWidth: 0.5 },
        headStyles: { fillColor: [250, 250, 250], textColor: [58, 45, 45], fontStyle: 'bold' },
        columnStyles: { 1: { halign: 'center' }, 2: { halign: 'center' }, 3: { halign: 'center' }, 4: { halign: 'center' } },
        didParseCell: (data) => {
          if (data.row.raw[0] === 'Total') {
            data.cell.styles.fontStyle = 'bold';
            data.cell.styles.fillColor = [250, 250, 250];
          }
        },
      });
      y = doc.lastAutoTable.finalY + 28;
    }

    // ===== Per-team sections =====
    teamsWithData.forEach(group => {
      ensureSpace(80);

      // Team name heading
      doc.setTextColor(58, 45, 45);
      doc.setFont('helvetica', 'bold').setFontSize(14);
      doc.text(group.team.name, margin, y);
      y += 18;

      // Members in this team with tasks
      const membersWithTasks = group.members.map(m => ({
        member: m,
        tasks: group.tasks.filter(t => t.assigneeId === m.id),
      })).filter(x => x.tasks.length > 0).sort((a, b) => b.tasks.length - a.tasks.length);

      // Unassigned tasks in this team (assignee not found in members list)
      const unassignedTasks = group.tasks.filter(t => !group.members.some(m => m.id === t.assigneeId));
      if (unassignedTasks.length > 0) membersWithTasks.push({ member: { name: 'Unassigned', role: '' }, tasks: unassignedTasks });

      // One block per member
      membersWithTasks.forEach(({ member, tasks: mTasks }) => {
        ensureSpace(60);

        // Sort tasks: done first, then in progress, then todo
        const statusOrder = { done: 0, progress: 1, review: 2, todo: 3, blocked: 4 };
        const sortedTasks = [...mTasks].sort((a, b) => (statusOrder[a.status] ?? 9) - (statusOrder[b.status] ?? 9));

        // Build rows: [Sr.No, Client, Task, Quantity, Rate, Status]
        const bodyRows = sortedTasks.map((t, idx) => {
          const q = taskQty(t);
          const statusLabel = ({ todo: 'To do', progress: 'In progress', review: 'Review', done: 'Done', blocked: 'Blocked' })[t.status] || t.status;
          return [
            String(idx + 1),
            clientName(t.clientId),
            (t.title || '').slice(0, 50) + ((t.title || '').length > 50 ? '…' : ''),
            qtyDisplay(q),
            q.target > 0 ? Math.round((q.done / q.target) * 100) + '%' : '—',
            statusLabel,
          ];
        });
        // Total row at bottom
        const memberTotal = sumQty(mTasks);
        bodyRows.push([
          'Total', '', '',
          memberTotal.target > 0 ? `${memberTotal.done} / ${memberTotal.target}` : (memberTotal.done > 0 ? String(memberTotal.done) : '—'),
          memberTotal.target > 0 ? Math.round((memberTotal.done / memberTotal.target) * 100) + '%' : '—',
          '',
        ]);

        // Member header bar: Month | Member Name (spans 5 cells)
        // We use a 2-row head: row1 = month/name banner, row2 = column headers
        doc.autoTable({
          startY: y,
          head: [
            [
              { content: monthLabel, styles: { halign: 'center', fillColor: [250, 250, 250], textColor: [58, 45, 45], fontStyle: 'bold' } },
              { content: member.name + (member.role ? '  ·  ' + member.role : ''), colSpan: 5, styles: { halign: 'center', fillColor: [250, 250, 250], textColor: [58, 45, 45], fontStyle: 'bold', fontSize: 11 } },
            ],
            ['Sr. No.', 'Client', 'Task', 'Quantity', 'Rate', 'Status'],
          ],
          body: bodyRows,
          margin: { left: margin, right: margin },
          styles: { font: 'helvetica', fontSize: 9, cellPadding: 5, lineColor: [196, 196, 196], lineWidth: 0.5, halign: 'center' },
          headStyles: { fillColor: [250, 250, 250], textColor: [58, 45, 45], fontStyle: 'bold' },
          columnStyles: {
            0: { cellWidth: 50 },
            1: { halign: 'center' },
            2: { halign: 'left', cellWidth: 150 },
            3: { halign: 'center', cellWidth: 60 },
            4: { halign: 'center', cellWidth: 50 },
            5: { halign: 'center', cellWidth: 65 },
          },
          didParseCell: (data) => {
            // Bold "Total" row
            if (data.section === 'body' && data.row.raw[0] === 'Total') {
              data.cell.styles.fontStyle = 'bold';
              data.cell.styles.fillColor = [250, 250, 250];
            }
          },
        });
        y = doc.lastAutoTable.finalY + 14;
      });

      y += 6;
    });
  }

  // For sections downstream, scope by teamFilter if set
  const teamMemberIdSet = teamFilter ? new Set(team.filter(m => m.teamId === teamFilter).map(m => m.id)) : null;
  const inScope = (assigneeId) => !teamMemberIdSet || teamMemberIdSet.has(assigneeId);

  // Posts section
  if (includes.posts && rangePosts.length > 0) {
    // Posts don't have assignees in most cases; skip filtering by team for posts unless they have assigneeId
    const scopedPosts = teamMemberIdSet ? rangePosts.filter(p => !p.assigneeId || teamMemberIdSet.has(p.assigneeId)) : rangePosts;
    if (scopedPosts.length > 0) {
      sectionHeader('Posts', scopedPosts.length + ' posts (' + scopedPosts.filter(p => p.status === 'published').length + ' published)');
      const rows = scopedPosts.sort((a, b) => (b.scheduledDate || '').localeCompare(a.scheduledDate || '')).map(p => [
        formatDate(p.scheduledDate),
        clientName(p.clientId),
        (p.platform || '—'),
        p.status || 'draft',
        (p.likes || 0).toLocaleString(),
        (p.reach || 0).toLocaleString(),
        (p.caption || '').slice(0, 40) + ((p.caption || '').length > 40 ? '…' : ''),
      ]);
      doc.autoTable({ startY: y, head: [['Date', 'Client', 'Platform', 'Status', 'Likes', 'Reach', 'Caption']], body: rows, margin: { left: margin, right: margin }, styles: { font: 'helvetica', fontSize: 9, cellPadding: 5 }, headStyles: { fillColor: [125, 99, 163], textColor: [255, 255, 255], fontStyle: 'bold' }, alternateRowStyles: { fillColor: [253, 248, 241] }, columnStyles: { 6: { cellWidth: 120 } } });
      y = doc.lastAutoTable.finalY + 18;
    }
  }

  // Team section (per-member performance table)
  if (includes.team && team.length > 0) {
    const scopedTeam = teamMemberIdSet ? team.filter(m => teamMemberIdSet.has(m.id)) : team;
    sectionHeader('Team performance', 'tasks per member in range');
    const rows = scopedTeam.map(m => {
      const mt = rangeTasks.filter(t => t.assigneeId === m.id);
      const done = mt.filter(t => t.status === 'done').length;
      const rate = mt.length > 0 ? Math.round((done / mt.length) * 100) + '%' : '—';
      return [m.name || '—', m.role || '—', teamName(m.teamId), mt.length, done, rate];
    }).filter(r => r[3] > 0).sort((a, b) => b[4] - a[4]);
    if (rows.length > 0) {
      doc.autoTable({ startY: y, head: [['Name', 'Role', 'Team', 'Total', 'Done', 'Rate']], body: rows, margin: { left: margin, right: margin }, styles: { font: 'helvetica', fontSize: 9, cellPadding: 5 }, headStyles: { fillColor: [90, 128, 104], textColor: [255, 255, 255], fontStyle: 'bold' }, alternateRowStyles: { fillColor: [253, 248, 241] } });
      y = doc.lastAutoTable.finalY + 18;
    }
  }

  // Conversations section
  if (includes.comms && rangeComms.length > 0) {
    sectionHeader('Client conversations', rangeComms.length + ' logged');
    const rows = rangeComms.sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(c => [formatDate(c.date), clientName(c.clientId), c.type || '—', (c.summary || '').slice(0, 70) + ((c.summary || '').length > 70 ? '…' : '')]);
    doc.autoTable({ startY: y, head: [['Date', 'Client', 'Type', 'Summary']], body: rows, margin: { left: margin, right: margin }, styles: { font: 'helvetica', fontSize: 9, cellPadding: 5 }, headStyles: { fillColor: [74, 117, 145], textColor: [255, 255, 255], fontStyle: 'bold' }, alternateRowStyles: { fillColor: [253, 248, 241] }, columnStyles: { 3: { cellWidth: 220 } } });
    y = doc.lastAutoTable.finalY + 18;
  }

  // Instagram metrics
  if (includes.instagram && rangeIg.length > 0) {
    sectionHeader('Instagram metrics', rangeIg.length + ' monthly reports');
    const rows = rangeIg.sort((a, b) => (b.month || '').localeCompare(a.month || '')).map(r => [r.month || '—', clientName(r.clientId), (r.followers || 0).toLocaleString(), (r.followersGained || 0).toLocaleString(), (r.reach || 0).toLocaleString(), (r.engagementRate || 0) + '%']);
    doc.autoTable({ startY: y, head: [['Month', 'Client', 'Followers', 'Gained', 'Reach', 'Eng. rate']], body: rows, margin: { left: margin, right: margin }, styles: { font: 'helvetica', fontSize: 9, cellPadding: 5 }, headStyles: { fillColor: [217, 168, 80], textColor: [255, 255, 255], fontStyle: 'bold' }, alternateRowStyles: { fillColor: [253, 248, 241] } });
    y = doc.lastAutoTable.finalY + 18;
  }

  // Strategy notes
  if (includes.strategy && rangeStrat.length > 0) {
    sectionHeader('Strategy notes', rangeStrat.length + ' notes');
    rangeStrat.forEach(s => {
      ensureSpace(40);
      doc.setFont('helvetica', 'bold').setFontSize(10);
      doc.setTextColor(58, 45, 45);
      doc.text((s.title || 'Untitled') + ' — ' + clientName(s.clientId), margin, y); y += 14;
      doc.setFont('helvetica', 'normal').setFontSize(9);
      doc.setTextColor(107, 88, 86);
      const lines = doc.splitTextToSize((s.content || s.notes || '').slice(0, 600), pageW - margin * 2);
      lines.forEach(line => { ensureSpace(12); doc.text(line, margin, y); y += 12; });
      y += 8;
    });
  }

  // Footer on all pages
  const pages = doc.internal.pages.length - 1;
  for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFont('helvetica', 'normal').setFontSize(8); doc.setTextColor(168, 155, 151); doc.text('Generated ' + new Date().toLocaleDateString() + ' · Studio with Sunny', margin, pageH - 20); doc.text('Page ' + i + ' of ' + pages, pageW - margin - 50, pageH - 20); }

  const fileBase = opts.teamFilter ? `${(teams.find(t => t.id === opts.teamFilter)?.name || 'team').replace(/[^a-z0-9]/gi, '_').toLowerCase()}_report` : 'studio_bundle';
  doc.save(fileBase + '_' + from + '_to_' + to + '.pdf');
}

function exportCustomBundleExcel(opts) {
  const { from, to, includes, tasks, posts, comms, igReports, strategies, team, teams, clients } = opts;
  const wb = XLSX.utils.book_new();
  const inRange = (d) => { if (!d) return false; const s = String(d).slice(0, 10); return s >= from && s <= to; };
  const memberName = (id) => team.find(m => m.id === id)?.name || 'Unassigned';
  const teamName = (id) => teams.find(t => t.id === id)?.name || 'No team';
  const clientName = (id) => clients.find(c => c.id === id)?.name || 'No client';

  const rangeTasks = tasks.filter(t => inRange(t.createdAt) || inRange(t.dueDate));
  const rangePosts = posts.filter(p => inRange(p.scheduledDate));
  const rangeComms = comms.filter(c => inRange(c.date));
  const rangeIg    = (igReports || []).filter(r => r.month && r.month >= from.slice(0, 7) && r.month <= to.slice(0, 7));
  const rangeStrat = (strategies || []).filter(s => inRange(s.createdAt) || inRange(s.updatedAt));

  const summary = [
    ['Studio Bundle Report'], [],
    ['From', from], ['To', to], ['Generated', new Date().toLocaleDateString()], [],
    ['INCLUDES'],
    ['Tasks', rangeTasks.length],
    ['Posts published', rangePosts.filter(p => p.status === 'published').length],
    ['Posts total', rangePosts.length],
    ['Conversations', rangeComms.length],
    ['Instagram reports', rangeIg.length],
    ['Strategy notes', rangeStrat.length],
  ];
  const ws1 = XLSX.utils.aoa_to_sheet(summary);
  ws1['!cols'] = [{ wch: 24 }, { wch: 22 }];
  XLSX.utils.book_append_sheet(wb, ws1, 'Summary');

  // Helpers for quantity
  const taskQty = (t) => ({ target: t.quantityTarget || 0, done: t.quantityDone || 0 });
  const teamFilter = opts.teamFilter;
  const teamMemberIdSet = teamFilter ? new Set(team.filter(m => m.teamId === teamFilter).map(m => m.id)) : null;
  const scopedTasks = teamMemberIdSet ? rangeTasks.filter(t => teamMemberIdSet.has(t.assigneeId)) : rangeTasks;

  // ===== Total Summary sheet =====
  if (includes.tasks && scopedTasks.length > 0 && teams.length > 0 && !teamFilter) {
    const teamGroups = {};
    teams.forEach(tm => { teamGroups[tm.id] = { team: tm, members: [], tasks: [], qtyDone: 0, qtyTarget: 0 }; });
    teamGroups['__no_team__'] = { team: { id: null, name: 'No team' }, members: [], tasks: [], qtyDone: 0, qtyTarget: 0 };
    team.forEach(m => {
      const k = m.teamId || '__no_team__';
      if (!teamGroups[k]) teamGroups[k] = { team: { id: m.teamId, name: 'No team' }, members: [], tasks: [], qtyDone: 0, qtyTarget: 0 };
      teamGroups[k].members.push(m);
    });
    scopedTasks.forEach(t => {
      const m = team.find(x => x.id === t.assigneeId);
      const k = m?.teamId || '__no_team__';
      if (!teamGroups[k]) teamGroups[k] = { team: { id: m?.teamId, name: 'No team' }, members: [], tasks: [], qtyDone: 0, qtyTarget: 0 };
      teamGroups[k].tasks.push(t);
      const q = taskQty(t);
      teamGroups[k].qtyDone += q.done;
      teamGroups[k].qtyTarget += q.target;
    });
    const teamsWithData = Object.values(teamGroups).filter(g => g.tasks.length > 0).sort((a, b) => b.tasks.length - a.tasks.length);
    const rows = [['Team', 'Members', 'Tasks', 'Quantity', 'Rate']];
    const totals = { members: 0, tasks: 0, qtyDone: 0, qtyTarget: 0 };
    teamsWithData.forEach(g => {
      const qStr = g.qtyTarget > 0 ? `${g.qtyDone} / ${g.qtyTarget}` : (g.qtyDone > 0 ? String(g.qtyDone) : '—');
      const rate = g.qtyTarget > 0 ? Math.round((g.qtyDone / g.qtyTarget) * 100) + '%' : '—';
      rows.push([g.team.name, g.members.length, g.tasks.length, qStr, rate]);
      totals.members += g.members.length; totals.tasks += g.tasks.length;
      totals.qtyDone += g.qtyDone; totals.qtyTarget += g.qtyTarget;
    });
    const grandQty = totals.qtyTarget > 0 ? `${totals.qtyDone} / ${totals.qtyTarget}` : (totals.qtyDone > 0 ? String(totals.qtyDone) : '—');
    const grandRate = totals.qtyTarget > 0 ? Math.round((totals.qtyDone / totals.qtyTarget) * 100) + '%' : '—';
    rows.push(['Total', totals.members, totals.tasks, grandQty, grandRate]);
    const wsTeamSum = XLSX.utils.aoa_to_sheet(rows);
    wsTeamSum['!cols'] = [{ wch: 22 }, { wch: 10 }, { wch: 10 }, { wch: 18 }, { wch: 10 }];
    XLSX.utils.book_append_sheet(wb, wsTeamSum, 'Total Summary');
  }

  if (includes.tasks) {
    // One sheet per team. Within a sheet, member blocks separated by blank rows.
    const monthLabel = (() => { try { const d = new Date(from + 'T00:00:00'); return d.toLocaleString('en-US', { month: 'long' }); } catch { return ''; } })();

    const teamGroups2 = {};
    teams.forEach(tm => { teamGroups2[tm.id] = { team: tm, members: {} }; });
    teamGroups2['__no_team__'] = { team: { id: null, name: 'No team' }, members: {} };
    scopedTasks.forEach(t => {
      const m = team.find(x => x.id === t.assigneeId);
      const tKey = m?.teamId || '__no_team__';
      if (!teamGroups2[tKey]) teamGroups2[tKey] = { team: { name: 'No team' }, members: {} };
      const mKey = m?.id || '__unassigned__';
      if (!teamGroups2[tKey].members[mKey]) teamGroups2[tKey].members[mKey] = { member: m, tasks: [] };
      teamGroups2[tKey].members[mKey].tasks.push(t);
    });

    const teamsWithData = Object.values(teamGroups2).filter(g => Object.values(g.members).some(mg => mg.tasks.length > 0));

    teamsWithData.forEach(g => {
      const sheetRows = [];
      const membersWithTasks = Object.values(g.members)
        .filter(mg => mg.tasks.length > 0)
        .sort((a, b) => b.tasks.length - a.tasks.length);

      membersWithTasks.forEach((mg, blockIdx) => {
        // Block header row: [Month, Member Name, '', '', '', '']
        sheetRows.push([monthLabel, mg.member?.name || 'Unassigned' + (mg.member?.role ? '  ·  ' + mg.member.role : ''), '', '', '', '']);
        // Column headers
        sheetRows.push(['Sr. No.', 'Client', 'Task', 'Quantity', 'Rate', 'Status']);
        // Sort tasks: done first
        const statusOrder = { done: 0, progress: 1, review: 2, todo: 3, blocked: 4 };
        const sortedTasks = [...mg.tasks].sort((a, b) => (statusOrder[a.status] ?? 9) - (statusOrder[b.status] ?? 9));
        sortedTasks.forEach((t, idx) => {
          const q = taskQty(t);
          const qStr = q.target > 0 ? `${q.done} / ${q.target}` : (q.done > 0 ? String(q.done) : '');
          const rate = q.target > 0 ? Math.round((q.done / q.target) * 100) + '%' : '';
          const statusLabel = ({ todo: 'To do', progress: 'In progress', review: 'Review', done: 'Done', blocked: 'Blocked' })[t.status] || t.status;
          sheetRows.push([idx + 1, clientName(t.clientId), t.title || '', qStr, rate, statusLabel]);
        });
        // Total row
        const memberQ = mg.tasks.reduce((s, t) => { const q = taskQty(t); s.done += q.done; s.target += q.target; return s; }, { done: 0, target: 0 });
        const totalQ = memberQ.target > 0 ? `${memberQ.done} / ${memberQ.target}` : (memberQ.done > 0 ? String(memberQ.done) : '');
        const totalRate = memberQ.target > 0 ? Math.round((memberQ.done / memberQ.target) * 100) + '%' : '';
        sheetRows.push(['Total', '', '', totalQ, totalRate, '']);
        // Blank separator (except after last member)
        if (blockIdx < membersWithTasks.length - 1) {
          sheetRows.push([]);
          sheetRows.push([]);
        }
      });

      const ws = XLSX.utils.aoa_to_sheet(sheetRows);
      ws['!cols'] = [{ wch: 12 }, { wch: 22 }, { wch: 40 }, { wch: 14 }, { wch: 10 }, { wch: 14 }];
      // Sheet name: cap at 31 chars (Excel limit), no invalid chars
      const safeName = (g.team.name || 'Team').replace(/[\\/?*[\]:]/g, '').slice(0, 31);
      XLSX.utils.book_append_sheet(wb, ws, safeName);
    });
  }

  if (includes.posts) {
    const rows = [['Date', 'Client', 'Platform', 'Status', 'Likes', 'Comments', 'Reach', 'Saves', 'Caption']];
    rangePosts.sort((a, b) => (b.scheduledDate || '').localeCompare(a.scheduledDate || '')).forEach(p => rows.push([p.scheduledDate || '', clientName(p.clientId), p.platform || '', p.status || 'draft', p.likes || 0, p.comments || 0, p.reach || 0, p.saves || 0, p.caption || '']));
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 14 }, { wch: 22 }, { wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 50 }];
    XLSX.utils.book_append_sheet(wb, ws, 'Posts');
  }

  if (includes.team) {
    const scopedTeam = teamMemberIdSet ? team.filter(m => teamMemberIdSet.has(m.id)) : team;
    const rows = [['Name', 'Role', 'Team', 'Email', 'Total Tasks', 'Completed', 'Completion Rate']];
    scopedTeam.forEach(m => {
      const mt = rangeTasks.filter(t => t.assigneeId === m.id);
      const done = mt.filter(t => t.status === 'done').length;
      const rate = mt.length > 0 ? Math.round((done / mt.length) * 100) + '%' : '—';
      rows.push([m.name || '', m.role || '', teamName(m.teamId), m.email || '', mt.length, done, rate]);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 22 }, { wch: 18 }, { wch: 16 }, { wch: 22 }, { wch: 12 }, { wch: 12 }, { wch: 16 }];
    XLSX.utils.book_append_sheet(wb, ws, 'Team Performance');
  }

  if (includes.comms) {
    const rows = [['Date', 'Client', 'Type', 'Summary']];
    rangeComms.sort((a, b) => (b.date || '').localeCompare(a.date || '')).forEach(c => rows.push([c.date ? formatDate(c.date) : '', clientName(c.clientId), c.type || '', c.summary || '']));

    ws['!cols'] = [{ wch: 14 }, { wch: 22 }, { wch: 14 }, { wch: 60 }];
    XLSX.utils.book_append_sheet(wb, ws, 'Conversations');
  }

  if (includes.instagram) {
    const rows = [['Month', 'Client', 'Followers', 'Gained', 'Reach', 'Impressions', 'Engagement %', 'Posts', 'Reels']];
    rangeIg.sort((a, b) => (b.month || '').localeCompare(a.month || '')).forEach(r => rows.push([r.month || '', clientName(r.clientId), r.followers || 0, r.followersGained || 0, r.reach || 0, r.impressions || 0, r.engagementRate || 0, r.totalPosts || 0, r.totalReels || 0]));

  if (includes.strategy) {

  }

  const fileBaseXlsx = opts.teamFilter ? `${(teams.find(t => t.id === opts.teamFilter)?.name || 'team').replace(/[^a-z0-9]/gi, '_').toLowerCase()}_report` : 'studio_bundle';
  XLSX.writeFile(wb, fileBaseXlsx + '_' + from + '_to_' + to + '.xlsx');
}

const fetchTable = async (table) => { const { data, error } = await sb.from(table).select('*'); if (error) { console.error(`fetch ${table}:`, error); return []; } return data.map(toCamel); };
const upsertItem = async (table, item, userId, workspaceId) => { const { id, createdAt, ...rest } = item; const cleaned = {}; for (const [k, v] of Object.entries(rest)) { cleaned[k] = (v === '' && (k.endsWith('Id') || k === 'dueDate' || k === 'scheduledDate' || k === 'date')) ? null : v; } const payload = toSnake(cleaned); const insertPayload = { ...payload, user_id: userId }; if (workspaceId) insertPayload.workspace_id = workspaceId; const op = id ? sb.from(table).update(payload).eq('id', id) : sb.from(table).insert(insertPayload); const { error } = await op; if (error) { console.error(`save ${table}:`, error); alert('Save failed: ' + error.message); } };
const deleteItem = async (table, id) => { const { error } = await sb.from(table).delete().eq('id', id); if (error) console.error(`delete ${table}:`, error); };
const normalizeUrl = (url) => { if (!url) return ''; const trimmed = String(url).trim(); if (!trimmed) return ''; if (/^https?:\/\//i.test(trimmed)) return trimmed; return 'https://' + trimmed; };

function App() {
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  useEffect(() => {
    if (!sb) { setAuthLoading(false); return; }
    sb.auth.getSession().then(({ data: { session } }) => { setUser(session?.user || null); setAuthLoading(false); });
    const { data: { subscription } } = sb.auth.onAuthStateChange((_e, session) => setUser(session?.user || null));
    return () => subscription.unsubscribe();
  }, []);
  if (!sb) return <ConfigError />;
  if (authLoading) return <BootScreen />;
  if (!user) return <Login />;
  return <WorkspaceRouter user={user} />;
}

function WorkspaceRouter({ user }) {
  const [membership, setMembership] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const { data, error: e } = await sb.from('workspace_members').select('*').eq('user_id', user.id).eq('status', 'active').limit(1).maybeSingle();
        if (cancelled) return;
        if (e) { setError(e.message); setLoading(false); return; }
        setMembership(data ? toCamel(data) : null);
        setLoading(false);
      } catch (err) { if (!cancelled) { setError(String(err)); setLoading(false); } }
    })();
    return () => { cancelled = true; };
  }, [user.id]);
  if (loading) return <BootScreen />;
  if (error) return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}><div className="card" style={{ maxWidth: 480 }}><h1 className="display text-2xl mb-3">Hmm, something's off</h1><p className="text-sm" style={{ color: 'var(--ink-soft)' }}>{error}</p></div></div>;
  if (!membership) return <NoWorkspaceScreen email={user.email} onSignOut={() => sb.auth.signOut()} />;
  if (membership.role === 'owner') return <Dashboard user={user} membership={membership} />;
  return <MemberDashboard user={user} membership={membership} />;
}

function NoWorkspaceScreen({ email, onSignOut }) {
  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, background: 'var(--bg)' }}>

        <button onClick={onSignOut} className="btn-ghost">Sign out</button>

  );
}

function MemberDay({ displayName, myTasks, myActive, myDone, myClients, team, teams, clients, briefs, updateTaskStatus, setView, onPeekBrief }) {
  const todayStr = today();
  const overdue = myActive.filter(t => t.dueDate && t.dueDate < todayStr);
  const dueToday = myActive.filter(t => t.dueDate === todayStr);
  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
  const doneThisWeek = myDone.filter(t => t.completedAt ? new Date(t.completedAt) >= weekAgo : false).length || myDone.filter(t => isInPeriod(t.createdAt, 'week')).length;
  const completionRate = myTasks.length > 0 ? Math.round((myDone.length / myTasks.length) * 100) : 0;
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Hey' : 'Good evening';

function StreakCard({ myDone }) {
  // Compute simple streak: number of consecutive days with at least one done task
  const dayMap = {};
  myDone.forEach(t => {
    const d = (t.completedAt || t.createdAt || '').slice(0, 10);
    if (d) dayMap[d] = true;
  });
  let streak = 0;
  const cursor = new Date();
  for (let i = 0; i < 30; i++) {
    const d = cursor.toISOString().slice(0, 10);
    if (dayMap[d]) streak++;
    else if (i > 0) break;
    cursor.setDate(cursor.getDate() - 1);
  }
  if (streak === 0) return null;
  return (
    <div style={{ marginTop: 16, padding: 10, background: 'var(--gold-soft)', border: '1px solid #f5e9c8', borderRadius: 10 }}>
      <div className="flex items-center gap-1.5 mb-1">
        <span className="streak-flame">🔥</span>
        <p className="text-xs font-semibold" style={{ margin: 0, color: '#a07a32' }}>{streak}-day streak!</p>
      </div>
      <p className="hand" style={{ color: '#a07a32', fontSize: '0.85rem', margin: 0, lineHeight: 1.2 }}>don't break the chain ✨</p>
    </div>
  );
}

function MemberTasks({ myTasks, team, teams, clients, briefs, taskAtts, clientAtts, taskActivity, userId, updateTaskStatus, onPeekBrief }) {
  const [statusFilter, setStatusFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [expanded, setExpanded] = useState({});
  const buckets = ['todo', 'progress', 'review', 'done', 'blocked'];
  const filtered = myTasks
    .filter(t => statusFilter === 'all' || t.status === statusFilter)
    .filter(t => !search || t.title?.toLowerCase().includes(search.toLowerCase()))
    .sort((a, b) => { const o = { high: 0, medium: 1, low: 2 }; return (o[a.priority] || 1) - (o[b.priority] || 1); });
  const toggleExpand = (id) => setExpanded(e => ({ ...e, [id]: !e[id] }));
  return (
    <div className="fade-in">
      <PageHeader title="My tasks" subtitle={`${myTasks.filter(t => t.status !== 'done').length} active · ${myTasks.filter(t => t.status === 'done').length} done`} />

        <div className="flex items-center gap-2" style={{ background: 'var(--card)', padding: '7px 14px', borderRadius: 999, border: '1px solid var(--line)' }}><Search size={13} color="var(--muted)" /><input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search..." style={{ background: 'transparent', outline: 'none', fontSize: 13, width: 200 }} /></div>
        <Pill label={`All (${myTasks.length})`} active={statusFilter === 'all'} onClick={() => setStatusFilter('all')} />
        {buckets.map(b => { const c = myTasks.filter(t => t.status === b).length; return <Pill key={b} label={`${STATUS_COLORS[b].label} (${c})`} active={statusFilter === b} onClick={() => setStatusFilter(b)} />; })}
      </div>
      {filtered.length === 0 ? (
        <EmptyState title="No tasks here" message="when your admin assigns you something, it'll show up here" mood="sleepy" />
      ) : (
        <div className="space-y-2">
          {filtered.map(t => {
            const taskFiles = (taskAtts || []).filter(a => a.taskId === t.id);
            const client = clients.find(c => c.id === t.clientId);
            const clientFiles = client ? (clientAtts || []).filter(a => a.clientId === client.id) : [];
            const brief = client ? briefs.find(b => b.clientId === client.id) : null;
            const taskEvents = (taskActivity || []).filter(a => a.taskId === t.id);
            const hasExtras = taskFiles.length > 0 || clientFiles.length > 0 || t.description || taskEvents.length > 0;
            const isExpanded = expanded[t.id];
            return (
              <div key={t.id}>
                <TaskRow task={t} team={team} teams={teams} clients={clients} onClick={hasExtras ? () => toggleExpand(t.id) : null} onStatusChange={updateTaskStatus} />
                {hasExtras && (
                  <div style={{ marginTop: -4, marginBottom: 6, marginLeft: 26 }}>
                    <button onClick={() => toggleExpand(t.id)} className="btn-ghost" style={{ fontSize: 11, padding: '3px 8px' }}>
                      {isExpanded ? '▼ Hide details' : '▶ '}
                      {!isExpanded && (
                        <span>
                          {t.description ? '📝 details' : ''}

                          {client && brief && <span style={{ marginLeft: 8 }}>📖 brief</span>}

                  <div style={{ background: 'var(--bg-warmer)', border: '1px solid var(--line)', borderRadius: 12, padding: 14, marginTop: -4, marginBottom: 8, marginLeft: 26 }}>

function MemberLeaveView({ leave, workspaceId, teamMemberId, userId, onRefresh }) {
  const [showForm, setShowForm] = useState(false);
  const TYPE_STYLES = {
    vacation: { bg: 'var(--coral-soft)', color: 'var(--coral-deep)', label: 'Vacation', emoji: '🏖️' },
    sick: { bg: 'var(--pink-soft)', color: '#c95080', label: 'Sick', emoji: '🤒' },
    wfh: { bg: 'var(--lavender-soft)', color: '#7d63a3', label: 'WFH', emoji: '🏠' },
    personal: { bg: 'var(--gold-soft)', color: '#a07a32', label: 'Personal', emoji: '💼' },
  };
  const sorted = [...leave].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  const usedDays = sorted.filter(r => r.status === 'approved' && r.type !== 'wfh').reduce((acc, r) => acc + Math.max(1, Math.round((new Date(r.endDate) - new Date(r.startDate)) / 86400000) + 1), 0);
  const wfhDays = sorted.filter(r => r.status === 'approved' && r.type === 'wfh').reduce((acc, r) => acc + Math.max(1, Math.round((new Date(r.endDate) - new Date(r.startDate)) / 86400000) + 1), 0);
  const allowance = 15;

  const cancel = async (req) => {
    if (!window.confirm('Cancel this request?')) return;
    const { error } = await sb.from('leave_requests').update({ status: 'cancelled' }).eq('id', req.id);
    if (error) { alert('Failed: ' + error.message); return; }
    await onRefresh();
  };

  return (
    <div className="fade-in">
      <PageHeader title="Time off" subtitle="request leave or work from home 📅" action={!showForm && <button className="btn-primary" onClick={() => setShowForm(true)}><Plus size={13} /> New request</button>} />

      <div className="grid grid-cols-3 gap-3 mb-5">
        <div className="card" style={{ padding: 14 }}>
          <p className="stat-num" style={{ fontSize: '1.5rem', lineHeight: 1, margin: 0, color: 'var(--sage)' }}>{Math.max(0, allowance - usedDays)}</p>
          <p className="text-xs" style={{ color: 'var(--ink-soft)', marginTop: 4 }}>Leave days left</p>
        </div>
        <div className="card" style={{ padding: 14 }}>
          <p className="stat-num" style={{ fontSize: '1.5rem', lineHeight: 1, margin: 0, color: 'var(--coral)' }}>{usedDays}</p>
          <p className="text-xs" style={{ color: 'var(--ink-soft)', marginTop: 4 }}>Used this year</p>
        </div>
        <div className="card" style={{ padding: 14 }}>
          <p className="stat-num" style={{ fontSize: '1.5rem', lineHeight: 1, margin: 0, color: 'var(--lavender)' }}>{wfhDays}</p>
          <p className="text-xs" style={{ color: 'var(--ink-soft)', marginTop: 4 }}>WFH days</p>
        </div>
      </div>

      {showForm && <LeaveRequestModal workspaceId={workspaceId} teamMemberId={teamMemberId} userId={userId} onClose={() => setShowForm(false)} onDone={async () => { await onRefresh(); setShowForm(false); }} />}

      <div className="card">
        <p className="text-xs font-semibold mb-3" style={{ color: 'var(--ink-soft)', letterSpacing: 0.3 }}>YOUR REQUESTS</p>
        {sorted.length === 0 ? (
          <p className="hand py-4 text-center" style={{ color: 'var(--coral-deep)', fontSize: '1.1rem' }}>nothing yet — tap "New request" to start ✨</p>
        ) : (
          <div className="space-y-2">
            {sorted.map(req => {
              const style = TYPE_STYLES[req.type] || TYPE_STYLES.vacation;
              const days = Math.max(1, Math.round((new Date(req.endDate) - new Date(req.startDate)) / 86400000) + 1);
              const statusBadge = {
                pending: { bg: 'var(--gold-soft)', color: '#a07a32', label: '⏳ Pending' },
                approved: { bg: 'var(--sage-soft)', color: 'var(--sage)', label: '✓ Approved' },
                declined: { bg: 'var(--pink-soft)', color: 'var(--pink)', label: '✕ Declined' },
                cancelled: { bg: 'var(--line-soft)', color: 'var(--ink-soft)', label: '○ Cancelled' },
              }[req.status] || { bg: 'var(--line-soft)', color: 'var(--ink-soft)', label: req.status };
              return (
                <div key={req.id} style={{ background: 'var(--bg-warmer)', borderLeft: `3px solid ${style.color}`, borderRadius: 10, padding: '10px 14px', display: 'flex', alignItems: 'center', gap: 12, opacity: req.status === 'cancelled' ? 0.5 : 1 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <p className="text-sm font-semibold" style={{ margin: 0 }}>{formatDate(req.startDate)} — {formatDate(req.endDate)} <span style={{ color: 'var(--ink-soft)', fontWeight: 400, fontSize: 11.5 }}>· {days}d · {style.emoji} {style.label}</span></p>
                    {req.reason && <p className="text-xs mt-1" style={{ color: 'var(--ink-soft)' }}>{req.reason}</p>}
                    {req.decisionNote && <p className="text-xs mt-1" style={{ color: 'var(--coral-deep)', fontStyle: 'italic' }}>note: {req.decisionNote}</p>}
                  </div>
                  <span className="badge" style={{ background: statusBadge.bg, color: statusBadge.color, fontWeight: 600 }}>{statusBadge.label}</span>
                  {req.status === 'pending' && <button onClick={() => cancel(req)} className="btn-ghost" style={{ fontSize: 11 }}>Cancel</button>}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function LeaveRequestModal({ workspaceId, teamMemberId, userId, onClose, onDone }) {

function Dashboard({ user, membership }) {
  const workspaceId = membership?.workspaceId;

  const [tasks, setTasks] = useState([]);

  const [clients, setClients] = useState([]);
  const [posts, setPosts] = useState([]);
  const [sheets, setSheets] = useState([]);
  const [strategies, setStrategies] = useState([]);
  const [comms, setComms] = useState([]);
  const [igReports, setIgReports] = useState([]);
  const [notes, setNotes] = useState([]);
  const [briefs, setBriefs] = useState([]);
  const [leaveRequests, setLeaveRequests] = useState([]);
  const [teamMessages, setTeamMessages] = useState([]);
  const [taskAttachments, setTaskAttachments] = useState([]);
  const [clientAttachments, setClientAttachments] = useState([]);
  const [taskActivity, setTaskActivity] = useState([]);
  const [modal, setModal] = useState(null);
  const [loading, setLoading] = useState(true);
  const setters = { tasks: setTasks, team: setTeam, teams: setTeams, clients: setClients, posts: setPosts, sheets: setSheets, strategies: setStrategies, comms: setComms, instagram_reports: setIgReports, notes: setNotes, client_briefs: setBriefs, leave_requests: setLeaveRequests, team_messages: setTeamMessages, task_attachments: setTaskAttachments, client_attachments: setClientAttachments, task_activity: setTaskActivity };
  const refetch = useCallback(async (table) => { const data = await fetchTable(table); setters[table]?.(data); }, []);
  useEffect(() => { (async () => { const results = await Promise.all(TABLES.map(fetchTable)); TABLES.forEach((t, i) => setters[t]?.(results[i])); setLoading(false); })(); }, [user.id]);
  useEffect(() => { if (loading) return; const seedKey = `studio:seeded:${user.id}`; if (localStorage.getItem(seedKey)) return; if (teams.length > 0) { localStorage.setItem(seedKey, '1'); return; } const payload = DEFAULT_TEAMS.map(t => ({ ...t, user_id: user.id })); sb.from('teams').insert(payload).then(({ error }) => { if (!error) { localStorage.setItem(seedKey, '1'); refetch('teams'); } }); }, [loading, teams.length, user.id, refetch]);
  useEffect(() => { const channels = TABLES.map(table => sb.channel(`rt-${table}`).on('postgres_changes', { event: '*', schema: 'public', table }, () => refetch(table)).subscribe()); return () => { channels.forEach(c => sb.removeChannel(c)); }; }, [user.id, refetch]);
  const saveItem = async (table, item) => { await upsertItem(table, item, user.id, workspaceId); await refetch(table); };
  const removeItem = async (table, id) => { await deleteItem(table, id); await refetch(table); };
  const toggleTaskStatus = async (id, status) => { if (status === 'done') fireConfetti(); await sb.from('tasks').update({ status }).eq('id', id); await refetch('tasks'); };
  const updatePostStatus = async (id, status) => { if (status === 'published') fireConfetti(); await sb.from('posts').update({ status }).eq('id', id); await refetch('posts'); };
  const [workspaceMembers, setWorkspaceMembers] = useState([]);
  const refetchMembers = async () => { const { data } = await sb.from('workspace_members').select('*').order('invited_at', { ascending: false }); if (data) setWorkspaceMembers(data.map(toCamel)); };
  useEffect(() => { refetchMembers(); }, []);
  useEffect(() => { const ch = sb.channel('rt-members').on('postgres_changes', { event: '*', schema: 'public', table: 'workspace_members' }, () => refetchMembers()).subscribe(); return () => sb.removeChannel(ch); }, []);
  const pendingInvites = workspaceMembers.filter(m => m.status === 'invited').length;
  const pendingLeave = leaveRequests.filter(l => l.status === 'pending').length;
  const newMessages = teamMessages.filter(m => m.status === 'new').length;

  const logout = async () => { if (window.confirm('Sign out?')) await sb.auth.signOut(); };

  const navItems = [
    { id: 'dashboard', label: 'Overview', icon: LayoutDashboard },
    { id: 'tasks', label: 'Tasks', icon: CheckSquare, count: tasks.filter(t => t.status !== 'done').length },
    { id: 'team', label: 'Team', icon: Users, count: team.length },
    { id: 'clients', label: 'Clients', icon: Briefcase, count: clients.length },
    { id: 'calendar', label: 'Content', icon: Calendar, count: posts.filter(p => p.status === 'scheduled').length },

  const startEdit = (n) => setEditing({ ...n });
  const save = async () => {
    if (!editing.body.trim()) { setEditing(null); return; }
    await onSaveNote(editing);
    setEditing(null);
  };
  const togglePin = async (n) => { await onSaveNote({ ...n, pinned: !n.pinned }); };
  const remove = async (n) => { if (window.confirm('Delete this note?')) await onDeleteNote(n.id); };

  return (
    <div className="mt-4">
      <div className="flex items-center justify-between mb-3" style={{ paddingLeft: 4 }}>
        <div>
          <h2 className="display text-xl" style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
            <span style={{ width: 32, height: 32, borderRadius: 10, background: 'var(--gold-soft)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><FileText size={14} color="#a07a32" /></span>
            Notes
          </h2>
          <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1rem', marginTop: -2, paddingLeft: 40 }}>your scratchpad — important things, ideas, reminders ✨</p>
        </div>
        <button className="btn-primary" onClick={startNew}><Plus size={13} /> New note</button>
      </div>

      {sorted.length === 0 && !editing ? (
        <button onClick={startNew} className="card text-center" style={{ padding: '34px 20px', width: '100%', borderStyle: 'dashed', cursor: 'pointer', background: 'transparent' }}>
          <Sunny size={36} mood="happy" />
          <p className="display text-lg mt-2 mb-1">Nothing jotted yet</p>
          <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1.05rem' }}>tap to add your first note 📌</p>
        </button>
      ) : (
        <div className="grid grid-cols-3 gap-3">
          {sorted.map(n => {
            const palette = paletteFor(n.color);
            const isEditing = editing && editing.id === n.id;
            if (isEditing) return null; // editor renders below in its own slot
            return (
              <div key={n.id} style={{ background: palette.bg, border: `1px solid ${palette.border}`, borderRadius: 16, padding: 14, position: 'relative', minHeight: 130, display: 'flex', flexDirection: 'column' }}>
                <div className="flex items-center justify-between mb-2">
                  <span className="hand" style={{ fontSize: '0.95rem', color: palette.accent }}>{n.createdAt ? formatDate(n.createdAt) : 'today'}</span>
                  <div className="flex items-center gap-1">
                    <button onClick={() => togglePin(n)} title={n.pinned ? 'Unpin' : 'Pin'} style={{ width: 22, height: 22, borderRadius: 6, background: n.pinned ? palette.accent + '33' : 'transparent', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', border: 'none', cursor: 'pointer' }}>
                      <Pin size={11} color={palette.accent} style={{ fill: n.pinned ? palette.accent : 'none' }} />
                    </button>
                    <button onClick={() => startEdit(n)} title="Edit" style={{ width: 22, height: 22, borderRadius: 6, background: 'transparent', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', border: 'none', cursor: 'pointer' }}>
                      <Edit2 size={10} color={palette.accent} />
                    </button>
                    <button onClick={() => remove(n)} title="Delete" style={{ width: 22, height: 22, borderRadius: 6, background: 'transparent', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', border: 'none', cursor: 'pointer' }}>
                      <Trash2 size={10} color={palette.accent} />
                    </button>
                  </div>
                </div>
                <p className="hand" style={{ fontSize: '1.15rem', lineHeight: 1.5, margin: 0, color: 'var(--ink)', whiteSpace: 'pre-wrap', flex: 1 }}>{n.body}</p>
              </div>
            );
          })}
          {editing && (
            <NoteEditorTile editing={editing} setEditing={setEditing} onSave={save} onCancel={() => setEditing(null)} palettes={NOTE_PALETTES} />
          )}
        </div>
      )}
    </div>
  );
}

    </div>
  );

function TodayAcrossTeam({ team, teams, tasks, leaveRequests, setView }) {
  const [filter, setFilter] = useState('all');
  const todayStr = today();

  // For each member, compute today's status
  const memberStatus = (member) => {
    const onLeaveToday = leaveRequests.find(r => r.teamMemberId === member.id && r.status === 'approved' && r.startDate <= todayStr && r.endDate >= todayStr);
    if (onLeaveToday) {
      const STYLE = {
        vacation: { label: 'On leave', emoji: '🏖️', color: '#c97050', bg: 'var(--coral-soft)' },
        sick: { label: 'Sick', emoji: '🤒', color: '#c95080', bg: 'var(--pink-soft)' },
        wfh: { label: 'WFH', emoji: '🏠', color: '#7d63a3', bg: 'var(--lavender-soft)' },
        personal: { label: 'Personal', emoji: '💼', color: '#a07a32', bg: 'var(--gold-soft)' },
      };
      return STYLE[onLeaveToday.type] || STYLE.vacation;
    }
    return { label: 'Working', emoji: '✨', color: 'var(--sage)', bg: 'var(--sage-soft)' };
  };

  const enrichedMembers = team.map(m => {
    const mTasks = tasks.filter(t => t.assigneeId === m.id);
    const dueToday = mTasks.filter(t => t.dueDate === todayStr && t.status !== 'done').length;
    const overdue = mTasks.filter(t => t.dueDate && t.dueDate < todayStr && t.status !== 'done').length;
    const doneToday = mTasks.filter(t => t.status === 'done' && t.completedAt?.slice(0, 10) === todayStr).length;
    const inProgress = mTasks.filter(t => t.status === 'progress').length;
    const hasUrgent = mTasks.some(t => t.priority === 'high' && t.status !== 'done');
    const status = memberStatus(m);
    const memberTeam = teams.find(tm => tm.id === m.teamId);
    return { ...m, dueToday, overdue, doneToday, inProgress, hasUrgent, status, memberTeam };
  });

  const filtered = enrichedMembers.filter(m => {
    if (filter === 'all') return true;
    if (filter === 'working') return m.status.label === 'Working';
    if (filter === 'away') return m.status.label !== 'Working';
    if (filter === 'overdue') return m.overdue > 0;
    if (filter === 'urgent') return m.hasUrgent;
    return true;
  });

  const workingCount = enrichedMembers.filter(m => m.status.label === 'Working').length;
  const awayCount = enrichedMembers.length - workingCount;
  const totalDueToday = enrichedMembers.reduce((acc, m) => acc + m.dueToday, 0);
  const totalOverdue = enrichedMembers.reduce((acc, m) => acc + m.overdue, 0);

  if (team.length === 0) return null;

  return (
    <div className="card mb-7" style={{ padding: 22 }}>
      <div className="flex items-center justify-between mb-2">
        <div>
          <h2 className="display text-xl" style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
            <span style={{ width: 32, height: 32, borderRadius: 10, background: 'var(--coral-soft)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><Users size={14} color="var(--coral-deep)" /></span>
            Today across the team
          </h2>
          <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1.05rem', marginTop: -2, paddingLeft: 40 }}>
            {workingCount} working · {awayCount > 0 ? awayCount + ' away · ' : ''}{totalDueToday} {totalDueToday === 1 ? 'task' : 'tasks'} due today{totalOverdue > 0 ? ' · ' + totalOverdue + ' overdue' : ''} ✨
          </p>
        </div>
      </div>

      <div className="flex gap-1.5 mt-3 mb-4 flex-wrap" style={{ paddingLeft: 40 }}>
        <Pill label={`Everyone (${enrichedMembers.length})`} active={filter === 'all'} onClick={() => setFilter('all')} />
        <Pill label={`Working (${workingCount})`} active={filter === 'working'} onClick={() => setFilter('working')} />
        {awayCount > 0 && <Pill label={`Away (${awayCount})`} active={filter === 'away'} onClick={() => setFilter('away')} />}
        {totalOverdue > 0 && <Pill label={`Has overdue (${enrichedMembers.filter(m => m.overdue > 0).length})`} active={filter === 'overdue'} onClick={() => setFilter('overdue')} />}
        {enrichedMembers.some(m => m.hasUrgent) && <Pill label="Has urgent" active={filter === 'urgent'} onClick={() => setFilter('urgent')} />}
      </div>

      {filtered.length === 0 ? (
        <p className="hand py-3 text-center" style={{ color: 'var(--coral-deep)', fontSize: '1.05rem' }}>nobody in this view ✨</p>
      ) : (
        <div className="grid grid-cols-2 gap-2">
          {filtered.map(m => {
            const initial = (m.name || '?').charAt(0).toUpperCase();
            const isAway = m.status.label !== 'Working';
            return (
              <button key={m.id} onClick={() => setView('team')} className="card-hover" style={{ background: 'var(--bg-warmer)', border: '1px solid var(--line)', borderLeft: m.overdue > 0 ? '3px solid var(--pink)' : '1px solid var(--line)', borderRadius: 12, padding: '12px 14px', textAlign: 'left', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 12, opacity: isAway ? 0.7 : 1 }}>
                <div style={{ width: 38, height: 38, borderRadius: '50%', background: m.color || 'var(--coral-soft)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontWeight: 600, fontSize: 14, flexShrink: 0, position: 'relative' }}>
                  {initial}
                  <span style={{ position: 'absolute', bottom: -2, right: -2, fontSize: 11, background: 'white', borderRadius: '50%', width: 16, height: 16, display: 'flex', alignItems: 'center', justifyContent: 'center', border: '1.5px solid var(--bg-warmer)' }}>{m.status.emoji}</span>
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="flex items-center gap-2">
                    <p className="text-sm font-semibold truncate" style={{ margin: 0 }}>{m.name}</p>
                    {m.memberTeam && <span className="text-xs" style={{ color: 'var(--muted)' }}>· {m.memberTeam.name}</span>}
                  </div>
                  <div className="flex items-center gap-2 flex-wrap mt-0.5">
                    <span className="badge" style={{ background: m.status.bg, color: m.status.color, fontWeight: 600, fontSize: 10 }}>{m.status.label}</span>
                    {!isAway && m.dueToday > 0 && <span className="text-xs" style={{ color: 'var(--coral-deep)', fontWeight: 600 }}>{m.dueToday} due today</span>}
                    {!isAway && m.overdue > 0 && <span className="text-xs" style={{ color: 'var(--pink)', fontWeight: 600 }}>· {m.overdue} overdue</span>}
                    {!isAway && m.doneToday > 0 && <span className="text-xs" style={{ color: 'var(--sage)', fontWeight: 600 }}>· {m.doneToday} done</span>}
                    {!isAway && m.dueToday === 0 && m.overdue === 0 && m.doneToday === 0 && <span className="hand" style={{ color: 'var(--muted)', fontSize: '0.9rem' }}>nothing assigned today</span>}
                  </div>
                </div>
                {m.hasUrgent && !isAway && <span title="Has high-priority work" style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--pink)', flexShrink: 0 }}></span>}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function FollowUpCard({ tasks, team, teams, clients, setView }) {
  const todayStr = today();
  const now = new Date();
  const REVIEW_STUCK_DAYS = 3;

  const followUps = [];
  const seen = new Set();
  const addFollowUp = (task, member, reason, urgency, reasonColor) => {
    const key = task.id;
    if (seen.has(key)) return;
    seen.add(key);
    const memberTeam = teams.find(t => t.id === member.teamId);
    const client = clients.find(c => c.id === task.clientId);
    followUps.push({ task, member, memberTeam, client, reason, urgency, reasonColor });
  };

  tasks.forEach(t => {
    if (!t.assigneeId || t.status === 'done') return;
    const member = team.find(m => m.id === t.assigneeId);
    if (!member) return;
    if (t.dueDate && t.dueDate < todayStr) {
      const daysOverdue = Math.floor((new Date(todayStr) - new Date(t.dueDate)) / (1000 * 60 * 60 * 24));
      addFollowUp(t, member, `⚠️ Overdue by ${daysOverdue} day${daysOverdue === 1 ? '' : 's'}`, 1, 'var(--pink)');
      return;
    }
    if (t.dueDate === todayStr && t.status === 'todo') {
      addFollowUp(t, member, '⏰ Due today, no progress', 2, '#a07a32');
      return;
    }
    if (t.status === 'review' && t.createdAt) {
      const daysInReview = Math.floor((now - new Date(t.createdAt)) / (1000 * 60 * 60 * 24));
      if (daysInReview >= REVIEW_STUCK_DAYS) {
        addFollowUp(t, member, `📋 Waiting in Review for ${daysInReview} day${daysInReview === 1 ? '' : 's'}`, 3, 'var(--lavender)');
      }
    }
  });

  followUps.sort((a, b) => a.urgency - b.urgency);
  const onTrackCount = team.filter(m => !followUps.some(f => f.member.id === m.id)).length;

  const buildNudgeMessage = (item) => {
    const lines = [];
    lines.push(`Hi ${item.member.name},`);
    lines.push('');
    if (item.urgency === 1) {
      lines.push(`Just following up on this task:`);
      lines.push('');
      lines.push(`Task: *${item.task.title}*`);
      if (item.client) lines.push(`Client: ${item.client.name}`);
      lines.push('');
      lines.push(`The due date was *${formatDate(item.task.dueDate)}*. Could you share an update on where things stand? Let me know if you need any support to wrap this up.`);
    } else if (item.urgency === 2) {
      lines.push(`A quick check-in on today's task:`);
      lines.push('');
      lines.push(`Task: *${item.task.title}*`);
      if (item.client) lines.push(`Client: ${item.client.name}`);
      lines.push('');
      lines.push(`This is due *today*. Please let me know if anything is blocking you, or if you need help to get it done on time.`);
    } else {
      lines.push(`Following up on a task that's been waiting for review:`);
      lines.push('');
      lines.push(`Task: *${item.task.title}*`);
      if (item.client) lines.push(`Client: ${item.client.name}`);
      lines.push('');
      lines.push(`This has been in Review for a few days. Could you take a look and share your feedback when you get a chance?`);
    }
    lines.push('');
    lines.push(`Thanks,`);
    lines.push(`Studio`);
    return lines.join('\n');
  };

  const sendPersonalNudge = (e, item) => {
    e.stopPropagation();
    const phone = String(item.member.whatsapp || '').replace(/[^\d]/g, '');
    if (!phone) {
      alert(`No WhatsApp number for ${item.member.name}. Add one in the Team page.`);
      return;
    }
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(buildNudgeMessage(item))}`;
    window.open(url, '_blank');
  };

  const sendGroupNudge = async (e, item) => {
    e.stopPropagation();
    const groupName = item.memberTeam?.whatsappGroup;
    if (!groupName) {
      alert(`No WhatsApp group set for ${item.memberTeam?.name || 'this team'}. Add one in the Team page (edit team folder).`);
      return;
    }
    const message = buildNudgeMessage(item);
    try {
      await navigator.clipboard.writeText(message);
    } catch (err) {
      const ta = document.createElement('textarea'); ta.value = message; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    }
    alert(`Message copied! Now opening WhatsApp Web — paste into your "${groupName}" group chat.`);
    window.open('https://web.whatsapp.com', '_blank');
  };

  return (
    <div className="card card-hover mt-4">
      <div className="flex items-center justify-between mb-1">
        <div>
          <h2 className="display text-xl">Team follow-ups</h2>
          <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1.05rem', marginTop: -2 }}>who needs a nudge today? ✨</p>
        </div>
        {followUps.length > 0 ? <span className="badge" style={{ background: 'var(--pink-soft)', color: 'var(--pink)', fontWeight: 600 }}>{followUps.length} need{followUps.length === 1 ? 's' : ''} attention</span> : <span className="badge" style={{ background: 'var(--sage-soft)', color: 'var(--sage)', fontWeight: 600 }}>All clear ✨</span>}
      </div>

      <div style={{ height: 1, background: 'var(--line)', margin: '14px 0' }}></div>

      {followUps.length === 0 ? (
        <div style={{ padding: '20px', textAlign: 'center' }}>
          <Sunny size={48} mood="excited" float />
          <p className="display text-lg mt-2 mb-1">Everyone's on track!</p>
          <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1.1rem' }}>no overdue tasks, no stuck reviews ☀️</p>
        </div>
      ) : (
        <div className="space-y-2.5">
          {followUps.slice(0, 6).map(item => {
            const bgColor = item.urgency === 1 ? 'rgba(217, 126, 156, 0.08)' : item.urgency === 2 ? 'rgba(217, 168, 80, 0.08)' : 'rgba(169, 148, 196, 0.08)';
            const borderColor = item.urgency === 1 ? 'rgba(217, 126, 156, 0.25)' : item.urgency === 2 ? 'rgba(217, 168, 80, 0.25)' : 'rgba(169, 148, 196, 0.25)';
            const teamColor = item.memberTeam?.color || 'var(--coral)';
            return (
              <div key={item.task.id} className="flex items-center gap-3" style={{ padding: 12, background: bgColor, border: `1px solid ${borderColor}`, borderRadius: 14 }}>
                <div style={{ width: 36, height: 36, borderRadius: '50%', background: teamColor + '33', display: 'flex', alignItems: 'center', justifyContent: 'center', color: teamColor, fontWeight: 600, fontSize: 13, flexShrink: 0 }}>{item.member.name[0]?.toUpperCase()}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="flex items-center gap-2 mb-0.5">
                    <p className="text-sm font-semibold">{item.member.name}</p>
                    {item.memberTeam && <span className="badge" style={{ background: teamColor + '22', color: teamColor }}>{item.memberTeam.name}</span>}
                  </div>
                  <p className="text-xs truncate" style={{ color: 'var(--ink-soft)' }}>{item.task.title}{item.client ? ` · ${item.client.name}` : ''}</p>
                  <p className="text-xs mt-1" style={{ color: item.reasonColor, fontWeight: 600 }}>{item.reason}</p>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 4, flexShrink: 0 }}>
                  {item.member.whatsapp && (
                    <button onClick={(e) => sendPersonalNudge(e, item)} style={{ background: '#25D366', color: 'white', padding: '6px 12px', border: 'none', borderRadius: 999, fontSize: 11, fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 5, boxShadow: '0 1.5px 0 #128C7E', cursor: 'pointer' }} title={`Personal DM to ${item.member.whatsapp}`}>
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="white"><path d="M17.498 14.382c-.301-.15-1.767-.867-2.04-.966-.273-.101-.473-.15-.673.15-.197.295-.771.964-.944 1.162-.175.195-.349.21-.646.075-.3-.15-1.263-.465-2.403-1.485-.888-.795-1.484-1.77-1.66-2.07"/></svg>
                      DM
                    </button>
                  )}
                  {item.memberTeam?.whatsappGroup && (
                    <button onClick={(e) => sendGroupNudge(e, item)} style={{ background: 'white', color: item.memberTeam.color || 'var(--ink)', padding: '6px 12px', border: `1.5px solid ${item.memberTeam.color || 'var(--line)'}`, borderRadius: 999, fontSize: 11, fontWeight: 600, display: 'inline-flex', alignItems: 'center', gap: 5, cursor: 'pointer' }} title={`Copy for "${item.memberTeam.whatsappGroup}" group`}>
                      <Users size={10} />
                      Group
                    </button>
                  )}
                  {!item.member.whatsapp && !item.memberTeam?.whatsappGroup && (
                    <span style={{ fontSize: 10, color: 'var(--muted)', textAlign: 'center', padding: '4px 8px', border: '1px dashed var(--line)', borderRadius: 999 }}>No WA set</span>
                  )}
                </div>
              </div>
            );
          })}
          {followUps.length > 6 && <p className="text-xs text-center pt-2" style={{ color: 'var(--ink-soft)' }}>+ {followUps.length - 6} more — view all in <button onClick={() => setView('tasks')} style={{ color: 'var(--coral)', fontWeight: 600, textDecoration: 'underline' }}>Tasks</button></p>}
        </div>
      )}

      {followUps.length > 0 && onTrackCount > 0 && (
        <>
          <div style={{ height: 1, background: 'var(--line)', margin: '14px 0 12px' }}></div>
          <div className="flex items-center justify-between">
            <p className="hand" style={{ color: 'var(--ink-soft)', fontSize: '1.05rem', margin: 0 }}>{onTrackCount} {onTrackCount === 1 ? 'team member' : 'team members'} on track ✨</p>
            <button onClick={() => setView('team')} className="btn-ghost" style={{ fontSize: 12, padding: '5px 12px' }}>View all team <ChevronRight size={11} /></button>
          </div>
        </>
      )}
    </div>
  );
}

function PageHeader({ title, subtitle, action }) {
  return (
    <header className="mb-6 flex items-end justify-between gap-4">
      <div>
        <h1 className="display" style={{ fontSize: '2.2rem', fontWeight: 500, lineHeight: 1.1, marginBottom: 4 }}>{title}</h1>
