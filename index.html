function PeopleAdminView({ members, team, workspaceId, onInvite, onRefresh }) {
  const sorted = [...(members || [])].sort((a, b) => {
    const order = { invited: 0, active: 1, removed: 2 };
    if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
    return (b.invitedAt || '').localeCompare(a.invitedAt || '');
  });
  const removeMember = async (m) => {
    if (!window.confirm(`Remove ${m.email} from this workspace? They'll lose access immediately.`)) return;
    await sb.from('workspace_members').update({ status: 'removed' }).eq('id', m.id);
    await onRefresh();
  };
  const cancelInvite = async (m) => {
    if (!window.confirm(`Cancel invite to ${m.email}?`)) return;
    await sb.from('workspace_members').delete().eq('id', m.id);
    await onRefresh();
  };
  const teamFor = (id) => team.find(t => t.id === id);

  const STATUS_STYLES = {
    active:   { bg: 'var(--sage-soft)', color: '#5a8068', label: 'ACTIVE' },
    invited:  { bg: 'var(--gold-soft)', color: '#a07a32', label: 'PENDING' },
    removed:  { bg: 'var(--line-soft)', color: 'var(--muted)', label: 'REMOVED' },
  };
  const ROLE_STYLES = {
    owner:  { bg: 'var(--coral-soft)', color: 'var(--coral-deep)', label: 'OWNER' },
    member: { bg: 'var(--lavender-soft)', color: '#7d63a3', label: 'MEMBER' },
  };

  return (
    <div className="fade-in">
      <PageHeader title="People" subtitle="who has access to your workspace ✨" action={<button className="btn-primary" onClick={onInvite}><UserPlus size={14} /> Invite member</button>} />

      <div className="card">
        <p className="text-xs font-semibold mb-3" style={{ color: 'var(--ink-soft)', letterSpacing: 0.3 }}>{sorted.length} {sorted.length === 1 ? 'person' : 'people'}</p>
        {sorted.length === 0 ? (
          <p className="hand py-4 text-center" style={{ color: 'var(--coral-deep)', fontSize: '1.1rem' }}>nobody here yet — invite your first teammate ✨</p>
        ) : (
          <div className="space-y-2">
            {sorted.map(m => {
              const memberTeam = teamFor(m.teamMemberId);
              const statusStyle = STATUS_STYLES[m.status] || STATUS_STYLES.invited;
              const roleStyle = ROLE_STYLES[m.role] || ROLE_STYLES.member;
              const initial = (m.email || '?').charAt(0).toUpperCase();
              return (
                <div key={m.id} style={{ background: m.status === 'invited' ? 'var(--bg-warmer)' : 'white', border: '1px solid var(--line)', borderStyle: m.status === 'invited' ? 'dashed' : 'solid', borderRadius: 12, padding: '11px 14px', display: 'flex', alignItems: 'center', gap: 12, opacity: m.status === 'removed' ? 0.5 : 1 }}>
                  <div style={{ width: 34, height: 34, borderRadius: '50%', background: 'var(--coral-soft)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--coral-deep)', fontWeight: 600, fontSize: 13, flexShrink: 0 }}>{initial}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <p className="text-sm font-semibold truncate" style={{ margin: 0 }}>{m.email}</p>
                    <p className="text-xs truncate" style={{ color: 'var(--ink-soft)', margin: '2px 0 0' }}>
                      {memberTeam ? `${memberTeam.name} · ${memberTeam.role || 'team member'}` : 'No linked team profile'}
                      {m.status === 'invited' && ' · invited ' + (m.invitedAt ? formatDate(m.invitedAt) : 'just now')}
                      {m.status === 'active' && m.joinedAt && ' · joined ' + formatDate(m.joinedAt)}
                    </p>
                  </div>
                  <span className="badge" style={{ background: roleStyle.bg, color: roleStyle.color, fontWeight: 600 }}>{roleStyle.label}</span>
                  <span className="badge" style={{ background: statusStyle.bg, color: statusStyle.color, fontWeight: 600 }}>{statusStyle.label}</span>
                  {m.role !== 'owner' && m.status === 'invited' && (
                    <button className="btn-ghost" onClick={() => cancelInvite(m)} style={{ fontSize: 11 }}>Cancel</button>
                  )}
                  {m.role !== 'owner' && m.status === 'active' && (
                    <button className="btn-ghost" onClick={() => removeMember(m)} style={{ fontSize: 11, color: 'var(--pink)' }}>Remove</button>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="card mt-4" style={{ background: 'var(--gold-soft)', border: '1px solid #f5e9c8' }}>
        <div className="flex items-start gap-3">
          <ShieldAlert size={18} color="#a07a32" style={{ flexShrink: 0, marginTop: 2 }} />
          <div>
            <p className="text-sm font-semibold mb-1" style={{ color: '#a07a32' }}>How invites work</p>
            <p className="text-xs leading-relaxed" style={{ color: '#6b5856' }}>
              When you invite someone, they show up here as <strong>PENDING</strong>. Send them the magic link to sign in (the same Studio with Sunny URL you use). Once they log in with the invited email, they're auto-linked to their team profile and gain access.
            </p>
          </div>
        </div>
      </div>
    </div>
  );
}

function InviteMemberModal({ team, teams, workspaceId, userId, existingMembers, onClose, onDone }) {
  const [mode, setMode] = useState('existing'); // 'existing' or 'new'
  const [email, setEmail] = useState('');
  const [selectedTeamMemberId, setSelectedTeamMemberId] = useState('');
  // For 'new' mode:
  const [newName, setNewName] = useState('');
  const [newRole, setNewRole] = useState('');
  const [newTeamId, setNewTeamId] = useState('');
  const [saving, setSaving] = useState(false);

  // Filter out team members who are already invited or active
  const usedTeamIds = new Set((existingMembers || []).filter(m => m.status !== 'removed').map(m => m.teamMemberId).filter(Boolean));
  const availableTeam = team.filter(t => !usedTeamIds.has(t.id));

  const submit = async () => {
    const cleanEmail = email.trim().toLowerCase();
    if (!cleanEmail || !cleanEmail.includes('@')) { alert('Please enter a valid email.'); return; }
    if ((existingMembers || []).some(m => m.email?.toLowerCase() === cleanEmail && m.status !== 'removed')) {
      alert('That email is already invited or is a member.');
      return;
    }
    setSaving(true);
    try {
      let teamMemberId = mode === 'existing' ? (selectedTeamMemberId || null) : null;
      if (mode === 'new') {
        if (!newName.trim()) { alert('Please enter a name.'); setSaving(false); return; }
        const { data: teamRow, error: teamErr } = await sb.from('team').insert({ name: newName.trim(), role: newRole.trim() || null, team_id: newTeamId || null, email: cleanEmail, workspace_id: workspaceId, user_id: userId }).select().single();
        if (teamErr) { alert('Could not create team member: ' + teamErr.message); setSaving(false); return; }
        teamMemberId = teamRow.id;
      }
      // Check if a 'removed' entry exists for this email — if so, reactivate it instead of inserting
      const existingRemoved = (existingMembers || []).find(m => m.email?.toLowerCase() === cleanEmail && m.status === 'removed');
      if (existingRemoved) {
        const { error } = await sb.from('workspace_members').update({
          status: 'invited',
          team_member_id: teamMemberId,
          invited_at: new Date().toISOString(),
          user_id: null,
          joined_at: null,
        }).eq('id', existingRemoved.id);
        if (error) { alert('Re-invite failed: ' + error.message); setSaving(false); return; }
      } else {
        const { error } = await sb.from('workspace_members').insert({
          workspace_id: workspaceId,
          email: cleanEmail,
          role: 'member',
          status: 'invited',
          team_member_id: teamMemberId,
          invited_at: new Date().toISOString(),
        });
        if (error) { alert('Invite failed: ' + error.message); setSaving(false); return; }
      }
      onDone();
    } catch (e) {
      alert('Something went wrong: ' + e.message);
      setSaving(false);
    }
  };

  return (
    <ModalShell title="Invite a team member" onClose={onClose} onSave={submit} saveLabel={saving ? 'Sending...' : 'Send invite'}>
      <div style={{ background: 'var(--bg-warmer)', borderRadius: 12, padding: 4, display: 'flex', gap: 4, marginBottom: 14 }}>
        <button type="button" onClick={() => setMode('existing')} style={{ flex: 1, padding: '7px 12px', borderRadius: 9, border: 'none', background: mode === 'existing' ? 'var(--coral)' : 'transparent', color: mode === 'existing' ? 'white' : 'var(--ink-soft)', fontWeight: 500, fontSize: 12.5, cursor: 'pointer' }}>Link to existing team member</button>
        <button type="button" onClick={() => setMode('new')} style={{ flex: 1, padding: '7px 12px', borderRadius: 9, border: 'none', background: mode === 'new' ? 'var(--coral)' : 'transparent', color: mode === 'new' ? 'white' : 'var(--ink-soft)', fontWeight: 500, fontSize: 12.5, cursor: 'pointer' }}>Create new team member</button>
      </div>

      <Field label="Email"><input type="email" className="input-field" placeholder="teammate@email.com" value={email} onChange={e => setEmail(e.target.value)} autoFocus /></Field>

      {mode === 'existing' ? (
        <Field label={<span>Pick the team member <span className="hand" style={{ color: 'var(--coral-deep)', fontWeight: 400 }}>(so their tasks show up)</span></span>}>
          <select className="input-field" value={selectedTeamMemberId} onChange={e => setSelectedTeamMemberId(e.target.value)}>
            <option value="">— Don't link yet —</option>
            {availableTeam.map(m => <option key={m.id} value={m.id}>{m.name}{m.role ? ' (' + m.role + ')' : ''}</option>)}
          </select>
          {availableTeam.length === 0 && <p className="hand mt-2" style={{ color: 'var(--coral-deep)', fontSize: '0.95rem' }}>everyone in your team is already invited — switch to "Create new" ✨</p>}
        </Field>
      ) : (
        <>
          <Field label="Name"><input className="input-field" value={newName} onChange={e => setNewName(e.target.value)} placeholder="Full name" /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Role"><input className="input-field" value={newRole} onChange={e => setNewRole(e.target.value)} placeholder="e.g. Designer" /></Field>
            <Field label="Team"><select className="input-field" value={newTeamId} onChange={e => setNewTeamId(e.target.value)}><option value="">No team</option>{teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</select></Field>
          </div>
        </>
      )}

      <div style={{ background: 'var(--bg-warmer)', borderRadius: 10, padding: 12, marginTop: 8, fontSize: 11.5, color: 'var(--ink-soft)', lineHeight: 1.5 }}>
        <strong style={{ color: 'var(--ink)' }}>Next:</strong> Share the Studio link with them, and tell them to sign in with this email. Once they log in, they're auto-linked.
      </div>
    </ModalShell>
  );
}

// ====== CONTENT CALENDAR ======
function ContentCalendar({ posts, clients, clientFilter, onAddPost, onEditPost, onPeekBrief, hideSidebar, compact, readOnly }) {
  const [tab, setTab] = useState('calendar');
  const [cursorMonth, setCursorMonth] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const [expandedDay, setExpandedDay] = useState(null);

  // Filter posts by client if applicable
  const filteredPosts = clientFilter ? posts.filter(p => p.clientId === clientFilter) : posts;

  // Computed month grid
  const firstOfMonth = new Date(cursorMonth.y, cursorMonth.m, 1);
  const daysInMonth = new Date(cursorMonth.y, cursorMonth.m + 1, 0).getDate();
  const firstDayOfWeek = firstOfMonth.getDay(); // 0=Sun, 6=Sat
  const todayStr = today();
  const monthLabel = firstOfMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  // Build 6-row grid (7 cols)
  const cells = [];
  for (let i = 0; i < firstDayOfWeek; i++) cells.push(null); // leading blanks
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${cursorMonth.y}-${String(cursorMonth.m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    cells.push(ds);
  }
  while (cells.length % 7 !== 0) cells.push(null);

  const postsForDate = (ds) => filteredPosts.filter(p => (p.scheduledDate || '').startsWith(ds)).sort((a, b) => (a.scheduledDate || '').localeCompare(b.scheduledDate || ''));

  const prevMonth = () => setCursorMonth(c => { const nm = c.m - 1; return nm < 0 ? { y: c.y - 1, m: 11 } : { y: c.y, m: nm }; });
  const nextMonth = () => setCursorMonth(c => { const nm = c.m + 1; return nm > 11 ? { y: c.y + 1, m: 0 } : { y: c.y, m: nm }; });
  const goToday = () => { const d = new Date(); setCursorMonth({ y: d.getFullYear(), m: d.getMonth() }); };

  // Platform counts for this month
  const monthStart = `${cursorMonth.y}-${String(cursorMonth.m + 1).padStart(2, '0')}-01`;
  const monthEnd = `${cursorMonth.y}-${String(cursorMonth.m + 1).padStart(2, '0')}-${daysInMonth}`;
  const monthPosts = filteredPosts.filter(p => p.scheduledDate >= monthStart && p.scheduledDate <= monthEnd);
  const platformStats = PLATFORMS.map(pl => {
    const all = monthPosts.filter(p => p.platform === pl.id);
    return { ...pl, total: all.length, published: all.filter(p => p.status === 'published').length, editing: all.filter(p => p.status === 'editing').length, shooting: all.filter(p => p.status === 'shooting').length, idea: all.filter(p => p.status === 'idea').length };
  });

  return (
    <div className="fade-in">
      <div style={{ display: 'flex', gap: hideSidebar ? 0 : 16, alignItems: 'flex-start' }}>
        {!hideSidebar && (
          <aside style={{ width: 180, flexShrink: 0 }} className="cal-sidebar">
            <p style={{ fontSize: 11, fontWeight: 600, color: 'var(--ink-soft)', letterSpacing: 0.4, margin: '4px 0 8px' }}>PLATFORMS</p>
            {platformStats.map(pl => (
              <div key={pl.id} style={{ background: 'var(--bg-warmer)', border: '1px solid var(--line)', borderRadius: 10, padding: 10, marginBottom: 6 }}>
                <div className="flex items-center gap-1.5 mb-1.5">
                  <span style={{ width: 16, height: 16, borderRadius: 5, background: pl.accent, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><pl.icon size={9} color="white" /></span>
                  <p className="text-xs font-semibold" style={{ margin: 0 }}>{pl.name}</p>
                </div>
                <div style={{ height: 3, background: 'var(--line)', borderRadius: 2, marginBottom: 5, overflow: 'hidden' }}>
                  <div style={{ width: pl.total > 0 ? `${Math.min(100, (pl.published / pl.total) * 100)}%` : '0%', height: '100%', background: pl.color }}></div>
                </div>
                <p className="text-xs" style={{ color: 'var(--muted)', margin: 0, fontSize: 10.5, lineHeight: 1.4 }}>
                  {pl.published}p · {pl.editing}e · {pl.shooting}s · {pl.idea}i
                </p>
              </div>
            ))}
          </aside>
        )}
        <div style={{ flex: 1, minWidth: 0 }}>
          {/* Compact platform strip (per-client view) */}
          {hideSidebar && !compact && (
            <div style={{ background: 'var(--bg-warmer)', border: '1px solid var(--line)', borderRadius: 10, padding: '8px 12px', marginBottom: 12 }}>
              <p className="text-xs font-semibold mb-1.5" style={{ color: 'var(--ink-soft)', letterSpacing: 0.3, fontSize: 10.5 }}>THIS MONTH</p>
              <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap', alignItems: 'center' }}>
                {platformStats.filter(pl => pl.total > 0).map(pl => (
                  <div key={pl.id} className="flex items-center gap-1.5">
                    <span style={{ width: 14, height: 14, borderRadius: 4, background: pl.accent, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}><pl.icon size={8} color="white" /></span>
                    <p className="text-xs" style={{ margin: 0 }}><strong>{pl.name}</strong> <span style={{ color: 'var(--muted)' }}>· {pl.total}</span></p>
                  </div>
                ))}
                {platformStats.every(pl => pl.total === 0) && <p className="hand text-xs" style={{ color: 'var(--coral-deep)', margin: 0 }}>no posts this month — start planning ✨</p>}
              </div>
            </div>
          )}

          {/* Tabs + month nav */}
          <div className="flex items-center gap-2 mb-3 flex-wrap">
            <Pill label="📅 Calendar" active={tab === 'calendar'} onClick={() => setTab('calendar')} />
            <Pill label="List" active={tab === 'list'} onClick={() => setTab('list')} />
            <Pill label="By status" active={tab === 'status'} onClick={() => setTab('status')} />
            <Pill label="Ideas" active={tab === 'ideas'} onClick={() => setTab('ideas')} />
            <div style={{ marginLeft: 'auto', display: 'flex', gap: 4, alignItems: 'center' }}>
              <button onClick={prevMonth} className="btn-ghost" style={{ padding: 6, minHeight: 'auto' }}><ChevronLeft size={12} /></button>
              <button onClick={goToday} className="btn-ghost" style={{ fontSize: 11, minHeight: 'auto' }}>Today</button>
              <button onClick={nextMonth} className="btn-ghost" style={{ padding: 6, minHeight: 'auto' }}><ChevronRight size={12} /></button>
            </div>
          </div>

          {tab === 'calendar' && (
            <>
              <p className="display" style={{ fontSize: '1.1rem', fontWeight: 500, margin: '0 0 8px' }}>{monthLabel}</p>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 3, marginBottom: 4 }}>
                {['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map(d => <div key={d} style={{ fontSize: 10, fontWeight: 600, color: 'var(--muted)', letterSpacing: 0.4, padding: '0 4px' }}>{d}</div>)}
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 3 }}>
                {cells.map((ds, i) => {
                  if (!ds) return <div key={i} style={{ minHeight: 90 }}></div>;
                  const dayPosts = postsForDate(ds);
                  const fests = festivalsOnDate(ds);
                  const isToday = ds === todayStr;
                  const hasFest = fests.length > 0;
                  return (
                    <DayCell key={i} dateStr={ds} dayNum={parseInt(ds.split('-')[2], 10)} posts={dayPosts} festivals={fests} isToday={isToday} hasFest={hasFest} clients={clients} clientFilter={clientFilter} onEditPost={onEditPost} onAddPost={() => onAddPost && onAddPost(ds)} onExpandDay={() => setExpandedDay({ ds, posts: dayPosts, festivals: fests })} readOnly={readOnly} />
                  );
                })}
              </div>
            </>
          )}

          {tab !== 'calendar' && (
            <PostListView posts={filteredPosts} clients={clients} tab={tab} onEditPost={onEditPost} clientFilter={clientFilter} readOnly={readOnly} />
          )}
        </div>
      </div>

      {expandedDay && <DayDetailModal day={expandedDay} clients={clients} clientFilter={clientFilter} onClose={() => setExpandedDay(null)} onEditPost={onEditPost} onAddPost={onAddPost} readOnly={readOnly} />}
    </div>
  );
}

function DayCell({ dateStr, dayNum, posts, festivals, isToday, hasFest, clients, clientFilter, onEditPost, onAddPost, onExpandDay, readOnly }) {
  const MAX_VISIBLE = 3;
  const extras = posts.length - MAX_VISIBLE;
  const festBg = hasFest ? FESTIVAL_COLORS[festivals[0].category] : null;
  return (
    <div
      onClick={(e) => { if (e.target === e.currentTarget && !readOnly && onAddPost) onAddPost(); }}
      style={{
        background: hasFest ? `linear-gradient(135deg, var(--bg-warmer) 0%, ${festBg.bg} 100%)` : 'var(--bg-warmer)',
        border: isToday ? '1.5px solid var(--coral)' : (hasFest ? `0.5px solid ${festBg.color}33` : '0.5px solid var(--line)'),
        borderRadius: 8,
        padding: 5,
        minHeight: 90,
        cursor: readOnly ? 'default' : 'pointer',
        position: 'relative',
      }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 3 }}>
        <p style={{ fontSize: 11, fontWeight: isToday ? 600 : 500, margin: 0, color: isToday ? 'var(--coral)' : 'var(--ink)' }}>{dayNum}</p>
        {isToday && <span style={{ background: 'var(--coral)', color: 'white', fontSize: 7, fontWeight: 700, padding: '1px 4px', borderRadius: 999, letterSpacing: 0.3 }}>TODAY</span>}
      </div>
      {festivals.slice(0, 1).map((f, i) => (

        <div className="flex gap-2">{[{ id: 'overview', label: 'Overview' }, { id: 'team', label: 'Team' }, { id: 'posts', label: 'Posts' }, { id: 'instagram', label: 'Instagram' }].map(t => <Pill key={t.id} label={t.label} active={tab === t.id} onClick={() => setTab(t.id)} />)}</div>
        {tab !== 'instagram' && <div className="flex gap-1 p-1 rounded-full" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>{[{ id: 'week', label: 'Week' }, { id: 'month', label: 'Month' }, { id: 'quarter', label: 'Quarter' }, { id: 'all', label: 'All' }].map(p => <button key={p.id} onClick={() => setPeriod(p.id)} style={{ padding: '5px 12px', borderRadius: 999, fontSize: 12, fontWeight: 500, background: period === p.id ? 'var(--coral)' : 'transparent', color: period === p.id ? 'white' : 'var(--ink-soft)', transition: 'all 0.15s', border: 'none' }}>{p.label}</button>)}</div>}

      {tab === 'posts' && <PostsReport periodPosts={periodPosts} clients={clients} onEditPost={onEditPost} periodLabel={periodLabel} />}

function CustomExportPanel({ tasks, posts, comms, igReports, strategies, team, teams, clients }) {
  const todayStr = today();
  const monthStart = todayStr.slice(0, 8) + '01';
  const [from, setFrom] = useState(monthStart);
  const [to, setTo] = useState(todayStr);
  const [includes, setIncludes] = useState({ tasks: true, posts: true, team: true, comms: true, instagram: false, strategy: false });
  const [expanded, setExpanded] = useState(false);

  const inRange = (d) => { if (!d) return false; const s = String(d).slice(0, 10); return s >= from && s <= to; };
  const counts = {
    tasks: tasks.filter(t => inRange(t.createdAt) || inRange(t.dueDate)).length,
    posts: posts.filter(p => inRange(p.scheduledDate) && p.status === 'published').length,
    comms: comms.filter(c => inRange(c.date)).length,
    instagram: (igReports || []).filter(r => r.month && r.month >= from.slice(0, 7) && r.month <= to.slice(0, 7)).length,
    strategy: (strategies || []).filter(s => inRange(s.createdAt) || inRange(s.updatedAt)).length,
  };

  const setQuickRange = (id) => {
    const now = new Date();
    const fmt = (d) => d.toISOString().slice(0, 10);
    if (id === 'this-month') { setFrom(fmt(new Date(now.getFullYear(), now.getMonth(), 1))); setTo(todayStr); }
    else if (id === 'last-month') { const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1); const lmEnd = new Date(now.getFullYear(), now.getMonth(), 0); setFrom(fmt(lm)); setTo(fmt(lmEnd)); }
    else if (id === 'last-7') { const d = new Date(now); d.setDate(d.getDate() - 6); setFrom(fmt(d)); setTo(todayStr); }
    else if (id === 'this-quarter') { const qs = Math.floor(now.getMonth() / 3) * 3; setFrom(fmt(new Date(now.getFullYear(), qs, 1))); setTo(todayStr); }
    else if (id === 'all') { setFrom('2020-01-01'); setTo(todayStr); }
  };

  const buildOpts = () => ({ from, to, includes, tasks, posts, comms, igReports: igReports || [], strategies: strategies || [], team, teams, clients });
  const downloadPDF = () => {
    if (from > to) { alert('"From" date must be before "To" date.'); return; }
    if (!Object.values(includes).some(Boolean)) { alert('Pick at least one section to include.'); return; }
    generateCustomBundlePDF(buildOpts());
  };
  const downloadExcel = () => {
    if (from > to) { alert('"From" date must be before "To" date.'); return; }
    if (!Object.values(includes).some(Boolean)) { alert('Pick at least one section to include.'); return; }
    exportCustomBundleExcel(buildOpts());
  };
  const toggleInclude = (k) => setIncludes(prev => ({ ...prev, [k]: !prev[k] }));

  if (!expanded) {
    return (
      <button onClick={() => setExpanded(true)} className="card-hover" style={{ width: '100%', background: 'linear-gradient(120deg, var(--coral-soft) 0%, var(--gold-soft) 100%)', borderRadius: 18, padding: '14px 20px', marginBottom: 16, display: 'flex', alignItems: 'center', gap: 14, border: 'none', cursor: 'pointer', textAlign: 'left' }}>
        <div style={{ width: 38, height: 38, borderRadius: 12, background: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><Download size={16} color="var(--coral-deep)" /></div>
        <div style={{ flex: 1 }}>
          <p className="display" style={{ fontSize: 16, fontWeight: 500, margin: 0, lineHeight: 1.1 }}>Custom export</p>
          <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '0.95rem', margin: '2px 0 0' }}>download anything for any window of time ✨</p>
        </div>
        <ChevronRight size={14} color="var(--coral-deep)" />
      </button>
    );
  }

  return (
    <div style={{ background: 'linear-gradient(120deg, var(--coral-soft) 0%, var(--gold-soft) 100%)', borderRadius: 22, padding: 24, marginBottom: 16 }}>
      <div className="flex items-start justify-between gap-3 mb-4">
        <div className="flex items-center gap-3">
          <div style={{ width: 40, height: 40, borderRadius: 12, background: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><Download size={18} color="var(--coral-deep)" /></div>
          <div>
            <p className="display" style={{ fontSize: 18, fontWeight: 500, margin: 0, lineHeight: 1 }}>Custom export</p>
            <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1rem', margin: '2px 0 0' }}>pick a date range, choose what's in, hit download 📦</p>
          </div>
        </div>
        <button onClick={() => setExpanded(false)} className="btn-ghost text-xs">Hide</button>
      </div>

      <div className="grid grid-cols-2 gap-3 mb-3">
        <Field label="From"><input type="date" className="input-field" value={from} onChange={e => setFrom(e.target.value)} max={to} /></Field>
        <Field label="To"><input type="date" className="input-field" value={to} onChange={e => setTo(e.target.value)} max={todayStr} min={from} /></Field>
      </div>

      <div className="flex gap-1.5 mb-4 flex-wrap items-center">
        <span className="text-xs" style={{ color: 'var(--ink-soft)', padding: '6px 0' }}>quick picks:</span>
        {[{ id: 'this-month', label: 'This month' }, { id: 'last-month', label: 'Last month' }, { id: 'last-7', label: 'Last 7 days' }, { id: 'this-quarter', label: 'This quarter' }, { id: 'all', label: 'All time' }].map(q => (
          <button key={q.id} onClick={() => setQuickRange(q.id)} style={{ background: 'white', padding: '5px 11px', borderRadius: 999, fontSize: 11.5, border: '1px solid var(--line)', color: 'var(--ink-soft)', cursor: 'pointer', fontWeight: 500 }}>{q.label}</button>
        ))}
      </div>

      <p className="text-xs font-semibold mb-2" style={{ color: 'var(--ink-soft)', letterSpacing: 0.3 }}>INCLUDE IN BUNDLE</p>
      <div className="grid grid-cols-2 gap-2 mb-4">
        {[
          { id: 'tasks', label: 'Tasks', count: counts.tasks },
          { id: 'posts', label: 'Posts published', count: counts.posts },
          { id: 'team', label: 'Team performance', count: null },
          { id: 'comms', label: 'Client conversations', count: counts.comms },
          { id: 'instagram', label: 'Instagram metrics', count: counts.instagram },
          { id: 'strategy', label: 'Strategy notes', count: counts.strategy },
        ].map(item => {
          const checked = includes[item.id];
          return (
            <button key={item.id} onClick={() => toggleInclude(item.id)} style={{ background: 'white', border: '1px solid ' + (checked ? 'var(--coral)' : 'var(--line)'), borderRadius: 12, padding: '10px 12px', display: 'flex', alignItems: 'center', gap: 9, fontSize: 13, cursor: 'pointer', textAlign: 'left' }}>
              <span style={{ width: 18, height: 18, borderRadius: 5, background: checked ? 'var(--coral)' : 'white', border: checked ? 'none' : '1.5px solid var(--line)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                {checked && <CheckCircle2 size={10} color="white" style={{ strokeWidth: 3 }} />}
              </span>
              <span style={{ flex: 1, color: 'var(--ink)', fontWeight: 500 }}>{item.label}{item.count !== null ? ' (' + item.count + ')' : ''}</span>
            </button>
          );
        })}
      </div>

      <div className="flex gap-2">
        <button onClick={downloadPDF} className="btn-primary" style={{ flex: 1, padding: '11px 16px', justifyContent: 'center' }}><FileText size={13} /> Download as PDF</button>
        <button onClick={downloadExcel} style={{ flex: 1, background: 'white', color: 'var(--ink)', padding: '11px 16px', border: '1.5px solid var(--line)', borderRadius: 999, fontWeight: 500, fontSize: 13, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 7 }}><FileSpreadsheet size={13} color="#5a8068" /> Download as Excel</button>
      </div>
      <p className="text-xs text-center mt-3" style={{ color: 'var(--ink-soft)' }}>PDF gives you a polished one-document summary · Excel gives you raw data on separate sheets</p>
    </div>
  );
}

function OverviewReport({ periodTasks, periodPosts, periodComms, clients, periodLabel }) {
  const completed = periodTasks.filter(t => t.status === 'done').length;
  const inProgress = periodTasks.filter(t => t.status === 'progress').length;
  const blocked = periodTasks.filter(t => t.status === 'blocked').length;
  const published = periodPosts.filter(p => p.status === 'published').length;
  const scheduled = periodPosts.filter(p => p.status === 'scheduled').length;
  const completionRate = periodTasks.length > 0 ? Math.round((completed / periodTasks.length) * 100) : 0;
  const clientActivity = clients.map(c => ({ name: c.name, posts: periodPosts.filter(p => p.clientId === c.id).length, tasks: periodTasks.filter(t => t.clientId === c.id).length, comms: periodComms.filter(co => co.clientId === c.id).length })).filter(c => c.posts + c.tasks + c.comms > 0).sort((a, b) => (b.posts + b.tasks + b.comms) - (a.posts + a.tasks + a.comms));
  const maxActivity = Math.max(...clientActivity.map(c => c.posts + c.tasks + c.comms), 1);
  return (
    <>
      <p className="hand mb-4" style={{ color: 'var(--coral-deep)', fontSize: '1.1rem' }}>{periodLabel} 📅</p>
      <div className="grid grid-cols-4 gap-3 mb-5">
        <StatCard label="Tasks created" value={periodTasks.length} sub={`${completed} done · ${inProgress} active`} accent="var(--coral)" />
        <StatCard label="Completion rate" value={completionRate + '%'} sub={blocked > 0 ? `${blocked} blocked` : 'on track'} accent="var(--sage)" />
        <StatCard label="Posts published" value={published} sub={`${scheduled} scheduled`} accent="var(--lavender)" />
        <StatCard label="Client touches" value={periodComms.length} sub="logged" accent="var(--sky)" />
      </div>
      <div className="card card-hover">
        <h3 className="display text-lg mb-1">Client activity</h3>
        <p className="hand mb-5" style={{ color: 'var(--coral-deep)', fontSize: '1.05rem' }}>where your time is going this period</p>
        {clientActivity.length === 0 ? <p className="text-sm py-3" style={{ color: 'var(--ink-soft)' }}>No activity yet — nothing to show!</p> : (
          <div className="space-y-3.5">{clientActivity.map((c, i) => { const total = c.posts + c.tasks + c.comms; const pct = (total / maxActivity) * 100; const color = TEAM_COLORS[i % TEAM_COLORS.length]; return <div key={i}><div className="flex items-center justify-between mb-1.5"><p className="text-sm font-semibold">{c.name}</p><p className="text-xs" style={{ color: 'var(--ink-soft)' }}>{c.posts} posts · {c.tasks} tasks · {c.comms} touches</p></div><div style={{ height: 8, borderRadius: 999, background: 'var(--line-soft)', overflow: 'hidden' }}><div style={{ height: '100%', width: pct + '%', background: color, transition: 'width 0.6s ease-out', borderRadius: 999 }}></div></div></div>; })}</div>
        )}
      </div>
    </>
  );
}

function TeamReport({ team, teams, periodTasks, tasks, periodLabel }) {
  const memberStats = team.map(m => { const all = tasks.filter(t => t.assigneeId === m.id); const period = periodTasks.filter(t => t.assigneeId === m.id); const periodTeam = teams.find(tm => tm.id === m.teamId); return { ...m, teamName: periodTeam?.name, teamColor: periodTeam?.color, total: all.length, periodTotal: period.length, completed: all.filter(t => t.status === 'done').length, active: all.filter(t => t.status !== 'done').length, periodCompleted: period.filter(t => t.status === 'done').length, periodInProgress: period.filter(t => t.status === 'progress').length, periodTodo: period.filter(t => t.status === 'todo').length, periodBlocked: period.filter(t => t.status === 'blocked').length }; }).sort((a, b) => b.periodCompleted - a.periodCompleted);
  const teamStats = teams.map(t => { const members = team.filter(m => m.teamId === t.id); const teamTasks = periodTasks.filter(task => members.some(m => m.id === task.assigneeId)); return { ...t, memberCount: members.length, tasksCreated: teamTasks.length, tasksCompleted: teamTasks.filter(task => task.status === 'done').length }; }).sort((a, b) => b.tasksCompleted - a.tasksCompleted);
  const maxTeamCompleted = Math.max(...teamStats.map(t => t.tasksCompleted), 1);
  return (
    <>
      <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
        <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1.1rem' }}>{periodLabel} ✨</p>
        <div className="flex gap-2"><button onClick={() => generateTeamReportPDF(memberStats, teamStats, periodLabel, periodTasks)} className="btn-ghost"><FileText size={12} /> Export PDF</button><button onClick={() => exportTeamReportExcel(memberStats, teamStats, periodLabel, periodTasks)} className="btn-ghost"><FileSpreadsheet size={12} /> Export Excel</button></div>
      </div>
      <div className="grid grid-cols-2 gap-4">
        <div className="card card-hover">
          <h3 className="display text-lg mb-1">By team</h3>
          <p className="hand mb-4" style={{ color: 'var(--coral-deep)', fontSize: '1.05rem' }}>tasks completed by department</p>

function ModalShell({ title, onClose, onDelete, children, onSave, saveLabel = 'Save', size = 540 }) {

  const handleSave = async () => { setSaving(true); try { await onSave(); } finally { setSaving(false); } };
  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 50, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, background: 'rgba(58, 45, 45, 0.4)' }} onClick={onClose}>

        <div style={{ padding: 22 }}>{children}</div>
        <div className="flex items-center justify-between" style={{ padding: '16px 22px', borderTop: '1px solid var(--line)' }}>
          <div>{onDelete && <button onClick={async () => { if (window.confirm('Delete this?')) await onDelete(); }} style={{ fontSize: 13, fontWeight: 500, display: 'flex', alignItems: 'center', gap: 5, color: 'var(--pink)' }}><Trash2 size={12} /> Delete</button>}</div>
          <div className="flex gap-2"><button className="btn-ghost" onClick={onClose}>Cancel</button>{onSave && <button className="btn-primary" onClick={handleSave} disabled={saving}>{saving ? 'Saving...' : saveLabel}</button>}</div>
        </div>
      </div>
    </div>
  );
}
function Field({ label, children }) { return <div className="mb-3.5"><label style={{ display: 'block', fontSize: 11.5, marginBottom: 5, fontWeight: 600, color: 'var(--ink-soft)' }}>{label}</label>{children}</div>; }

function TaskModal({ task, team, clients, attachments, activity, workspaceId, userId, onAttachmentsChange, onSave, onDelete, onClose }) {
  const [data, setData] = useState(task || { title: '', description: '', status: 'todo', priority: 'medium', dueDate: '', assignedDate: today(), assigneeId: '', clientId: '', quantityTarget: null, quantityDone: null });
  const update = (k, v) => setData({ ...data, [k]: v });
  const updateNum = (k, v) => setData({ ...data, [k]: v === '' ? null : Math.max(0, parseInt(v, 10) || 0) });
  const taskAtts = task?.id ? (attachments || []).filter(a => a.taskId === task.id) : [];

  // Auto-complete logic: if quantity target is set and finished >= target, force status to 'done'
  const handleSave = () => {
    if (!data.title.trim()) return;
    const out = { ...data };
    const target = out.quantityTarget;
    const done = out.quantityDone;
    if (target != null && target > 0 && done != null && done >= target && out.status !== 'done') {
      out.status = 'done';
      out.completedAt = new Date().toISOString();
    }
    onSave(out);
  };

  // Compute progress for the small inline indicator
  const hasQty = data.quantityTarget != null && data.quantityTarget > 0;
  const qtyDone = data.quantityDone || 0;
  const qtyTarget = data.quantityTarget || 0;
  const qtyComplete = hasQty && qtyDone >= qtyTarget;

  return (<ModalShell title={task ? 'Edit task' : 'New task'} onClose={onClose} onDelete={onDelete} onSave={handleSave}>
    <Field label="Title"><input className="input-field" value={data.title} onChange={e => update('title', e.target.value)} placeholder="What needs to be done?" /></Field>
    <Field label="Description"><textarea className="input-field" rows={3} value={data.description || ''} onChange={e => update('description', e.target.value)} placeholder="Add details..." /></Field>
    <div className="grid grid-cols-2 gap-3"><Field label="Status"><select className="input-field" value={data.status} onChange={e => update('status', e.target.value)}><option value="todo">To do</option><option value="progress">In progress</option><option value="review">Review</option><option value="done">Done</option><option value="blocked">Blocked</option></select></Field><Field label="Priority"><select className="input-field" value={data.priority} onChange={e => update('priority', e.target.value)}><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></Field><Field label="Assignee"><select className="input-field" value={data.assigneeId || ''} onChange={e => update('assigneeId', e.target.value)}><option value="">Unassigned</option>{team.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select></Field><Field label="Client"><select className="input-field" value={data.clientId || ''} onChange={e => update('clientId', e.target.value)}><option value="">No client</option>{clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></Field></div>

    {/* Quantity section */}
    <div style={{ borderTop: '1px solid var(--line)', margin: '6px 0 4px', paddingTop: 14 }}>
      <p className="text-xs font-semibold mb-1" style={{ color: 'var(--ink-soft)', letterSpacing: 0.4 }}>📦 QUANTITY (optional)</p>
      <p className="hand mb-3" style={{ color: 'var(--coral-deep)', fontSize: '0.95rem' }}>use when one task covers multiple deliverables (e.g. 5 carousels, 10 reels) ✨</p>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Target"><input type="number" min="0" className="input-field" value={data.quantityTarget == null ? '' : data.quantityTarget} onChange={e => updateNum('quantityTarget', e.target.value)} placeholder="e.g. 10" /></Field>
        <Field label="Finished"><input type="number" min="0" className="input-field" value={data.quantityDone == null ? '' : data.quantityDone} onChange={e => updateNum('quantityDone', e.target.value)} placeholder="e.g. 7" /></Field>
      </div>
      {hasQty && (
        <div style={{ background: qtyComplete ? 'var(--sage-soft)' : 'var(--coral-soft)', borderRadius: 8, padding: '8px 12px', marginTop: 8, display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ fontSize: 14 }}>{qtyComplete ? '✓' : '⏱'}</span>
          <p className="text-xs" style={{ color: qtyComplete ? 'var(--sage)' : 'var(--coral-deep)', margin: 0, fontWeight: 500 }}>
            {qtyComplete ? `All ${qtyTarget} done — task will auto-mark as Done when you save ✨` : `${qtyDone} of ${qtyTarget} finished${qtyTarget - qtyDone > 0 ? ` · ${qtyTarget - qtyDone} to go` : ''}`}
          </p>
        </div>
      )}
    </div>

    <div style={{ borderTop: '1px solid var(--line)', margin: '6px 0 4px', paddingTop: 14 }}>
      <p className="text-xs font-semibold mb-1" style={{ color: 'var(--ink-soft)', letterSpacing: 0.4 }}>TIMING</p>
      <p className="hand mb-3" style={{ color: 'var(--coral-deep)', fontSize: '0.95rem' }}>when you gave it & when it's due ✨</p>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Assigned on"><input type="date" className="input-field" value={data.assignedDate || ''} onChange={e => update('assignedDate', e.target.value)} /></Field>
        <Field label="Due by"><input type="date" className="input-field" value={data.dueDate || ''} onChange={e => update('dueDate', e.target.value)} /></Field>
      </div>
    </div>
    {task?.id && (
      <div style={{ borderTop: '1px solid var(--line)', margin: '14px 0 0', paddingTop: 14 }}>
        <div className="flex items-center justify-between mb-2">
          <div>
            <p className="text-xs font-semibold" style={{ color: 'var(--ink-soft)', letterSpacing: 0.4, margin: 0 }}>ATTACHMENTS</p>
            <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '0.95rem', margin: '2px 0 0' }}>briefs, references, files for this task 📎</p>
          </div>
          <FileUploader bucket="task-attachments" parentTable="task_attachments" parentId={task.id} workspaceId={workspaceId} userId={userId} onUploaded={onAttachmentsChange} compact />
        </div>
        <AttachmentList attachments={taskAtts} bucket="task-attachments" canDelete onChanged={onAttachmentsChange} emptyMessage="No files attached yet." />
      </div>
    )}
    {task?.id && (
      <div style={{ borderTop: '1px solid var(--line)', margin: '14px 0 0', paddingTop: 14 }}>
        <div className="mb-2">
          <p className="text-xs font-semibold" style={{ color: 'var(--ink-soft)', letterSpacing: 0.4, margin: 0 }}>ACTIVITY</p>
          <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '0.95rem', margin: '2px 0 0' }}>everything that's happened to this task 🕐</p>
        </div>
        <ActivitySection activity={activity} taskId={task.id} team={team} clients={clients} currentUserId={userId} />
      </div>
    )}
    {!task?.id && (
      <p className="hand text-xs" style={{ color: 'var(--coral-deep)', marginTop: 10, fontSize: '0.95rem' }}>save the task first, then you can attach files & see activity ✨</p>
    )}
  </ModalShell>);
}

        <div className="mb-4 p-3 flex items-start gap-2" style={{ background: 'var(--sage-soft)', borderRadius: 12 }}><CheckCircle2 size={16} color="var(--sage)" style={{ marginTop: 2, flexShrink: 0 }} /><div><p className="text-sm font-semibold" style={{ color: 'var(--sage)' }}>Found {Object.keys(parsed).length} metric{Object.keys(parsed).length === 1 ? '' : 's'}!</p><p className="text-xs" style={{ color: 'var(--sage)' }}>Review and edit anything below before saving.</p></div></div>
        <div className="grid grid-cols-2 gap-3 mb-3"><Field label="Client *"><select className="input-field" value={data.clientId} onChange={e => update('clientId', e.target.value)}><option value="">Select client</option>{clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></Field><Field label="Month *"><input type="month" className="input-field" value={data.month} onChange={e => update('month', e.target.value)} /></Field></div>
        <div className="p-3 mb-3" style={{ background: 'var(--bg-warmer)', borderRadius: 14 }}><p className="text-xs font-semibold mb-3" style={{ color: 'var(--ink-soft)' }}>Audience & reach</p><div className="grid grid-cols-2 gap-2"><PreviewField label="Followers" value={data.followers} found={parsed.followers !== undefined} onChange={v => updateNum('followers', v)} /><PreviewField label="Followers gained" value={data.followersGained} found={parsed.followersGained !== undefined} onChange={v => updateNum('followersGained', v)} /><PreviewField label="Reach" value={data.reach} found={parsed.reach !== undefined} onChange={v => updateNum('reach', v)} /><PreviewField label="Impressions" value={data.impressions} found={parsed.impressions !== undefined} onChange={v => updateNum('impressions', v)} /><PreviewField label="Profile visits" value={data.profileVisits} found={parsed.profileVisits !== undefined} onChange={v => updateNum('profileVisits', v)} /><PreviewField label="Website clicks" value={data.websiteClicks} found={parsed.websiteClicks !== undefined} onChange={v => updateNum('websiteClicks', v)} /></div></div>
        <div className="p-3 mb-3" style={{ background: 'var(--bg-warmer)', borderRadius: 14 }}><p className="text-xs font-semibold mb-3" style={{ color: 'var(--ink-soft)' }}>Content count</p><div className="grid grid-cols-3 gap-2"><PreviewField label="Posts" value={data.totalPosts} found={parsed.totalPosts !== undefined} onChange={v => updateNum('totalPosts', v)} /><PreviewField label="Reels" value={data.totalReels} found={parsed.totalReels !== undefined} onChange={v => updateNum('totalReels', v)} /><PreviewField label="Stories" value={data.totalStories} found={parsed.totalStories !== undefined} onChange={v => updateNum('totalStories', v)} /></div></div>
        <Field label="Engagement rate %"><input type="number" min="0" step="0.01" className="input-field" value={data.engagementRate} onChange={e => updateNum('engagementRate', e.target.value)} placeholder="3.5" /></Field>
        <Field label="Notes"><textarea className="input-field" rows={2} value={data.notes} onChange={e => update('notes', e.target.value)} /></Field>
        <button onClick={() => setStep('upload')} className="btn-ghost text-xs"><ChevronLeft size={11} /> Upload different file</button>
      </div>
    )}
  </ModalShell>);
}
function PreviewField({ label, value, found, onChange }) {
  return <Field label={<span className="flex items-center gap-1.5">{label}{found && <span className="badge" style={{ background: 'var(--sage-soft)', color: 'var(--sage)', fontSize: 9 }}>found</span>}</span>}><input type="number" min="0" className="input-field" value={value} onChange={e => onChange(e.target.value)} style={{ borderColor: found ? 'var(--sage)' : 'var(--line)' }} /></Field>;
}

function WhatsAppPrompt({ task, member, memberTeam, client, onClose }) {
  const [copied, setCopied] = useState(false);
  const message = buildWhatsAppMessage(task, member, client);
  const hasPersonal = member && member.whatsapp;
  const hasGroup = memberTeam && memberTeam.whatsappGroup;

  const handleSendPersonal = () => { openWhatsApp(member.whatsapp, message); onClose(); };
  const handleCopyForGroup = async () => {
    try {
      await navigator.clipboard.writeText(message);
      setCopied(true);
      setTimeout(() => { window.open('https://web.whatsapp.com', '_blank'); onClose(); }, 800);
    } catch (err) {
      const ta = document.createElement('textarea');
      ta.value = message;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      setCopied(true);
      setTimeout(() => { window.open('https://web.whatsapp.com', '_blank'); onClose(); }, 800);
    }
  };

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 50, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, background: 'rgba(58, 45, 45, 0.4)' }} onClick={onClose}>
      <div className="scale-in" style={{ background: 'var(--card)', borderRadius: 18, width: '100%', maxWidth: 480, boxShadow: '0 20px 60px rgba(58, 45, 45, 0.2)' }} onClick={e => e.stopPropagation()}>
        <div style={{ padding: '24px 24px 0', textAlign: 'center' }}>
          <div style={{ width: 60, height: 60, borderRadius: '50%', background: '#25D366', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginBottom: 12 }}>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M17.498 14.382c-.301-.15-1.767-.867-2.04-.966-.273-.101-.473-.15-.673.15-.197.295-.771.964-.944 1.162-.175.195-.349.21-.646.075-.3-.15-1.263-.465-2.403-1.485-.888-.795-1.484-1.77-1.66-2.07-.174-.3-.019-.465.13-.615.136-.135.301-.345.451-.523.146-.181.194-.301.297-.496.1-.21.049-.375-.025-.524-.075-.15-.672-1.62-.922-2.206-.24-.584-.487-.51-.672-.51-.172-.015-.371-.015-.571-.015-.2 0-.523.074-.797.359-.273.3-1.045 1.02-1.045 2.475s1.07 2.865 1.219 3.075c.149.195 2.105 3.195 5.1 4.485.714.3 1.27.48 1.704.629.714.227 1.365.195 1.88.121.574-.091 1.767-.721 2.016-1.426.255-.705.255-1.29.18-1.425-.074-.135-.27-.21-.57-.345m-5.446 7.443h-.016c-1.77 0-3.524-.48-5.055-1.38l-.36-.214-3.75.975 1.005-3.645-.239-.375a9.869 9.869 0 0 1-1.516-5.26c.002-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413"/></svg>
          </div>
          <h2 className="display text-2xl mb-1">Send task notification</h2>
          <p className="hand mb-3" style={{ color: 'var(--coral-deep)', fontSize: '1.1rem' }}>pick where to send it ✨</p>
        </div>

        <div style={{ padding: '0 24px' }}>
          <div style={{ background: 'var(--bg-warmer)', borderRadius: 14, padding: 14, border: '1px solid var(--line)', maxHeight: 180, overflowY: 'auto' }}>
            <p style={{ fontSize: 11, color: 'var(--ink-soft)', marginBottom: 6, fontWeight: 600, letterSpacing: 0.5 }}>MESSAGE PREVIEW</p>
            <p style={{ fontSize: 12.5, lineHeight: 1.55, whiteSpace: 'pre-wrap', color: 'var(--ink)' }}>{message}</p>
          </div>
        </div>

        <div style={{ padding: '16px 24px 8px', display: 'flex', flexDirection: 'column', gap: 10 }}>
          {hasPersonal && (
            <button onClick={handleSendPersonal} style={{ width: '100%', background: 'white', color: 'var(--ink)', padding: '12px 16px', border: '1.5px solid var(--line)', borderRadius: 14, fontWeight: 500, fontSize: 13.5, display: 'flex', alignItems: 'center', gap: 12, transition: 'all 0.15s', textAlign: 'left', cursor: 'pointer' }} onMouseEnter={e => { e.currentTarget.style.borderColor = '#25D366'; e.currentTarget.style.background = '#f0fdf4'; }} onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--line)'; e.currentTarget.style.background = 'white'; }}>
              <div style={{ width: 36, height: 36, borderRadius: '50%', background: '#25D36622', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#25D366"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <p style={{ fontWeight: 600, fontSize: 14, marginBottom: 1 }}>Send to {member.name}</p>
                <p style={{ fontSize: 11.5, color: 'var(--ink-soft)' }}>Personal DM · {member.whatsapp}</p>
              </div>
              <ArrowRight size={14} color="var(--ink-soft)" />
            </button>
          )}

          {hasGroup && (
            <button onClick={handleCopyForGroup} style={{ width: '100%', background: 'white', color: 'var(--ink)', padding: '12px 16px', border: '1.5px solid var(--line)', borderRadius: 14, fontWeight: 500, fontSize: 13.5, display: 'flex', alignItems: 'center', gap: 12, transition: 'all 0.15s', textAlign: 'left', cursor: 'pointer' }} onMouseEnter={e => { e.currentTarget.style.borderColor = memberTeam.color || '#25D366'; e.currentTarget.style.background = (memberTeam.color || '#25D366') + '11'; }} onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--line)'; e.currentTarget.style.background = 'white'; }}>
              <div style={{ width: 36, height: 36, borderRadius: '50%', background: (memberTeam.color || '#25D366') + '22', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                <Users size={16} color={memberTeam.color || '#25D366'} />
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <p style={{ fontWeight: 600, fontSize: 14, marginBottom: 1 }}>{copied ? 'Copied! Opening WhatsApp...' : `Copy for "${memberTeam.whatsappGroup}"`}</p>
                <p style={{ fontSize: 11.5, color: 'var(--ink-soft)' }}>{copied ? 'Now paste in your group chat' : 'Copies message → opens WhatsApp Web'}</p>
              </div>
              {copied ? <CheckCircle2 size={16} color="var(--sage)" /> : <ArrowRight size={14} color="var(--ink-soft)" />}
            </button>
          )}

          {!hasGroup && hasPersonal && memberTeam && (
            <p style={{ fontSize: 11, color: 'var(--muted)', textAlign: 'center', padding: '4px 0' }}>Tip: add a WhatsApp group name to "{memberTeam.name}" team to send to the group too</p>
          )}
        </div>

        <div style={{ padding: '8px 24px 20px' }}>
          <button className="btn-ghost" onClick={onClose} style={{ width: '100%', justifyContent: 'center' }}>Skip</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
