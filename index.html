const META_METRIC_PATTERNS = {
  followers: ['followers', 'total followers', 'follower count', 'audience'],
  followersGained: ['followers gained', 'new followers', 'follows', 'follower growth', 'net follows'],
  reach: ['reach', 'accounts reached', 'unique accounts reached', 'total reach'],
  impressions: ['impressions', 'total impressions'],
  profileVisits: ['profile visits', 'profile views', 'profile activity'],
  websiteClicks: ['website clicks', 'website taps', 'link clicks', 'external link taps'],
  totalPosts: ['posts published', 'feed posts', 'total posts', 'posts'],
  totalReels: ['reels published', 'reels', 'total reels'],
  totalStories: ['stories published', 'stories', 'total stories'],
  engagementRate: ['engagement rate', 'engagement %', 'eng rate'],
};
function parseMetaExcel(data) {
  const found = {}; const wb = XLSX.read(data, { type: 'array' });
  for (const sheetName of wb.SheetNames) {
    const sheet = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
    rows.forEach((row, ri) => {
      if (!Array.isArray(row)) return;
      row.forEach((cell, ci) => {
        if (cell === null || cell === undefined || cell === '') return;
        const text = String(cell).toLowerCase().trim();
        for (const [key, patterns] of Object.entries(META_METRIC_PATTERNS)) {
          if (found[key] !== undefined) continue;
          for (const pattern of patterns) {
            if (text === pattern || text.includes(pattern)) {
              const candidates = [row[ci + 1], row[ci + 2], row[ci + 3], rows[ri + 1]?.[ci], rows[ri + 2]?.[ci], rows[ri + 1]?.[ci + 1]];
              for (const c of candidates) { const num = parseNumeric(c); if (num !== null) { found[key] = num; break; } }
              if (found[key] !== undefined) break;
            }
          }
        }
      });
    });
  }
  return found;
}
function parseNumeric(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return v;
  if (typeof v === 'string') {
    let s = v.replace(/[,\s]/g, '').trim();
    if (s === '') return null;
    let mult = 1;
    if (s.endsWith('%')) s = s.slice(0, -1);
    if (s.endsWith('K') || s.endsWith('k')) { mult = 1000; s = s.slice(0, -1); }
    else if (s.endsWith('M') || s.endsWith('m')) { mult = 1000000; s = s.slice(0, -1); }
    const n = parseFloat(s);
    if (isNaN(n)) return null;
    return n * mult;
  }
  return null;
}

function drawMetricGrid(doc, stats, x, y, width) {

    doc.setFont('helvetica', 'bold').setFontSize(18);
    doc.setTextColor(74, 58, 92);
    doc.text(String(stat.value), cx + 12, y + 44);
  });
}

  useEffect(() => { if (loading) return; const seedKey = `studio:seeded:${user.id}`; if (localStorage.getItem(seedKey)) return; if (teams.length > 0) { localStorage.setItem(seedKey, '1'); return; } const payload = DEFAULT_TEAMS.map(t => ({ ...t, user_id: user.id })); sb.from('teams').insert(payload).then(({ error }) => { if (!error) { localStorage.setItem(seedKey, '1'); refetch('teams'); } }); }, [loading, teams.length, user.id, refetch]);
  useEffect(() => { const channels = TABLES.map(table => sb.channel(`rt-${table}`).on('postgres_changes', { event: '*', schema: 'public', table }, () => refetch(table)).subscribe()); return () => { channels.forEach(c => sb.removeChannel(c)); }; }, [user.id, refetch]);
  const saveItem = async (table, item) => { await upsertItem(table, item, user.id); await refetch(table); };
  const removeItem = async (table, id) => { await deleteItem(table, id); await refetch(table); };
  const toggleTaskStatus = async (id, status) => { if (status === 'done') fireConfetti(); await sb.from('tasks').update({ status }).eq('id', id); await refetch('tasks'); };
  const updatePostStatus = async (id, status) => { if (status === 'published') fireConfetti(); await sb.from('posts').update({ status }).eq('id', id); await refetch('posts'); };
  const logout = async () => { if (window.confirm('Sign out? Sunny will miss you 🥺')) await sb.auth.signOut(); };

  const navItems = [
    { id: 'dashboard', label: 'Today', icon: LayoutDashboard, color: 'var(--coral)' },
    { id: 'tasks', label: 'Tasks', icon: CheckSquare, count: tasks.filter(t => t.status !== 'done').length, color: 'var(--purple)' },
    { id: 'team', label: 'Team', icon: Users, count: team.length, color: 'var(--mint-deep)' },
    { id: 'clients', label: 'Clients', icon: Briefcase, count: clients.length, color: 'var(--sky-deep)' },
    { id: 'calendar', label: 'Content', icon: Calendar, count: posts.filter(p => p.status === 'scheduled').length, color: 'var(--peach-deep)' },
    { id: 'reports', label: 'Reports', icon: BarChart3, color: 'var(--sun-deep)' },
    { id: 'sheets', label: 'Sheets', icon: Table2, count: sheets.length, color: 'var(--coral-deep)' },
    { id: 'strategy', label: 'Strategy', icon: Lightbulb, count: strategies.length, color: 'var(--purple-deep)' },
  ];

  if (loading) return <BootScreen />;

  return (
    <div style={{ background: 'var(--bg)', minHeight: '100vh', position: 'relative' }}>
      <div className="blob" style={{ width: 300, height: 300, background: 'var(--soft-pink)', top: 50, right: -50 }}></div>
      <div className="blob" style={{ width: 250, height: 250, background: 'var(--lavender)', bottom: 100, left: -50 }}></div>
      <div className="flex" style={{ position: 'relative', zIndex: 1 }}>
        <aside style={{ width: 260, minHeight: '100vh', padding: 24, position: 'sticky', top: 0, display: 'flex', flexDirection: 'column', background: 'rgba(255,255,255,0.7)', backdropFilter: 'blur(12px)', borderRight: '2px solid var(--line)' }}>
          <div className="flex items-center gap-3 mb-8">
            <div style={{ flexShrink: 0 }}><Sunny size={50} floating={false} /></div>
            <div className="flex-1 min-w-0">
              <div className="display" style={{ fontSize: '1.4rem', fontWeight: 700, lineHeight: 1 }}>Studio</div>
              <div className="handwritten" style={{ fontSize: '0.9rem', color: 'var(--purple)' }}>with Sunny ☀️</div>
            </div>
          </div>
          <nav className="space-y-1.5">
            {navItems.map(item => {
              const ItemIcon = item.icon;
              const active = view === item.id;
              return (
                <button key={item.id} onClick={() => setView(item.id)} className="w-full flex items-center justify-between" style={{ padding: '11px 14px', borderRadius: 14, background: active ? item.color : 'transparent', color: active ? 'white' : 'var(--ink)', transition: 'all 0.2s', boxShadow: active ? `0 4px 0 ${item.color}` : 'none' }} onMouseEnter={e => { if (!active) e.currentTarget.style.background = 'var(--soft-pink)'; }} onMouseLeave={e => { if (!active) e.currentTarget.style.background = 'transparent'; }}>
                  <span className="flex items-center gap-3"><ItemIcon size={18} /><span style={{ fontSize: '14px', fontWeight: 600 }}>{item.label}</span></span>
                  {item.count !== undefined && item.count > 0 && (<span className="text-xs" style={{ background: active ? 'rgba(255,255,255,0.3)' : item.color, color: 'white', padding: '2px 8px', borderRadius: 999, fontWeight: 700 }}>{item.count}</span>)}
                </button>
              );
            })}
          </nav>
          <div className="mt-auto pt-6">
            <div style={{ background: 'linear-gradient(135deg, var(--soft-pink), var(--lavender))', padding: 14, borderRadius: 18, marginBottom: 8, position: 'relative', overflow: 'hidden' }}>
              <div style={{ position: 'absolute', right: -10, bottom: -10, opacity: 0.4 }}><Sunny size={50} floating={false} /></div>
              <p className="text-xs truncate font-bold" style={{ position: 'relative', zIndex: 1 }}>{user.email}</p>
              <p className="text-xs handwritten" style={{ color: 'var(--purple-deep)', position: 'relative', zIndex: 1, fontSize: '0.95rem' }}>signed in 💖</p>
            </div>
            <button onClick={logout} className="w-full flex items-center gap-2" style={{ padding: '8px 14px', borderRadius: 12, color: 'var(--ink-soft)', fontSize: '13px' }} onMouseEnter={e => e.currentTarget.style.background = 'var(--soft-pink)'} onMouseLeave={e => e.currentTarget.style.background = 'transparent'}><LogOut size={14} /> Sign out</button>
          </div>
        </aside>
        <main className="flex-1 min-h-screen" style={{ padding: '32px 40px', maxWidth: 1400 }}>
          {view === 'dashboard' && <DashboardView tasks={tasks} team={team} clients={clients} posts={posts} comms={comms} strategies={strategies} setView={setView} onQuickTask={() => setModal({ type: 'task' })} onQuickPost={() => setModal({ type: 'post' })} />}
          {view === 'tasks' && <TasksView tasks={tasks} team={team} clients={clients} toggleStatus={toggleTaskStatus} onAdd={() => setModal({ type: 'task' })} onEdit={(t) => setModal({ type: 'task', data: t })} />}
          {view === 'team' && <TeamView team={team} teams={teams} tasks={tasks} onAddMember={() => setModal({ type: 'member' })} onEditMember={(m) => setModal({ type: 'member', data: m })} onAddTeam={() => setModal({ type: 'teamFolder' })} onEditTeam={(t) => setModal({ type: 'teamFolder', data: t })} />}
          {view === 'clients' && <ClientsView clients={clients} comms={comms} tasks={tasks} onAdd={() => setModal({ type: 'client' })} onEdit={(c) => setModal({ type: 'client', data: c })} onLog={(c) => setModal({ type: 'comm', data: { clientId: c.id } })} />}
          {view === 'calendar' && <CalendarView posts={posts} clients={clients} updateStatus={updatePostStatus} onAdd={() => setModal({ type: 'post' })} onEdit={(p) => setModal({ type: 'post', data: p })} />}
          {view === 'reports' && <ReportsView tasks={tasks} team={team} teams={teams} clients={clients} posts={posts} comms={comms} igReports={igReports} onAddIgReport={() => setModal({ type: 'igReport' })} onImportIg={() => setModal({ type: 'igImport' })} onEditIgReport={(r) => setModal({ type: 'igReport', data: r })} onEditPost={(p) => setModal({ type: 'post', data: p })} />}
          {view === 'sheets' && <SheetsView sheets={sheets} onAdd={() => setModal({ type: 'sheet' })} onEdit={(s) => setModal({ type: 'sheet', data: s })} />}
          {view === 'strategy' && <StrategyView strategies={strategies} clients={clients} onAdd={() => setModal({ type: 'strategy' })} onEdit={(s) => setModal({ type: 'strategy', data: s })} />}
        </main>
      </div>
      {modal?.type === 'task' && <TaskModal task={modal.data} team={team} clients={clients} onSave={async (t) => { await saveItem('tasks', t); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('tasks', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'member' && <MemberModal member={modal.data} teams={teams} onSave={async (m) => { await saveItem('team', m); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('team', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'teamFolder' && <TeamFolderModal team={modal.data} onSave={async (t) => { await saveItem('teams', t); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('teams', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'client' && <ClientModal client={modal.data} onSave={async (c) => { await saveItem('clients', c); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('clients', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'post' && <PostModal post={modal.data} clients={clients} onSave={async (p) => { await saveItem('posts', p); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('posts', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'sheet' && <SheetModal sheet={modal.data} onSave={async (s) => { await saveItem('sheets', s); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('sheets', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'strategy' && <StrategyModal strategy={modal.data} clients={clients} onSave={async (s) => { await saveItem('strategies', s); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('strategies', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'comm' && <CommModal comm={modal.data} clients={clients} onSave={async (c) => { await saveItem('comms', c); setModal(null); }} onClose={() => setModal(null)} />}
      {modal?.type === 'igReport' && <IgReportModal report={modal.data} clients={clients} posts={posts} onSave={async (r) => { await saveItem('instagram_reports', r); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('instagram_reports', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'igImport' && <IgImportModal clients={clients} onSave={async (r) => { await saveItem('instagram_reports', r); setModal(null); }} onClose={() => setModal(null)} />}
    </div>
  );
}

function DashboardView({ tasks, team, clients, posts, comms, strategies, setView, onQuickTask, onQuickPost }) {

  const inProgress = tasks.filter(t => t.status === 'progress');

  const postsToday = posts.filter(p => p.scheduledDate?.startsWith(todayStr));

        <div className="flex items-start gap-5" style={{ position: 'relative', zIndex: 1 }}>

      </div>
      <div className="grid grid-cols-4 gap-4 mb-8">

        <PlayfulStat label="Clients" value={clients.length} sub={`${clients.filter(c => c.status === 'active').length} active`} color="var(--purple)" softColor="var(--lavender)" emoji="💼" onClick={() => setView('clients')} />
        <PlayfulStat label="Posts queued" value={posts.filter(p => p.status === 'scheduled').length} sub={`${postsToday.length} today`} color="var(--mint-deep)" softColor="var(--mint)" emoji="🚀" onClick={() => setView('calendar')} />
        <PlayfulStat label="Team" value={team.length} sub="amazing humans" color="var(--peach-deep)" softColor="var(--peach)" emoji="💫" onClick={() => setView('team')} />
      </div>
      <div className="flex gap-3 mb-8 items-center">
        <button className="btn-primary" onClick={onQuickTask}><Plus size={16} /> New task</button>
        <button className="btn-ghost wiggle" onClick={onQuickPost}><Calendar size={14} /> Schedule post</button>
        <button className="btn-ghost wiggle" onClick={() => setView('reports')}><BarChart3 size={14} /> See reports</button>
        <p className="handwritten ml-auto" style={{ color: 'var(--purple)', fontSize: '1.1rem' }}>tap any card to dive in →</p>

      <div className="grid grid-cols-3 gap-6">

              const platform = PLATFORMS.find(pl => pl.id === p.platform);
              const PIcon = platform?.icon || Instagram;
              const client = clients.find(c => c.id === p.clientId);
              return <div key={p.id} className="flex items-start gap-3 p-3" style={{ background: 'white', borderRadius: 16, border: '2px solid var(--line)' }}>

              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 mb-0.5"><p className="text-sm font-bold">{client?.name || 'Unknown'}</p><span className="sticker" style={{ background: 'var(--lavender)', color: 'var(--purple-deep)' }}>{c.type}</span></div>

          <div style={{ position: 'relative', zIndex: 1 }}>
            <div className="flex items-center gap-2 mb-3"><TrendingUp size={18} /><span className="handwritten" style={{ fontSize: '1.1rem' }}>this week's wins ✨</span></div>
            <h2 className="display text-4xl mb-6" style={{ fontWeight: 700 }}>You're killing it!</h2>
            <div className="space-y-3.5">

function PlayfulStat({ label, value, sub, color, softColor, emoji, onClick }) {

      <div style={{ position: 'absolute', top: -10, right: -10, width: 80, height: 80, borderRadius: '50%', background: softColor, opacity: 0.5 }}></div>

      <div style={{ position: 'relative', zIndex: 1 }}>

function BigMetric({ label, value }) { return <div className="flex items-center justify-between pb-2.5" style={{ borderBottom: '2px dashed rgba(255,255,255,0.3)' }}><span style={{ opacity: 0.85, fontSize: 14, fontWeight: 500 }}>{label}</span><span className="display" style={{ fontSize: '2rem', fontWeight: 700 }}>{value}</span></div>; }

function TasksView({ tasks, team, clients, toggleStatus, onAdd, onEdit }) {

  const buckets = [{ id: 'todo', label: 'To do', emoji: '📝' }, { id: 'progress', label: 'In progress', emoji: '⚡' }, { id: 'review', label: 'Review', emoji: '👀' }, { id: 'done', label: 'Done', emoji: '✨' }, { id: 'blocked', label: 'Blocked', emoji: '🚧' }];
  return (
    <div className="fade-in">
      <PageHeader title="Tasks" subtitle="all the things on your plate" emoji="📋" action={<button className="btn-primary" onClick={onAdd}><Plus size={16} /> New task</button>} />
      <div className="flex items-center gap-3 mb-6 flex-wrap">
        <div className="flex items-center gap-2" style={{ background: 'white', padding: '10px 16px', borderRadius: 999, border: '2px solid var(--lavender)' }}><Search size={14} color="var(--purple)" /><input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search tasks..." style={{ background: 'transparent', outline: 'none', fontSize: 13, width: 200, fontWeight: 500 }} /></div>
        <PillFilter label={`All (${tasks.length})`} active={filter === 'all'} onClick={() => setFilter('all')} />
        {buckets.map(b => { const c = tasks.filter(t => t.status === b.id).length; return <PillFilter key={b.id} label={`${b.emoji} ${b.label} (${c})`} active={filter === b.id} onClick={() => setFilter(b.id)} />; })}
      </div>
      {filtered.length === 0 ? <PlayfulEmpty title="No tasks yet" message="Sunny says: every great campaign starts with one task. Let's add it!" action={onAdd} actionLabel="Add a task" /> : <div className="space-y-2.5">{filtered.map(t => <TaskRow key={t.id} task={t} team={team} clients={clients} onClick={() => onEdit(t)} onStatusChange={toggleStatus} />)}</div>}
    </div>
  );
}
function PillFilter({ label, active, onClick }) { return <button onClick={onClick} style={{ padding: '8px 14px', borderRadius: 999, fontSize: 13, fontWeight: 600, background: active ? 'var(--purple)' : 'white', color: active ? 'white' : 'var(--ink)', border: '2px solid ' + (active ? 'var(--purple)' : 'var(--lavender)'), boxShadow: active ? '0 3px 0 var(--purple-deep)' : 'none', transition: 'all 0.15s' }}>{label}</button>; }
function TaskRow({ task, team, clients, compact, onClick, onStatusChange }) {
  const member = team.find(m => m.id === task.assigneeId);
  const client = clients.find(c => c.id === task.clientId);
  const status = STATUS_COLORS[task.status] || STATUS_COLORS.todo;

  return (
    <div onClick={onClick} className="flex items-center gap-4" style={{ padding: 14, borderRadius: 16, background: 'white', border: '2px solid var(--line)', cursor: onClick ? 'pointer' : 'default', transition: 'all 0.2s' }} onMouseEnter={e => { if (onClick) { e.currentTarget.style.transform = 'translateY(-2px)'; e.currentTarget.style.borderColor = 'var(--lavender)'; } }} onMouseLeave={e => { if (onClick) { e.currentTarget.style.transform = 'translateY(0)'; e.currentTarget.style.borderColor = 'var(--line)'; } }}>
      <button onClick={(e) => { e.stopPropagation(); if (onStatusChange) onStatusChange(task.id, task.status === 'done' ? 'todo' : 'done'); }} style={{ flexShrink: 0 }}>{task.status === 'done' ? <CheckCircle2 size={22} color="var(--mint-deep)" /> : <Circle size={22} color="var(--muted)" />}</button>

        <div className="flex items-center gap-2 mb-0.5">{task.priority === 'high' && <Flag size={12} color={PRIORITY_COLORS.high} style={{ fill: PRIORITY_COLORS.high }} />}<p className="text-sm font-bold truncate" style={{ textDecoration: task.status === 'done' ? 'line-through' : 'none', opacity: task.status === 'done' ? 0.5 : 1 }}>{task.title}</p></div>
        {!compact && task.description && <p className="text-xs leading-snug" style={{ color: 'var(--ink-soft)' }}>{task.description.slice(0, 100)}{task.description.length > 100 ? '...' : ''}</p>}
      </div>
      <div className="flex items-center gap-2 flex-shrink-0">
        {client && <span className="sticker" style={{ background: 'var(--lavender)', color: 'var(--purple-deep)' }}>{client.name}</span>}
        <span className="sticker" style={{ background: status.bg, color: status.text }}>{task.status}</span>
        {member && <div style={{ width: 30, height: 30, borderRadius: '50%', background: 'linear-gradient(135deg, var(--coral), var(--purple))', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', fontWeight: 700, fontSize: 12, flexShrink: 0 }} title={member.name}>{member.name[0]?.toUpperCase()}</div>}
        {task.dueDate && <span className="text-xs flex items-center gap-1 handwritten" style={{ color: isOverdue ? 'var(--coral-deep)' : 'var(--purple)', fontSize: '1rem' }}><Clock size={12} /> {formatDate(task.dueDate)}</span>}
      </div>
    </div>
  );
}

function ReportsView({ tasks, team, teams, clients, posts, comms, igReports, onAddIgReport, onImportIg, onEditIgReport, onEditPost }) {
  const [tab, setTab] = useState('overview');

  const periodTasks = tasks.filter(t => isInPeriod(t.createdAt, period));
  const periodPosts = posts.filter(p => isInPeriod(p.scheduledDate, period));
  const periodComms = comms.filter(c => isInPeriod(c.date, period));
  const periodLabel = period === 'week' ? 'Last 7 days' : period === 'month' ? 'Last 30 days' : period === 'quarter' ? 'Last 90 days' : 'All time';
  return (
    <div className="fade-in">
      <PageHeader title="Reports" subtitle="all the wins, all the data" emoji="📊" />
      <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div className="flex gap-2">{[{ id: 'overview', label: '🌟 Overview' }, { id: 'team', label: '💫 Team' }, { id: 'posts', label: '🚀 Posts' }, { id: 'instagram', label: '💖 Instagram' }].map(t => <PillFilter key={t.id} label={t.label} active={tab === t.id} onClick={() => setTab(t.id)} />)}</div>
        {tab !== 'instagram' && <div className="flex gap-1 p-1 rounded-full" style={{ background: 'white', border: '2px solid var(--lavender)' }}>{[{ id: 'week', label: 'Week' }, { id: 'month', label: 'Month' }, { id: 'quarter', label: 'Quarter' }, { id: 'all', label: 'All' }].map(p => <button key={p.id} onClick={() => setPeriod(p.id)} style={{ padding: '6px 14px', borderRadius: 999, fontSize: 12, fontWeight: 700, background: period === p.id ? 'var(--purple)' : 'transparent', color: period === p.id ? 'white' : 'var(--ink)', transition: 'all 0.15s' }}>{p.label}</button>)}</div>}
      </div>
      {tab === 'overview' && <OverviewReport periodTasks={periodTasks} periodPosts={periodPosts} periodComms={periodComms} clients={clients} periodLabel={periodLabel} />}
      {tab === 'team' && <TeamReport team={team} teams={teams} periodTasks={periodTasks} tasks={tasks} periodLabel={periodLabel} />}
      {tab === 'posts' && <PostsReport periodPosts={periodPosts} clients={clients} onEditPost={onEditPost} periodLabel={periodLabel} />}
      {tab === 'instagram' && <InstagramReport reports={igReports} clients={clients} posts={posts} onAdd={onAddIgReport} onImport={onImportIg} onEdit={onEditIgReport} />}
    </div>
  );
}

function OverviewReport({ periodTasks, periodPosts, periodComms, clients, periodLabel }) {
  const completed = periodTasks.filter(t => t.status === 'done').length;
  const inProgress = periodTasks.filter(t => t.status === 'progress').length;
  const blocked = periodTasks.filter(t => t.status === 'blocked').length;
  const published = periodPosts.filter(p => p.status === 'published').length;
  const scheduled = periodPosts.filter(p => p.status === 'scheduled').length;
  const completionRate = periodTasks.length > 0 ? Math.round((completed / periodTasks.length) * 100) : 0;
  const clientActivity = clients.map(c => ({ name: c.name, posts: periodPosts.filter(p => p.clientId === c.id).length, tasks: periodTasks.filter(t => t.clientId === c.id).length, comms: periodComms.filter(co => co.clientId === c.id).length })).filter(c => c.posts + c.tasks + c.comms > 0).sort((a, b) => (b.posts + b.tasks + b.comms) - (a.posts + a.tasks + a.comms));
  const maxActivity = Math.max(...clientActivity.map(c => c.posts + c.tasks + c.comms), 1);
  return (
    <>
      <p className="handwritten mb-4" style={{ color: 'var(--purple)', fontSize: '1.2rem' }}>{periodLabel} ✨</p>
      <div className="grid grid-cols-4 gap-4 mb-6">

        <PlayfulStat label="Completion rate" value={completionRate + '%'} sub={blocked > 0 ? `${blocked} blocked 🚧` : 'all flowing 🌊'} color={completionRate > 70 ? 'var(--mint-deep)' : completionRate > 40 ? 'var(--peach-deep)' : 'var(--coral)'} softColor="var(--mint)" emoji="🎯" onClick={null} />
        <PlayfulStat label="Posts" value={published} sub={`${scheduled} scheduled`} color="var(--coral)" softColor="var(--soft-pink)" emoji="🚀" onClick={null} />
        <PlayfulStat label="Client touches" value={periodComms.length} sub="convos logged" color="var(--sky-deep)" softColor="var(--sky)" emoji="💬" onClick={null} />
      </div>
      <div className="card card-hover">
        <h3 className="display text-3xl mb-1">Client activity</h3>
        <p className="handwritten mb-5" style={{ color: 'var(--purple)', fontSize: '1rem' }}>who's getting your magic? ✨</p>
        {clientActivity.length === 0 ? <p className="handwritten py-4" style={{ color: 'var(--muted)', fontSize: '1.1rem' }}>nothing yet in this period</p> : (
          <div className="space-y-4">{clientActivity.map((c, i) => { const total = c.posts + c.tasks + c.comms; const pct = (total / maxActivity) * 100; const color = TEAM_COLORS[i % TEAM_COLORS.length]; return <div key={i}><div className="flex items-center justify-between mb-2"><p className="text-sm font-bold">{c.name}</p><p className="text-xs handwritten" style={{ color: 'var(--purple)' }}>{c.posts} posts · {c.tasks} tasks · {c.comms} touches</p></div><div style={{ height: 14, borderRadius: 999, background: 'var(--bg)', overflow: 'hidden', border: '2px solid var(--line)' }}><div style={{ height: '100%', width: pct + '%', background: `linear-gradient(90deg, ${color}, ${color}cc)`, transition: 'width 0.6s ease-out', borderRadius: 999 }}></div></div></div>; })}</div>
        )}
      </div>
    </>
  );
}

function TeamReport({ team, teams, periodTasks, tasks, periodLabel }) {
  const memberStats = team.map(m => { const all = tasks.filter(t => t.assigneeId === m.id); const period = periodTasks.filter(t => t.assigneeId === m.id); const periodTeam = teams.find(tm => tm.id === m.teamId); return { ...m, teamName: periodTeam?.name, teamColor: periodTeam?.color, total: all.length, periodTotal: period.length, completed: all.filter(t => t.status === 'done').length, active: all.filter(t => t.status !== 'done').length, periodCompleted: period.filter(t => t.status === 'done').length, periodInProgress: period.filter(t => t.status === 'progress').length, periodTodo: period.filter(t => t.status === 'todo').length, periodBlocked: period.filter(t => t.status === 'blocked').length }; }).sort((a, b) => b.periodCompleted - a.periodCompleted);
  const teamStats = teams.map(t => { const members = team.filter(m => m.teamId === t.id); const teamTasks = periodTasks.filter(task => members.some(m => m.id === task.assigneeId)); return { ...t, memberCount: members.length, tasksCreated: teamTasks.length, tasksCompleted: teamTasks.filter(task => task.status === 'done').length }; }).sort((a, b) => b.tasksCompleted - a.tasksCompleted);

        </div>

          <h3 className="display text-2xl mb-1">Top performers</h3>

  return <Field label={<span className="flex items-center gap-1.5">{label}{found && <span className="sticker" style={{ background: 'var(--mint)', color: 'var(--mint-deep)', fontSize: 9 }}>found</span>}</span>}><input type="number" min="0" className="input-field" value={value} onChange={e => onChange(e.target.value)} style={{ borderColor: found ? 'var(--mint-deep)' : 'var(--lavender)' }} /></Field>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
