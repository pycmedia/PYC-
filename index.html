function fireConfetti() {

  const colors = ['#e89177', '#87a690', '#a994c4', '#f1c462', '#d97e9c', '#7aa5c0'];

const META_METRIC_PATTERNS = {
  followers: ['followers', 'total followers', 'follower count', 'audience'],
  followersGained: ['followers gained', 'new followers', 'follows', 'follower growth', 'net follows'],
  reach: ['reach', 'accounts reached', 'unique accounts reached', 'total reach'],
  impressions: ['impressions', 'total impressions'],
  profileVisits: ['profile visits', 'profile views', 'profile activity'],
  websiteClicks: ['website clicks', 'website taps', 'link clicks', 'external link taps'],
  totalPosts: ['posts published', 'feed posts', 'total posts', 'posts'],
  totalReels: ['reels published', 'reels', 'total reels'],
  totalStories: ['stories published', 'stories', 'total stories'],
  engagementRate: ['engagement rate', 'engagement %', 'eng rate'],
};
function parseMetaExcel(data) {
  const found = {}; const wb = XLSX.read(data, { type: 'array' });
  for (const sheetName of wb.SheetNames) {
    const sheet = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
    rows.forEach((row, ri) => {
      if (!Array.isArray(row)) return;
      row.forEach((cell, ci) => {
        if (cell === null || cell === undefined || cell === '') return;
        const text = String(cell).toLowerCase().trim();
        for (const [key, patterns] of Object.entries(META_METRIC_PATTERNS)) {
          if (found[key] !== undefined) continue;
          for (const pattern of patterns) {
            if (text === pattern || text.includes(pattern)) {
              const candidates = [row[ci + 1], row[ci + 2], row[ci + 3], rows[ri + 1]?.[ci], rows[ri + 2]?.[ci], rows[ri + 1]?.[ci + 1]];
              for (const c of candidates) { const num = parseNumeric(c); if (num !== null) { found[key] = num; break; } }
              if (found[key] !== undefined) break;
            }
          }
        }
      });
    });
  }
  return found;
}
function parseNumeric(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return v;
  if (typeof v === 'string') {
    let s = v.replace(/[,\s]/g, '').trim();
    if (s === '') return null;
    let mult = 1;
    if (s.endsWith('%')) s = s.slice(0, -1);
    if (s.endsWith('K') || s.endsWith('k')) { mult = 1000; s = s.slice(0, -1); }
    else if (s.endsWith('M') || s.endsWith('m')) { mult = 1000000; s = s.slice(0, -1); }
    const n = parseFloat(s);
    if (isNaN(n)) return null;
    return n * mult;
  }
  return null;
}

function drawMetricGrid(doc, stats, x, y, width) {
  const colW = width / stats.length;
  stats.forEach((stat, i) => {
    const cx = x + i * colW;
    doc.setFillColor(253, 248, 241);
    doc.roundedRect(cx, y, colW - 8, 60, 8, 8, 'F');
    doc.setFont('helvetica', 'normal').setFontSize(8);
    doc.setTextColor(107, 88, 86);
    doc.text(String(stat.label).toUpperCase(), cx + 12, y + 18);
    doc.setFont('helvetica', 'bold').setFontSize(18);
    doc.setTextColor(58, 45, 45);
    doc.text(String(stat.value), cx + 12, y + 44);
  });
}

const fetchTable = async (table) => { const { data, error } = await sb.from(table).select('*'); if (error) { console.error(`fetch ${table}:`, error); return []; } return data.map(toCamel); };
const upsertItem = async (table, item, userId) => { const { id, createdAt, ...rest } = item; const cleaned = {}; for (const [k, v] of Object.entries(rest)) { cleaned[k] = (v === '' && (k.endsWith('Id') || k === 'dueDate' || k === 'scheduledDate' || k === 'date')) ? null : v; } const payload = toSnake(cleaned); const op = id ? sb.from(table).update(payload).eq('id', id) : sb.from(table).insert({ ...payload, user_id: userId }); const { error } = await op; if (error) { console.error(`save ${table}:`, error); alert('Save failed: ' + error.message); } };
const deleteItem = async (table, id) => { const { error } = await sb.from(table).delete().eq('id', id); if (error) console.error(`delete ${table}:`, error); };

    if (!sb) { setAuthLoading(false); return; }
    sb.auth.getSession().then(({ data: { session } }) => { setUser(session?.user || null); setAuthLoading(false); });
    const { data: { subscription } } = sb.auth.onAuthStateChange((_e, session) => setUser(session?.user || null));

}

              <div style={{ minWidth: 0, flex: 1 }}><p className="text-xs truncate" style={{ fontWeight: 500 }}>{user.email}</p><p className="hand text-xs" style={{ color: 'var(--coral-deep)', fontSize: '0.95rem' }}>signed in</p></div>

          {view === 'team' && <TeamView team={team} teams={teams} tasks={tasks} onAddMember={() => setModal({ type: 'member' })} onEditMember={(m) => setModal({ type: 'member', data: m })} onAddTeam={() => setModal({ type: 'teamFolder' })} onEditTeam={(t) => setModal({ type: 'teamFolder', data: t })} />}
          {view === 'clients' && <ClientsView clients={clients} comms={comms} tasks={tasks} onAdd={() => setModal({ type: 'client' })} onEdit={(c) => setModal({ type: 'client', data: c })} onLog={(c) => setModal({ type: 'comm', data: { clientId: c.id } })} />}
          {view === 'calendar' && <CalendarView posts={posts} clients={clients} updateStatus={updatePostStatus} onAdd={() => setModal({ type: 'post' })} onEdit={(p) => setModal({ type: 'post', data: p })} />}
          {view === 'reports' && <ReportsView tasks={tasks} team={team} teams={teams} clients={clients} posts={posts} comms={comms} igReports={igReports} onAddIgReport={() => setModal({ type: 'igReport' })} onImportIg={() => setModal({ type: 'igImport' })} onEditIgReport={(r) => setModal({ type: 'igReport', data: r })} onEditPost={(p) => setModal({ type: 'post', data: p })} />}
          {view === 'sheets' && <SheetsView sheets={sheets} onAdd={() => setModal({ type: 'sheet' })} onEdit={(s) => setModal({ type: 'sheet', data: s })} />}
          {view === 'strategy' && <StrategyView strategies={strategies} clients={clients} onAdd={() => setModal({ type: 'strategy' })} onEdit={(s) => setModal({ type: 'strategy', data: s })} />}
        </main>
      </div>
      {modal?.type === 'task' && <TaskModal task={modal.data} team={team} clients={clients} onSave={async (t) => { await saveItem('tasks', t); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('tasks', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'member' && <MemberModal member={modal.data} teams={teams} onSave={async (m) => { await saveItem('team', m); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('team', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'teamFolder' && <TeamFolderModal team={modal.data} onSave={async (t) => { await saveItem('teams', t); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('teams', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'client' && <ClientModal client={modal.data} onSave={async (c) => { await saveItem('clients', c); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('clients', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'post' && <PostModal post={modal.data} clients={clients} onSave={async (p) => { await saveItem('posts', p); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('posts', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'sheet' && <SheetModal sheet={modal.data} onSave={async (s) => { await saveItem('sheets', s); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('sheets', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'strategy' && <StrategyModal strategy={modal.data} clients={clients} onSave={async (s) => { await saveItem('strategies', s); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('strategies', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'comm' && <CommModal comm={modal.data} clients={clients} onSave={async (c) => { await saveItem('comms', c); setModal(null); }} onClose={() => setModal(null)} />}
      {modal?.type === 'igReport' && <IgReportModal report={modal.data} clients={clients} posts={posts} onSave={async (r) => { await saveItem('instagram_reports', r); setModal(null); }} onDelete={modal.data ? async () => { await removeItem('instagram_reports', modal.data.id); setModal(null); } : null} onClose={() => setModal(null)} />}
      {modal?.type === 'igImport' && <IgImportModal clients={clients} onSave={async (r) => { await saveItem('instagram_reports', r); setModal(null); }} onClose={() => setModal(null)} />}
    </div>
  );
}

function DashboardView({ tasks, team, clients, posts, comms, strategies, setView, onQuickTask, onQuickPost, userEmail }) {
  const todayStr = today();
  const dueToday = tasks.filter(t => t.dueDate === todayStr && t.status !== 'done');
  const overdue = tasks.filter(t => t.dueDate && t.dueDate < todayStr && t.status !== 'done');
  const inProgress = tasks.filter(t => t.status === 'progress');
  const postsToday = posts.filter(p => p.scheduledDate?.startsWith(todayStr));
  const upcomingPosts = posts.filter(p => p.scheduledDate > new Date().toISOString() && p.status === 'scheduled').sort((a, b) => a.scheduledDate.localeCompare(b.scheduledDate)).slice(0, 4);
  const recentComms = comms.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4);
  const dateText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const firstName = userEmail?.split('@')[0]?.split('.')[0] || '';
  const displayName = firstName.charAt(0).toUpperCase() + firstName.slice(1);
  const g = getGreeting();
  return (
    <div className="fade-in">
      <header className="mb-8 flex items-center gap-4">
        <Sunny size={56} mood={g.mood} float />
        <div className="flex-1">
          <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1.1rem', lineHeight: 1, marginBottom: 6 }}>{dateText}</p>
          <h1 className="display" style={{ fontSize: '2.4rem', fontWeight: 500, lineHeight: 1.1 }}>{g.greeting}{displayName ? `, ${displayName}` : ''}!</h1>
        </div>
        <div className="speech-bubble hand" style={{ fontSize: '1.05rem', color: 'var(--coral-deep)' }}>{g.message}</div>
      </header>

      <div className="grid grid-cols-4 gap-3 mb-7">
        <StatCard label="Active tasks" value={tasks.filter(t => t.status !== 'done').length} sub={`${inProgress.length} in progress`} onClick={() => setView('tasks')} alert={overdue.length > 0 ? `${overdue.length} overdue` : null} accent="var(--coral)" />
        <StatCard label="Active clients" value={clients.filter(c => c.status === 'active').length} sub={`${clients.length} total`} onClick={() => setView('clients')} accent="var(--lavender)" />
        <StatCard label="Posts scheduled" value={posts.filter(p => p.status === 'scheduled').length} sub={`${postsToday.length} today`} onClick={() => setView('calendar')} accent="var(--sky)" />
        <StatCard label="Team" value={team.length} sub={team.length === 1 ? 'member' : 'members'} onClick={() => setView('team')} accent="var(--sage)" />
      </div>

      <div className="flex gap-2 mb-7 items-center">
        <button className="btn-primary" onClick={onQuickTask}><Plus size={14} /> New task</button>
        <button className="btn-ghost" onClick={onQuickPost}><Calendar size={13} /> Schedule post</button>
        <button className="btn-ghost" onClick={() => setView('reports')}><BarChart3 size={13} /> Reports</button>
      </div>

      <div className="grid grid-cols-3 gap-4">
        <div className="col-span-2 card card-hover">
          <div className="flex items-center justify-between mb-5">
            <div>
              <h2 className="display text-xl">Today's focus</h2>
              <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1rem', marginTop: -2 }}>what needs love today</p>
            </div>
            <button className="btn-ghost text-xs" onClick={() => setView('tasks')}>View all <ChevronRight size={12} /></button>
          </div>
          {overdue.length > 0 && (
            <div className="mb-4 flex items-center gap-3 p-3" style={{ background: 'var(--pink-soft)', borderRadius: 12, border: '1px solid #f0c5d2' }}>
              <AlertCircle size={16} color="var(--pink)" />
              <p className="text-sm font-semibold" style={{ color: 'var(--pink)' }}>{overdue.length} task{overdue.length > 1 ? 's' : ''} need{overdue.length === 1 ? 's' : ''} attention</p>
            </div>
          )}
          {dueToday.length === 0 && overdue.length === 0 ? (
            <div style={{ padding: '28px 20px', textAlign: 'center' }}>
              <Sunny size={48} mood="excited" float />
              <p className="display text-lg mt-3 mb-1">All caught up!</p>
              <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1.1rem' }}>nothing burning today ✨</p>
            </div>
          ) : <div className="space-y-2">{[...overdue, ...dueToday].slice(0, 6).map(task => <TaskRow key={task.id} task={task} team={team} clients={clients} compact />)}</div>}
        </div>

        <div className="card card-hover">
          <div className="flex items-center justify-between mb-5">
            <div>
              <h2 className="display text-xl">Up next</h2>
              <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1rem', marginTop: -2 }}>scheduled posts</p>
            </div>
            <button className="btn-ghost text-xs" onClick={() => setView('calendar')}>All <ChevronRight size={12} /></button>
          </div>
          {upcomingPosts.length === 0 ? (
            <div style={{ padding: '20px 0', textAlign: 'center' }}>
              <Calendar size={28} color="var(--muted)" style={{ margin: '0 auto 6px' }} />
              <p className="hand" style={{ color: 'var(--ink-soft)', fontSize: '1rem' }}>nothing scheduled yet</p>
            </div>
          ) : (
            <div className="space-y-3">{upcomingPosts.map(p => {
              const platform = PLATFORMS.find(pl => pl.id === p.platform);
              const PIcon = platform?.icon || Instagram;
              const client = clients.find(c => c.id === p.clientId);
              return <div key={p.id} className="flex items-start gap-3">
                <div style={{ width: 32, height: 32, borderRadius: 10, background: platform?.color || 'var(--ink)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><PIcon size={14} color="white" /></div>
                <div className="flex-1 min-w-0">
                  <p className="text-xs font-semibold" style={{ color: 'var(--ink-soft)' }}>{client?.name || 'Unassigned'}</p>
                  <p className="text-sm leading-snug truncate">{p.caption || 'Untitled post'}</p>
                  <p className="text-xs mt-0.5" style={{ color: 'var(--muted)' }}>{formatDateTime(p.scheduledDate)}</p>
                </div>
              </div>;
            })}</div>
          )}
        </div>
      </div>

      <div className="grid grid-cols-2 gap-4 mt-4">
        <div className="card card-hover">
          <div className="mb-5">
            <h2 className="display text-xl">Recent client activity</h2>
            <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1rem', marginTop: -2 }}>latest conversations</p>
          </div>
          {recentComms.length === 0 ? <p className="text-sm py-2" style={{ color: 'var(--ink-soft)' }}>No conversations logged yet — start chatting!</p> : (
            <div className="space-y-3.5">{recentComms.map((c, i) => { const client = clients.find(cl => cl.id === c.clientId); return <div key={c.id} className="flex items-start gap-3" style={{ paddingBottom: i < recentComms.length - 1 ? 14 : 0, borderBottom: i < recentComms.length - 1 ? '1px solid var(--line)' : 'none' }}>
              <div style={{ width: 34, height: 34, borderRadius: '50%', background: 'var(--lavender-soft)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, color: 'var(--lavender)', fontWeight: 600, fontSize: 13 }}>{client?.name?.[0]?.toUpperCase() || '?'}</div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 mb-0.5"><p className="text-sm font-semibold">{client?.name || 'Unknown'}</p><span className="badge" style={{ background: 'var(--line-soft)', color: 'var(--ink-soft)' }}>{c.type}</span></div>
                <p className="text-sm leading-snug" style={{ color: 'var(--ink-soft)' }}>{c.summary}</p>
                <p className="text-xs mt-1" style={{ color: 'var(--muted)' }}>{formatDateTime(c.date)}</p>
              </div>
            </div>; })}</div>
          )}
        </div>

        <div className="card" style={{ background: 'linear-gradient(135deg, #3a2d2d 0%, #4a3838 100%)', color: 'white', border: 'none' }}>
          <div className="flex items-center gap-2 mb-1" style={{ opacity: 0.85 }}><TrendingUp size={14} /><span className="text-xs font-medium uppercase tracking-wide">Snapshot</span></div>
          <h2 className="display text-2xl mb-1">All-time totals</h2>
          <p className="hand mb-5" style={{ color: '#f1c462', fontSize: '1.1rem' }}>everything you've shipped ⭐</p>
          <div className="space-y-3">
            <DarkMetric label="Tasks completed" value={tasks.filter(t => t.status === 'done').length} />
            <DarkMetric label="Posts published" value={posts.filter(p => p.status === 'published').length} />
            <DarkMetric label="Active clients" value={clients.filter(c => c.status === 'active').length} />
            <DarkMetric label="Strategies" value={strategies.length} />
          </div>
          <button className="mt-5 w-full" style={{ background: 'rgba(255,255,255,0.12)', color: 'white', padding: '10px 18px', borderRadius: 999, fontWeight: 500, fontSize: 13, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, transition: 'all 0.15s', border: '1px solid rgba(255,255,255,0.18)' }} onClick={() => setView('reports')} onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.2)'} onMouseLeave={e => e.currentTarget.style.background = 'rgba(255,255,255,0.12)'}><BarChart3 size={13} /> View detailed reports</button>
        </div>
      </div>
    </div>
  );
}
function StatCard({ label, value, sub, onClick, alert, accent }) {
  return (
    <button onClick={onClick} className="card card-hover" style={{ textAlign: 'left', cursor: onClick ? 'pointer' : 'default', padding: 18, position: 'relative', overflow: 'hidden' }}>
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 3, background: accent || 'var(--coral)' }}></div>
      <p className="text-xs font-semibold mb-2" style={{ color: 'var(--ink-soft)' }}>{label}</p>
      <p className="stat-num" style={{ fontSize: '2rem', lineHeight: 1, marginBottom: 4 }}>{value}</p>
      <p className="text-xs" style={{ color: alert ? 'var(--pink)' : 'var(--muted)', fontWeight: alert ? 600 : 400 }}>{alert || sub}</p>
    </button>
  );
}
function DarkMetric({ label, value }) { return <div className="flex items-center justify-between pb-2.5" style={{ borderBottom: '1px solid rgba(255,255,255,0.1)' }}><span style={{ opacity: 0.85, fontSize: 13 }}>{label}</span><span className="stat-num" style={{ fontSize: '1.5rem' }}>{value}</span></div>; }

function PageHeader({ title, subtitle, action }) {
  return (
    <header className="mb-6 flex items-end justify-between gap-4">
      <div>
        <h1 className="display" style={{ fontSize: '2.2rem', fontWeight: 500, lineHeight: 1.1, marginBottom: 4 }}>{title}</h1>
        {subtitle && <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1.1rem' }}>{subtitle}</p>}
      </div>
      {action && <div>{action}</div>}
    </header>
  );
}
function EmptyState({ title, message, action, actionLabel, mood = 'happy' }) {
  return (
    <div className="card text-center" style={{ padding: '52px 30px' }}>
      <Sunny size={64} mood={mood} float />
      <h3 className="display text-xl mt-3 mb-2">{title}</h3>
      <p className="hand mb-5" style={{ color: 'var(--coral-deep)', fontSize: '1.15rem', maxWidth: 420, margin: '0 auto 20px' }}>{message}</p>
      {action && <button className="btn-primary" onClick={action}><Plus size={14} /> {actionLabel}</button>}
    </div>
  );
}

function TasksView({ tasks, team, clients, toggleStatus, onAdd, onEdit }) {
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const filtered = tasks.filter(t => filter === 'all' || t.status === filter).filter(t => !search || t.title.toLowerCase().includes(search.toLowerCase())).sort((a, b) => { const o = { high: 0, medium: 1, low: 2 }; return (o[a.priority] || 1) - (o[b.priority] || 1); });
  const buckets = ['todo', 'progress', 'review', 'done', 'blocked'];
  return (
    <div className="fade-in">
      <PageHeader title="Tasks" subtitle="everything on your plate ✨" action={<button className="btn-primary" onClick={onAdd}><Plus size={14} /> New task</button>} />
      <div className="flex items-center gap-2 mb-5 flex-wrap">
        <div className="flex items-center gap-2" style={{ background: 'var(--card)', padding: '7px 14px', borderRadius: 999, border: '1px solid var(--line)' }}><Search size={13} color="var(--muted)" /><input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search tasks..." style={{ background: 'transparent', outline: 'none', fontSize: 13, width: 200 }} /></div>
        <Pill label={`All (${tasks.length})`} active={filter === 'all'} onClick={() => setFilter('all')} />
        {buckets.map(b => { const c = tasks.filter(t => t.status === b).length; return <Pill key={b} label={`${STATUS_COLORS[b].label} (${c})`} active={filter === b} onClick={() => setFilter(b)} />; })}
      </div>
      {filtered.length === 0 ? <EmptyState title="No tasks here yet" message="add your first task and let's get cooking!" action={onAdd} actionLabel="Add task" mood="excited" /> : <div className="space-y-2">{filtered.map(t => <TaskRow key={t.id} task={t} team={team} clients={clients} onClick={() => onEdit(t)} onStatusChange={toggleStatus} />)}</div>}
    </div>
  );
}
function Pill({ label, active, onClick }) { return <button onClick={onClick} style={{ padding: '7px 14px', borderRadius: 999, fontSize: 12.5, fontWeight: 500, background: active ? 'var(--coral)' : 'var(--card)', color: active ? 'white' : 'var(--ink-soft)', border: '1px solid ' + (active ? 'var(--coral)' : 'var(--line)'), transition: 'all 0.15s', boxShadow: active ? '0 1.5px 0 var(--coral-deep)' : 'none' }}>{label}</button>; }
function TaskRow({ task, team, clients, compact, onClick, onStatusChange }) {
  const member = team.find(m => m.id === task.assigneeId);
  const client = clients.find(c => c.id === task.clientId);
  const status = STATUS_COLORS[task.status] || STATUS_COLORS.todo;
  const isOverdue = task.dueDate && task.dueDate < today() && task.status !== 'done';
  return (
    <div onClick={onClick} className="flex items-center gap-3" style={{ padding: 13, borderRadius: 14, background: 'var(--card)', border: '1px solid var(--line)', cursor: onClick ? 'pointer' : 'default', transition: 'all 0.15s' }} onMouseEnter={e => { if (onClick) { e.currentTarget.style.borderColor = 'var(--coral)'; e.currentTarget.style.transform = 'translateY(-1px)'; } }} onMouseLeave={e => { if (onClick) { e.currentTarget.style.borderColor = 'var(--line)'; e.currentTarget.style.transform = 'none'; } }}>
      <button onClick={(e) => { e.stopPropagation(); if (onStatusChange) onStatusChange(task.id, task.status === 'done' ? 'todo' : 'done'); }} style={{ flexShrink: 0, padding: 0, lineHeight: 0 }}>{task.status === 'done' ? <CheckCircle2 size={20} color="var(--sage)" /> : <Circle size={20} color="var(--muted)" />}</button>
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-1.5 mb-0.5">{task.priority === 'high' && <Flag size={11} color={PRIORITY_COLORS.high} style={{ fill: PRIORITY_COLORS.high, flexShrink: 0 }} />}<p className="text-sm font-semibold truncate" style={{ textDecoration: task.status === 'done' ? 'line-through' : 'none', opacity: task.status === 'done' ? 0.5 : 1 }}>{task.title}</p></div>
        {!compact && task.description && <p className="text-xs leading-snug truncate" style={{ color: 'var(--ink-soft)' }}>{task.description.slice(0, 100)}{task.description.length > 100 ? '...' : ''}</p>}
      </div>
      <div className="flex items-center gap-2 flex-shrink-0">
        {client && <span className="badge" style={{ background: 'var(--lavender-soft)', color: 'var(--lavender)' }}>{client.name}</span>}
        <span className="badge" style={{ background: status.bg, color: status.text }}>{status.label}</span>
        {member && <div style={{ width: 26, height: 26, borderRadius: '50%', background: 'var(--coral-soft)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--coral-deep)', fontWeight: 600, fontSize: 11, flexShrink: 0 }} title={member.name}>{member.name[0]?.toUpperCase()}</div>}
        {task.dueDate && <span className="text-xs flex items-center gap-1" style={{ color: isOverdue ? 'var(--pink)' : 'var(--ink-soft)', fontWeight: 500 }}><Clock size={11} /> {formatDate(task.dueDate)}</span>}
      </div>
    </div>
  );
}

function TeamView({ team, teams, tasks, onAddMember, onEditMember, onAddTeam, onEditTeam }) {
  const [selectedTeamId, setSelectedTeamId] = useState(null);
  const sortedTeams = [...teams].sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
  if (selectedTeamId === null) {
    return (
      <div className="fade-in">

        <div className="grid grid-cols-3 gap-3">
          {members.map(m => { const memberTasks = tasks.filter(t => t.assigneeId === m.id); const active = memberTasks.filter(t => t.status !== 'done').length; const done = memberTasks.filter(t => t.status === 'done').length; const memberTeam = teams.find(t => t.id === m.teamId); const avatarBg = memberTeam?.color || 'var(--coral)'; return (

                <div className="min-w-0"><p className="font-semibold truncate" style={{ fontSize: 14 }}>{m.name}</p><p className="text-xs truncate" style={{ color: 'var(--ink-soft)' }}>{m.role || 'Team member'}</p></div>

              <div className="flex items-center gap-4 pt-3" style={{ borderTop: '1px solid var(--line)' }}>
                <div><p className="stat-num text-lg" style={{ color: 'var(--gold)' }}>{active}</p><p className="text-xs" style={{ color: 'var(--muted)' }}>active</p></div>
                <div><p className="stat-num text-lg" style={{ color: 'var(--sage)' }}>{done}</p><p className="text-xs" style={{ color: 'var(--muted)' }}>done</p></div>

  const todayIso = new Date().toISOString();
  const filtered = (() => { if (tab === 'upcoming') return sorted.filter(p => p.status === 'scheduled' && (!p.scheduledDate || p.scheduledDate >= todayIso)); if (tab === 'draft') return sorted.filter(p => p.status === 'draft'); if (tab === 'published') return sorted.filter(p => p.status === 'published').reverse(); return sorted; })();
  return (
    <div className="fade-in">
      <PageHeader title="Content" subtitle="your content calendar 📅" action={<button className="btn-primary" onClick={onAdd}><Plus size={14} /> Schedule post</button>} />
      <div className="flex gap-2 mb-5">{[{ id: 'upcoming', label: 'Upcoming' }, { id: 'draft', label: 'Drafts' }, { id: 'published', label: 'Published' }, { id: 'all', label: 'All' }].map(t => <Pill key={t.id} label={t.label} active={tab === t.id} onClick={() => setTab(t.id)} />)}</div>
      {filtered.length === 0 ? <EmptyState title="No posts here" message="schedule your first post and let the magic begin!" action={onAdd} actionLabel="Schedule post" mood="excited" /> : (
        <div className="grid grid-cols-2 gap-3">
          {filtered.map(p => { const platform = PLATFORMS.find(pl => pl.id === p.platform); const PIcon = platform?.icon || Instagram; const client = clients.find(c => c.id === p.clientId); const hasMetrics = p.status === 'published' && (p.likes > 0 || p.comments > 0 || p.reach > 0); return (
            <button key={p.id} onClick={() => onEdit(p)} className="card card-hover" style={{ textAlign: 'left' }}>
              <div className="flex items-start gap-3 mb-3"><div style={{ width: 40, height: 40, borderRadius: 12, background: platform?.color || 'var(--coral)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><PIcon size={16} color="white" /></div><div className="flex-1 min-w-0"><div className="flex items-center gap-2 mb-0.5"><p className="text-xs font-semibold">{platform?.name}</p>{client && <span className="text-xs" style={{ color: 'var(--muted)' }}>·</span>}{client && <p className="text-xs font-semibold">{client.name}</p>}</div><p className="text-xs" style={{ color: 'var(--ink-soft)' }}>{formatDateTime(p.scheduledDate)}</p></div><span className="badge" style={{ background: p.status === 'published' ? 'var(--sage-soft)' : p.status === 'draft' ? 'var(--line-soft)' : 'var(--gold-soft)', color: p.status === 'published' ? 'var(--sage)' : p.status === 'draft' ? 'var(--ink-soft)' : '#a07a32' }}>{p.status}</span></div>
              <p className="text-sm leading-relaxed mb-3" style={{ color: 'var(--ink-soft)' }}>{p.caption?.slice(0, 180) || 'Untitled post'}{(p.caption?.length || 0) > 180 ? '...' : ''}</p>
              {p.hashtags && <p className="text-xs mb-3 font-medium" style={{ color: platform?.color || 'var(--coral)' }}>{p.hashtags.split(' ').slice(0, 5).join(' ')}</p>}
              {hasMetrics && <div className="flex items-center gap-4 mb-3 p-2.5" style={{ background: 'var(--bg-warmer)', borderRadius: 10 }}><div className="flex items-center gap-1 text-xs font-medium"><Heart size={11} color="var(--pink)" /> {p.likes || 0}</div><div className="flex items-center gap-1 text-xs font-medium"><MessageSquare size={11} color="var(--sky)" /> {p.comments || 0}</div><div className="flex items-center gap-1 text-xs font-medium"><Eye size={11} color="var(--lavender)" /> {p.reach || 0}</div></div>}
              {p.status === 'scheduled' && <div className="pt-3" style={{ borderTop: '1px solid var(--line)' }}><button onClick={(e) => { e.stopPropagation(); updateStatus(p.id, 'published'); }} className="w-full text-xs font-semibold py-2" style={{ background: 'var(--sage-soft)', color: 'var(--sage)', borderRadius: 999 }}>Mark as published 🎉</button></div>}

function ReportsView({ tasks, team, teams, clients, posts, comms, igReports, onAddIgReport, onImportIg, onEditIgReport, onEditPost }) {
  const [tab, setTab] = useState('overview');
  const [period, setPeriod] = useState('month');
  const periodTasks = tasks.filter(t => isInPeriod(t.createdAt, period));
  const periodPosts = posts.filter(p => isInPeriod(p.scheduledDate, period));
  const periodComms = comms.filter(c => isInPeriod(c.date, period));
  const periodLabel = period === 'week' ? 'Last 7 days' : period === 'month' ? 'Last 30 days' : period === 'quarter' ? 'Last 90 days' : 'All time';
  return (
    <div className="fade-in">
      <PageHeader title="Reports" subtitle="how everything's going 📊" />
      <div className="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div className="flex gap-2">{[{ id: 'overview', label: 'Overview' }, { id: 'team', label: 'Team' }, { id: 'posts', label: 'Posts' }, { id: 'instagram', label: 'Instagram' }].map(t => <Pill key={t.id} label={t.label} active={tab === t.id} onClick={() => setTab(t.id)} />)}</div>
        {tab !== 'instagram' && <div className="flex gap-1 p-1 rounded-full" style={{ background: 'var(--card)', border: '1px solid var(--line)' }}>{[{ id: 'week', label: 'Week' }, { id: 'month', label: 'Month' }, { id: 'quarter', label: 'Quarter' }, { id: 'all', label: 'All' }].map(p => <button key={p.id} onClick={() => setPeriod(p.id)} style={{ padding: '5px 12px', borderRadius: 999, fontSize: 12, fontWeight: 500, background: period === p.id ? 'var(--coral)' : 'transparent', color: period === p.id ? 'white' : 'var(--ink-soft)', transition: 'all 0.15s', border: 'none' }}>{p.label}</button>)}</div>}
      </div>
      {tab === 'overview' && <OverviewReport periodTasks={periodTasks} periodPosts={periodPosts} periodComms={periodComms} clients={clients} periodLabel={periodLabel} />}
      {tab === 'team' && <TeamReport team={team} teams={teams} periodTasks={periodTasks} tasks={tasks} periodLabel={periodLabel} />}
      {tab === 'posts' && <PostsReport periodPosts={periodPosts} clients={clients} onEditPost={onEditPost} periodLabel={periodLabel} />}
      {tab === 'instagram' && <InstagramReport reports={igReports} clients={clients} posts={posts} onAdd={onAddIgReport} onImport={onImportIg} onEdit={onEditIgReport} />}
    </div>
  );
}

function OverviewReport({ periodTasks, periodPosts, periodComms, clients, periodLabel }) {
  const completed = periodTasks.filter(t => t.status === 'done').length;
  const inProgress = periodTasks.filter(t => t.status === 'progress').length;
  const blocked = periodTasks.filter(t => t.status === 'blocked').length;
  const published = periodPosts.filter(p => p.status === 'published').length;
  const scheduled = periodPosts.filter(p => p.status === 'scheduled').length;
  const completionRate = periodTasks.length > 0 ? Math.round((completed / periodTasks.length) * 100) : 0;
  const clientActivity = clients.map(c => ({ name: c.name, posts: periodPosts.filter(p => p.clientId === c.id).length, tasks: periodTasks.filter(t => t.clientId === c.id).length, comms: periodComms.filter(co => co.clientId === c.id).length })).filter(c => c.posts + c.tasks + c.comms > 0).sort((a, b) => (b.posts + b.tasks + b.comms) - (a.posts + a.tasks + a.comms));
  const maxActivity = Math.max(...clientActivity.map(c => c.posts + c.tasks + c.comms), 1);
  return (
    <>
      <p className="hand mb-4" style={{ color: 'var(--coral-deep)', fontSize: '1.1rem' }}>{periodLabel} 📅</p>
      <div className="grid grid-cols-4 gap-3 mb-5">
        <StatCard label="Tasks created" value={periodTasks.length} sub={`${completed} done · ${inProgress} active`} accent="var(--coral)" />
        <StatCard label="Completion rate" value={completionRate + '%'} sub={blocked > 0 ? `${blocked} blocked` : 'on track'} accent="var(--sage)" />
        <StatCard label="Posts published" value={published} sub={`${scheduled} scheduled`} accent="var(--lavender)" />
        <StatCard label="Client touches" value={periodComms.length} sub="logged" accent="var(--sky)" />
      </div>
      <div className="card card-hover">
        <h3 className="display text-lg mb-1">Client activity</h3>
        <p className="hand mb-5" style={{ color: 'var(--coral-deep)', fontSize: '1.05rem' }}>where your time is going this period</p>
        {clientActivity.length === 0 ? <p className="text-sm py-3" style={{ color: 'var(--ink-soft)' }}>No activity yet — nothing to show!</p> : (
          <div className="space-y-3.5">{clientActivity.map((c, i) => { const total = c.posts + c.tasks + c.comms; const pct = (total / maxActivity) * 100; const color = TEAM_COLORS[i % TEAM_COLORS.length]; return <div key={i}><div className="flex items-center justify-between mb-1.5"><p className="text-sm font-semibold">{c.name}</p><p className="text-xs" style={{ color: 'var(--ink-soft)' }}>{c.posts} posts · {c.tasks} tasks · {c.comms} touches</p></div><div style={{ height: 8, borderRadius: 999, background: 'var(--line-soft)', overflow: 'hidden' }}><div style={{ height: '100%', width: pct + '%', background: color, transition: 'width 0.6s ease-out', borderRadius: 999 }}></div></div></div>; })}</div>
        )}
      </div>
    </>
  );
}

function TeamReport({ team, teams, periodTasks, tasks, periodLabel }) {
  const memberStats = team.map(m => { const all = tasks.filter(t => t.assigneeId === m.id); const period = periodTasks.filter(t => t.assigneeId === m.id); const periodTeam = teams.find(tm => tm.id === m.teamId); return { ...m, teamName: periodTeam?.name, teamColor: periodTeam?.color, total: all.length, periodTotal: period.length, completed: all.filter(t => t.status === 'done').length, active: all.filter(t => t.status !== 'done').length, periodCompleted: period.filter(t => t.status === 'done').length, periodInProgress: period.filter(t => t.status === 'progress').length, periodTodo: period.filter(t => t.status === 'todo').length, periodBlocked: period.filter(t => t.status === 'blocked').length }; }).sort((a, b) => b.periodCompleted - a.periodCompleted);
  const teamStats = teams.map(t => { const members = team.filter(m => m.teamId === t.id); const teamTasks = periodTasks.filter(task => members.some(m => m.id === task.assigneeId)); return { ...t, memberCount: members.length, tasksCreated: teamTasks.length, tasksCompleted: teamTasks.filter(task => task.status === 'done').length }; }).sort((a, b) => b.tasksCompleted - a.tasksCompleted);
  const maxTeamCompleted = Math.max(...teamStats.map(t => t.tasksCompleted), 1);
  return (
    <>
      <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
        <p className="hand" style={{ color: 'var(--coral-deep)', fontSize: '1.1rem' }}>{periodLabel} ✨</p>
        <div className="flex gap-2"><button onClick={() => generateTeamReportPDF(memberStats, teamStats, periodLabel, periodTasks)} className="btn-ghost"><FileText size={12} /> Export PDF</button><button onClick={() => exportTeamReportExcel(memberStats, teamStats, periodLabel, periodTasks)} className="btn-ghost"><FileSpreadsheet size={12} /> Export Excel</button></div>
      </div>
      <div className="grid grid-cols-2 gap-4">
        <div className="card card-hover">
          <h3 className="display text-lg mb-1">By team</h3>
          <p className="hand mb-4" style={{ color: 'var(--coral-deep)', fontSize: '1.05rem' }}>tasks completed by department</p>
          {teamStats.length === 0 ? <p className="text-sm py-3" style={{ color: 'var(--ink-soft)' }}>No teams yet.</p> : <div className="space-y-3.5">{teamStats.map(t => <div key={t.id}><div className="flex items-center justify-between mb-1.5"><div className="flex items-center gap-2"><div style={{ width: 10, height: 10, borderRadius: '50%', background: t.color || 'var(--coral)' }}></div><p className="text-sm font-semibold">{t.name}</p><span className="text-xs" style={{ color: 'var(--ink-soft)' }}>· {t.memberCount} {t.memberCount === 1 ? 'member' : 'members'}</span></div><p className="text-sm font-semibold" style={{ color: t.color || 'var(--coral)' }}>{t.tasksCompleted}</p></div><div style={{ height: 8, borderRadius: 999, background: 'var(--line-soft)', overflow: 'hidden' }}><div style={{ height: '100%', width: ((t.tasksCompleted / maxTeamCompleted) * 100) + '%', background: t.color || 'var(--coral)', transition: 'width 0.6s', borderRadius: 999 }}></div></div></div>)}</div>}

function PostsReport({ periodPosts, clients, onEditPost, periodLabel }) {
  const published = periodPosts.filter(p => p.status === 'published');

  const totalComments = published.reduce((s, p) => s + (p.comments || 0), 0);
  const totalReach = published.reduce((s, p) => s + (p.reach || 0), 0);
  const totalSaves = published.reduce((s, p) => s + (p.saves || 0), 0);
  const byPlatform = PLATFORMS.map(pl => ({ ...pl, count: published.filter(p => p.platform === pl.id).length, reach: published.filter(p => p.platform === pl.id).reduce((s, p) => s + (p.reach || 0), 0) })).filter(p => p.count > 0);
  const topPosts = published.filter(p => (p.reach || 0) + (p.likes || 0) > 0).sort((a, b) => ((b.reach || 0) + (b.likes || 0) * 100) - ((a.reach || 0) + (a.likes || 0) * 100)).slice(0, 6);

      <p className="hand mb-4" style={{ color: 'var(--coral-deep)', fontSize: '1.1rem' }}>{periodLabel} · {published.length} published 🚀</p>

        <StatCard label="Comments" value={totalComments.toLocaleString()} sub="conversations" accent="var(--sky)" />
        <StatCard label="Reach" value={totalReach.toLocaleString()} sub="people reached" accent="var(--lavender)" />

      <div className="grid grid-cols-3 gap-4">

          {byPlatform.length === 0 ? <p className="text-sm py-3" style={{ color: 'var(--ink-soft)' }}>Nothing published yet.</p> : <div className="space-y-3">{byPlatform.map(p => { const PIcon = p.icon; return <div key={p.id} className="flex items-center gap-3"><div style={{ width: 36, height: 36, borderRadius: 10, background: p.color, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><PIcon size={14} color="white" /></div><div className="flex-1"><p className="text-sm font-semibold">{p.name}</p><p className="text-xs" style={{ color: 'var(--ink-soft)' }}>{p.reach.toLocaleString()} reach</p></div><p className="stat-num text-lg" style={{ color: p.color }}>{p.count}</p></div>; })}</div>}
        </div>
        <div className="col-span-2 card card-hover">
          <h3 className="display text-lg mb-1">Top performers 🏆</h3>

function ModalShell({ title, onClose, onDelete, children, onSave, saveLabel = 'Save', size = 540 }) {
  const [saving, setSaving] = useState(false);
  const handleSave = async () => { setSaving(true); try { await onSave(); } finally { setSaving(false); } };
  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 50, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, background: 'rgba(58, 45, 45, 0.4)' }} onClick={onClose}>
      <div className="scale-in scroll-area" style={{ background: 'var(--card)', borderRadius: 18, width: '100%', maxWidth: size, maxHeight: '90vh', overflowY: 'auto', boxShadow: '0 20px 60px rgba(58, 45, 45, 0.2)' }} onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between" style={{ padding: '18px 22px', borderBottom: '1px solid var(--line)' }}><h2 className="display text-lg">{title}</h2><button onClick={onClose} style={{ width: 32, height: 32, borderRadius: '50%', background: 'var(--bg-warmer)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--ink-soft)' }}><X size={16} /></button></div>
        <div style={{ padding: 22 }}>{children}</div>
        <div className="flex items-center justify-between" style={{ padding: '16px 22px', borderTop: '1px solid var(--line)' }}>
          <div>{onDelete && <button onClick={async () => { if (window.confirm('Delete this?')) await onDelete(); }} style={{ fontSize: 13, fontWeight: 500, display: 'flex', alignItems: 'center', gap: 5, color: 'var(--pink)' }}><Trash2 size={12} /> Delete</button>}</div>
          <div className="flex gap-2"><button className="btn-ghost" onClick={onClose}>Cancel</button>{onSave && <button className="btn-primary" onClick={handleSave} disabled={saving}>{saving ? 'Saving...' : saveLabel}</button>}</div>
        </div>
      </div>
    </div>
  );
}

    {data.status === 'published' && <div className="p-4 mt-2" style={{ background: 'var(--bg-warmer)', borderRadius: 14, border: '1px solid var(--line)' }}><p className="text-xs font-semibold mb-3" style={{ color: 'var(--ink-soft)' }}>Performance metrics ✨</p><div className="grid grid-cols-3 gap-2"><Field label="Likes"><input type="number" min="0" className="input-field" value={data.likes || 0} onChange={e => updateNum('likes', e.target.value)} /></Field><Field label="Comments"><input type="number" min="0" className="input-field" value={data.comments || 0} onChange={e => updateNum('comments', e.target.value)} /></Field><Field label="Reach"><input type="number" min="0" className="input-field" value={data.reach || 0} onChange={e => updateNum('reach', e.target.value)} /></Field><Field label="Saves"><input type="number" min="0" className="input-field" value={data.saves || 0} onChange={e => updateNum('saves', e.target.value)} /></Field><Field label="Shares"><input type="number" min="0" className="input-field" value={data.shares || 0} onChange={e => updateNum('shares', e.target.value)} /></Field></div></div>}
    <div className="mt-2"><Field label="Notes"><textarea className="input-field" rows={2} value={data.notes || ''} onChange={e => update('notes', e.target.value)} placeholder="Asset links, references..." /></Field></div>
  </ModalShell>);
}
function SheetModal({ sheet, onSave, onDelete, onClose }) {
  const [data, setData] = useState(sheet || { name: '', url: '', description: '', tag: '' });
  const update = (k, v) => setData({ ...data, [k]: v });
  return (<ModalShell title={sheet ? 'Edit sheet' : 'Add sheet'} onClose={onClose} onDelete={onDelete} onSave={() => data.name.trim() && data.url.trim() && onSave(data)}>
    <Field label="Sheet name"><input className="input-field" value={data.name} onChange={e => update('name', e.target.value)} placeholder="e.g. Content Calendar Q2" /></Field>
    <Field label="URL"><input className="input-field" value={data.url} onChange={e => update('url', e.target.value)} placeholder="https://docs.google.com/..." /></Field>
    <Field label="Tag"><input className="input-field" value={data.tag || ''} onChange={e => update('tag', e.target.value)} placeholder="e.g. Reports" /></Field>
    <Field label="Description"><textarea className="input-field" rows={2} value={data.description || ''} onChange={e => update('description', e.target.value)} placeholder="What's inside?" /></Field>
  </ModalShell>);
}
function StrategyModal({ strategy, clients, onSave, onDelete, onClose }) {
  const [data, setData] = useState(strategy || { title: '', content: '', clientId: '', tags: '' });
  const update = (k, v) => setData({ ...data, [k]: v });
  return (<ModalShell title={strategy ? 'Edit strategy' : 'New strategy'} onClose={onClose} onDelete={onDelete} onSave={() => data.title.trim() && onSave(data)}>
    <Field label="Title"><input className="input-field" value={data.title} onChange={e => update('title', e.target.value)} placeholder="The big idea" /></Field>
    <div className="grid grid-cols-2 gap-3"><Field label="Client"><select className="input-field" value={data.clientId || ''} onChange={e => update('clientId', e.target.value)}><option value="">No specific client</option>{clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></Field><Field label="Tags"><input className="input-field" value={data.tags || ''} onChange={e => update('tags', e.target.value)} placeholder="campaign, launch" /></Field></div>
    <Field label="Strategy"><textarea className="input-field" rows={10} value={data.content || ''} onChange={e => update('content', e.target.value)} placeholder="Goals, audience, content pillars..." /></Field>
  </ModalShell>);
}
function CommModal({ comm, clients, onSave, onClose }) {
  const [data, setData] = useState({ clientId: comm?.clientId || '', type: 'meeting', summary: '', date: new Date().toISOString().slice(0, 16) });
  const update = (k, v) => setData({ ...data, [k]: v });
  return (<ModalShell title="Log conversation" onClose={onClose} onSave={() => data.summary.trim() && onSave(data)}>
    <div className="grid grid-cols-2 gap-3"><Field label="Client"><select className="input-field" value={data.clientId || ''} onChange={e => update('clientId', e.target.value)}><option value="">Select client</option>{clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></Field><Field label="Type"><select className="input-field" value={data.type} onChange={e => update('type', e.target.value)}><option value="meeting">Meeting</option><option value="call">Call</option><option value="email">Email</option><option value="message">Message</option><option value="note">Note</option></select></Field></div>
    <Field label="Date & time"><input type="datetime-local" className="input-field" value={data.date} onChange={e => update('date', e.target.value)} /></Field>
    <Field label="Summary"><textarea className="input-field" rows={5} value={data.summary} onChange={e => update('summary', e.target.value)} placeholder="What was discussed?" /></Field>
  </ModalShell>);
}
function IgReportModal({ report, clients, posts, onSave, onDelete, onClose }) {
  const [data, setData] = useState(report || { clientId: '', month: currentMonth(), followers: 0, followersGained: 0, reach: 0, impressions: 0, profileVisits: 0, websiteClicks: 0, engagementRate: 0, totalPosts: 0, totalStories: 0, totalReels: 0, notes: '' });
  const update = (k, v) => setData({ ...data, [k]: v });
  const updateNum = (k, v) => setData({ ...data, [k]: v === '' ? 0 : parseFloat(v) || 0 });
  const handleDownloadPDF = () => { if (!data.clientId || !data.month) { alert('Please select a client and month first'); return; } const client = clients.find(c => c.id === data.clientId); const monthPosts = posts.filter(p => p.status === 'published' && p.platform === 'instagram' && p.clientId === data.clientId && p.scheduledDate?.startsWith(data.month)); generateInstagramReportPDF(data, client, monthPosts); };
  const handleDownloadExcel = () => { if (!data.clientId || !data.month) { alert('Please select a client and month first'); return; } const client = clients.find(c => c.id === data.clientId); const monthPosts = posts.filter(p => p.status === 'published' && p.platform === 'instagram' && p.clientId === data.clientId && p.scheduledDate?.startsWith(data.month)); exportInstagramReportExcel(data, client, monthPosts); };
  return (<ModalShell title={report ? 'Edit Instagram report' : 'New Instagram report'} onClose={onClose} onDelete={onDelete} onSave={() => data.clientId && data.month && onSave(data)} size={620}>
    <div className="grid grid-cols-2 gap-3"><Field label="Client"><select className="input-field" value={data.clientId || ''} onChange={e => update('clientId', e.target.value)}><option value="">Select client</option>{clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></Field><Field label="Month"><input type="month" className="input-field" value={data.month} onChange={e => update('month', e.target.value)} /></Field></div>
    <div className="p-4 mb-3" style={{ background: 'var(--bg-warmer)', borderRadius: 14 }}><p className="text-xs font-semibold mb-3" style={{ color: 'var(--ink-soft)' }}>Audience & growth ✨</p><div className="grid grid-cols-2 gap-3"><Field label="Total followers"><input type="number" min="0" className="input-field" value={data.followers || 0} onChange={e => updateNum('followers', e.target.value)} /></Field><Field label="Followers gained"><input type="number" className="input-field" value={data.followersGained || 0} onChange={e => updateNum('followersGained', e.target.value)} /></Field><Field label="Profile visits"><input type="number" min="0" className="input-field" value={data.profileVisits || 0} onChange={e => updateNum('profileVisits', e.target.value)} /></Field><Field label="Website clicks"><input type="number" min="0" className="input-field" value={data.websiteClicks || 0} onChange={e => updateNum('websiteClicks', e.target.value)} /></Field></div></div>
    <div className="p-4 mb-3" style={{ background: 'var(--bg-warmer)', borderRadius: 14 }}><p className="text-xs font-semibold mb-3" style={{ color: 'var(--ink-soft)' }}>Reach & engagement</p><div className="grid grid-cols-3 gap-3"><Field label="Reach"><input type="number" min="0" className="input-field" value={data.reach || 0} onChange={e => updateNum('reach', e.target.value)} /></Field><Field label="Impressions"><input type="number" min="0" className="input-field" value={data.impressions || 0} onChange={e => updateNum('impressions', e.target.value)} /></Field><Field label="Engagement %"><input type="number" min="0" step="0.01" className="input-field" value={data.engagementRate || 0} onChange={e => updateNum('engagementRate', e.target.value)} placeholder="3.5" /></Field></div></div>
    <div className="p-4 mb-3" style={{ background: 'var(--bg-warmer)', borderRadius: 14 }}><p className="text-xs font-semibold mb-3" style={{ color: 'var(--ink-soft)' }}>Content count</p><div className="grid grid-cols-3 gap-3"><Field label="Posts"><input type="number" min="0" className="input-field" value={data.totalPosts || 0} onChange={e => updateNum('totalPosts', e.target.value)} /></Field><Field label="Reels"><input type="number" min="0" className="input-field" value={data.totalReels || 0} onChange={e => updateNum('totalReels', e.target.value)} /></Field><Field label="Stories"><input type="number" min="0" className="input-field" value={data.totalStories || 0} onChange={e => updateNum('totalStories', e.target.value)} /></Field></div></div>
    <Field label="Notes / observations"><textarea className="input-field" rows={3} value={data.notes || ''} onChange={e => update('notes', e.target.value)} placeholder="What worked? What didn't?" /></Field>
    {report && <div className="flex gap-2 pt-3" style={{ borderTop: '1px solid var(--line)' }}><button onClick={handleDownloadPDF} className="flex-1 text-sm py-2.5 font-semibold flex items-center justify-center gap-1.5" style={{ background: 'var(--ink)', color: 'white', borderRadius: 999 }}><FileText size={12} /> Download PDF</button><button onClick={handleDownloadExcel} className="flex-1 text-sm py-2.5 font-semibold flex items-center justify-center gap-1.5" style={{ background: 'var(--sage)', color: 'white', borderRadius: 999 }}><FileSpreadsheet size={12} /> Download Excel</button></div>}
  </ModalShell>);
}

function IgImportModal({ clients, onSave, onClose }) {
  const [step, setStep] = useState('upload');
  const [parsed, setParsed] = useState(null);
  const [data, setData] = useState({ clientId: '', month: currentMonth(), followers: 0, followersGained: 0, reach: 0, impressions: 0, profileVisits: 0, websiteClicks: 0, engagementRate: 0, totalPosts: 0, totalStories: 0, totalReels: 0, notes: 'Imported from Meta Business Suite' });
  const [dragging, setDragging] = useState(false);
  const [error, setError] = useState('');
  const fileInputRef = useRef(null);
  const handleFile = async (file) => {
    setError('');
    try { const buffer = await file.arrayBuffer(); const found = parseMetaExcel(buffer); if (Object.keys(found).length === 0) { setError('Could not find Instagram metrics. Try entering manually, or check that the file has labels like "Followers", "Reach" etc.'); return; } setParsed(found); setData(d => ({ ...d, ...found })); setStep('preview'); } catch (err) { setError('Failed to read file: ' + err.message); }
  };
  const update = (k, v) => setData({ ...data, [k]: v });
  const updateNum = (k, v) => setData({ ...data, [k]: v === '' ? 0 : parseFloat(v) || 0 });
  return (<ModalShell title="Import from Meta" onClose={onClose} onSave={step === 'preview' ? () => data.clientId && data.month && onSave(data) : null} saveLabel="Save report" size={620}>
    {step === 'upload' && (
      <div>
        <p className="hand text-center mb-4" style={{ color: 'var(--coral-deep)', fontSize: '1.2rem' }}>drop your Meta export here ✨</p>
        <p className="text-sm text-center mb-5" style={{ color: 'var(--ink-soft)' }}>We'll extract the metrics automatically.</p>
        <div className={`drop-zone ${dragging ? 'dragging' : ''}`} onClick={() => fileInputRef.current?.click()} onDragOver={(e) => { e.preventDefault(); setDragging(true); }} onDragLeave={() => setDragging(false)} onDrop={(e) => { e.preventDefault(); setDragging(false); const file = e.dataTransfer.files[0]; if (file) handleFile(file); }}>
          <Upload size={32} color="var(--coral)" style={{ margin: '0 auto 10px' }} />
          <p className="display text-lg mb-1">Drop your Excel file here</p>
          <p className="text-xs" style={{ color: 'var(--ink-soft)' }}>or click to browse · .xlsx, .xls, .csv</p>
          <input ref={fileInputRef} type="file" accept=".xlsx,.xls,.csv" style={{ display: 'none' }} onChange={(e) => { const f = e.target.files[0]; if (f) handleFile(f); }} />
        </div>
        {error && <div className="mt-3 p-3 flex items-start gap-2" style={{ background: 'var(--pink-soft)', borderRadius: 12, border: '1px solid #f0c5d2' }}><AlertCircle size={14} color="var(--pink)" style={{ marginTop: 2, flexShrink: 0 }} /><p className="text-sm" style={{ color: 'var(--pink)' }}>{error}</p></div>}
        <div className="mt-3 p-3" style={{ background: 'var(--bg-warmer)', borderRadius: 12 }}><p className="text-xs" style={{ color: 'var(--ink-soft)' }}>💡 Looks for labels like "Followers", "Reach", "Impressions", "Profile visits", "Website clicks", "Posts", "Reels", "Stories"</p></div>
      </div>
    )}
    {step === 'preview' && (
      <div>
        <div className="mb-4 p-3 flex items-start gap-2" style={{ background: 'var(--sage-soft)', borderRadius: 12 }}><CheckCircle2 size={16} color="var(--sage)" style={{ marginTop: 2, flexShrink: 0 }} /><div><p className="text-sm font-semibold" style={{ color: 'var(--sage)' }}>Found {Object.keys(parsed).length} metric{Object.keys(parsed).length === 1 ? '' : 's'}!</p><p className="text-xs" style={{ color: 'var(--sage)' }}>Review and edit anything below before saving.</p></div></div>
        <div className="grid grid-cols-2 gap-3 mb-3"><Field label="Client *"><select className="input-field" value={data.clientId} onChange={e => update('clientId', e.target.value)}><option value="">Select client</option>{clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></Field><Field label="Month *"><input type="month" className="input-field" value={data.month} onChange={e => update('month', e.target.value)} /></Field></div>
        <div className="p-3 mb-3" style={{ background: 'var(--bg-warmer)', borderRadius: 14 }}><p className="text-xs font-semibold mb-3" style={{ color: 'var(--ink-soft)' }}>Audience & reach</p><div className="grid grid-cols-2 gap-2"><PreviewField label="Followers" value={data.followers} found={parsed.followers !== undefined} onChange={v => updateNum('followers', v)} /><PreviewField label="Followers gained" value={data.followersGained} found={parsed.followersGained !== undefined} onChange={v => updateNum('followersGained', v)} /><PreviewField label="Reach" value={data.reach} found={parsed.reach !== undefined} onChange={v => updateNum('reach', v)} /><PreviewField label="Impressions" value={data.impressions} found={parsed.impressions !== undefined} onChange={v => updateNum('impressions', v)} /><PreviewField label="Profile visits" value={data.profileVisits} found={parsed.profileVisits !== undefined} onChange={v => updateNum('profileVisits', v)} /><PreviewField label="Website clicks" value={data.websiteClicks} found={parsed.websiteClicks !== undefined} onChange={v => updateNum('websiteClicks', v)} /></div></div>
        <div className="p-3 mb-3" style={{ background: 'var(--bg-warmer)', borderRadius: 14 }}><p className="text-xs font-semibold mb-3" style={{ color: 'var(--ink-soft)' }}>Content count</p><div className="grid grid-cols-3 gap-2"><PreviewField label="Posts" value={data.totalPosts} found={parsed.totalPosts !== undefined} onChange={v => updateNum('totalPosts', v)} /><PreviewField label="Reels" value={data.totalReels} found={parsed.totalReels !== undefined} onChange={v => updateNum('totalReels', v)} /><PreviewField label="Stories" value={data.totalStories} found={parsed.totalStories !== undefined} onChange={v => updateNum('totalStories', v)} /></div></div>
        <Field label="Engagement rate %"><input type="number" min="0" step="0.01" className="input-field" value={data.engagementRate} onChange={e => updateNum('engagementRate', e.target.value)} placeholder="3.5" /></Field>
        <Field label="Notes"><textarea className="input-field" rows={2} value={data.notes} onChange={e => update('notes', e.target.value)} /></Field>
        <button onClick={() => setStep('upload')} className="btn-ghost text-xs"><ChevronLeft size={11} /> Upload different file</button>
      </div>
    )}
  </ModalShell>);
}
function PreviewField({ label, value, found, onChange }) {
  return <Field label={<span className="flex items-center gap-1.5">{label}{found && <span className="badge" style={{ background: 'var(--sage-soft)', color: 'var(--sage)', fontSize: 9 }}>found</span>}</span>}><input type="number" min="0" className="input-field" value={value} onChange={e => onChange(e.target.value)} style={{ borderColor: found ? 'var(--sage)' : 'var(--line)' }} /></Field>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
